// ===============================
async function loadYoutube(){

  const youtubeRef = ref(database, "youtubeRekomendasi");

  const snap = await get(youtubeRef);

  if(!snap.exists()){
    await set(youtubeRef, dummyYoutube);
    return loadYoutube();
  }

  const data = snap.val();

  // 🔥 FIX URUTAN
  let list = Object.keys(data).map(key => ({
    id: key,
    ...data[key]
  }));

  // 🔥 TERBARU DI ATAS
  list.sort((a,b)=> (b.createdAt || 0) - (a.createdAt || 0));

  youtubeContainer.innerHTML = "";

  list.forEach((item)=>{

    const videoId = extractYoutubeID(item.url);

    youtubeContainer.innerHTML += `
  <div class="youtube-card" onclick="openYoutube('${item.url}')">

    <img class="youtube-thumb"
      src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg">

    <div>
      <div class="youtube-title">
        ${item.judul}
      </div>

      <div style="font-size:11px;color:#666;margin-top:5px;">
        ${item.deskripsi || ""}
      </div>
    </div>

  </div>
`;

  });
}

// ===============================
// EXTRACT ID
// ===============================
function extractYoutubeID(url){
  const match = url.match(/(?:v=|youtu\.be\/|embed\/)([^&?/]+)/);
  return match ? match[1] : "";
}

  // ===============================
  // SLIDER
  // ===============================

  let currentSlide = 0;

  window.slideFoto = function(direction){

    const wrapper =
      document.getElementById("sliderWrapper");

    if(!wrapper) return;

    const totalSlide =
      wrapper.children.length;

    currentSlide += direction;

    // LOOP

    if(currentSlide < 0){

      currentSlide =
        totalSlide - 1;

    }

    if(currentSlide >= totalSlide){

      currentSlide = 0;

    }

    wrapper.style.transform =
      `translateX(-${currentSlide * 100}%)`;

  }

  // ===============================
  // THUMBNAIL CLICK
  // ===============================

  window.goToSlide = function(index){

    const wrapper =
      document.getElementById("sliderWrapper");

    if(!wrapper) return;

    currentSlide = index;

    wrapper.style.transform =
      `translateX(-${currentSlide * 100}%)`;

  }

// BUKA FOTO

  );

  modalImage.style.transform =

window.closeImageModal = function(){

  imageModal.classList.remove(

  );

}

// ===============================
// CLICK BACKGROUND TUTUP
// ===============================

imageModal.addEventListener(
  "click",
  function(e){

    if(
      e.target === imageModal
    ){

      closeImageModal();

    }

  }
);

// ===============================
// ZOOM SCROLL PC
// ===============================

modalImage.addEventListener(
  "wheel",
  function(e){

    e.preventDefault();

    if(e.deltaY < 0){

      scale += 0.2;

    }else{

      scale -= 0.2;

    }

    // BATAS

    if(scale < 1){
      scale = 1;
    }

    if(scale > 6){
      scale = 6;
    }

    modalImage.style.transform =
      `scale(${scale})`;

  }
);

// ===============================
// DOUBLE CLICK ZOOM
// ===============================

modalImage.addEventListener(
  "dblclick",
  function(){

    if(scale === 1){

      scale = 2.5;

    }else{

      scale = 1;

    }

    modalImage.style.transform =
      `scale(${scale})`;

  }
);

// ===============================
// PINCH ZOOM HP
// ===============================

let startDistance = 0;

function getDistance(touches){

  return Math.sqrt(

    Math.pow(
      touches[0].clientX -
      touches[1].clientX,
      2
    )

    +

    Math.pow(
      touches[0].clientY -
      touches[1].clientY,
      2
    )

  );

}

modalImage.addEventListener(
  "touchstart",
  function(e){

    if(e.touches.length === 2){

      startDistance =
        getDistance(e.touches);

    }

  }
);

modalImage.addEventListener(
  "touchmove",
  function(e){

    if(e.touches.length === 2){

      e.preventDefault();

      const newDistance =
        getDistance(e.touches);

      if(newDistance > startDistance){

        scale += 0.03;

      }else{

        scale -= 0.03;

      }

      // LIMIT

      if(scale < 1){
        scale = 1;
      }

      if(scale > 6){
        scale = 6;
      }

      modalImage.style.transform =
        `scale(${scale})`;

      startDistance = newDistance;

    }

  },
  { passive:false }
);

// ===============================
// ESC CLOSE
// ===============================

document.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Escape"){

      closeImageModal();

    }

  }
);
