<script type="module">

// ======================
// FIREBASE CONFIG
// ======================

const firebaseConfig = {

  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b"

};

initializeApp(firebaseConfig);

const database =
getDatabase(app);

const auth =
getAuth(app);

let currentUser = null;















/* =========================
MAINTENANCE GLOBAL
========================= */

async function cekMaintenance(){

try{

const snap =
await get(
ref(
database,
"maintenance"
)
);

if(
!snap.exists()
)
return;

const data =
snap.val();

// maintenance OFF

if(
data.aktif !== true
)
return;

// halaman sekarang

const page =
window.location.pathname
.toLowerCase();

// jangan redirect
// kalau sudah maintenance

if(
page.includes(
"maintenance.html"
)
){
return;
}

// bypass admin

if(

page.includes(
"admin"
)

||

page.includes(
"bendahara"
)

){
return;
}

// redirect

window.location.href =
"https://paskibrapadangtualang.net/maintenance.html";

}catch(err){

console.log(
"Maintenance Error:",
err
);

}

}

cekMaintenance();












// ======================
// CEK LOGIN + VALIDASI STATUS
// ======================

onAuthStateChanged(auth, async(user)=>{

  // ======================
  // BELUM LOGIN
  // ======================

  if(!user){

    document.body.innerHTML = `
      <div style="
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        flex-direction:column;
        background:#f5f5f5;
        padding:20px;
        text-align:center;
      ">

        <img src="assets/images/locked.png"
        style="
          width:120px;
          margin-bottom:15px;
        ">

        <h2 style="color:#c40000;">
          AKSES DITOLAK
        </h2>

        <p style="
          color:#555;
          margin-top:10px;
          line-height:1.6;
          font-size:14px;
        ">
          Kamu harus login terlebih dahulu
          untuk membuka halaman ini.
        </p>

      </div>
    `;

    return;

  }

  currentUser = user;

  try{

    // ======================
    // AMBIL DATA USER
    // ======================

    const userSnap = await get(
      ref(database, "users/" + user.uid)
    );

    // ======================
    // JIKA DATA TIDAK ADA
    // ======================

    if(!userSnap.exists()){

      forceBlocked(
        "Data akun tidak ditemukan"
      );

      return;

    }

    const userData = userSnap.val();

    const status =
  userData.statusPenerimaan ?? "Belum ada status";

    // ======================
    // HANYA DITERIMA
    // ======================

    if(status !== "Diterima"){

      forceBlocked(status);

      return;

    }

    // ======================
    // LOLOS
    // ======================

    loadInfo();

  }catch(error){

    console.log(error);

    forceBlocked(
      "Terjadi kesalahan sistem"
    );

  }

});


// ======================
// HALAMAN BLOKIR
// ======================

function forceBlocked(status){

  const finalStatus = status?.toString()?.trim() || "Tidak diketahui";

  document.body.innerHTML = `

    <div style="
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      background:#f5f5f5;
      padding:20px;
      text-align:center;
    ">

      <img src="assets/images/banned_icon.png"
      style="width:130px;margin-bottom:18px;">

      <h2 style="color:#c40000;margin-bottom:10px;">
        AKSES TIDAK DIIZINKAN
      </h2>

      <div style="
        background:white;
        padding:15px;
        border-radius:14px;
        width:100%;
        max-width:330px;
      ">

        <div style="font-size:14px;color:#444;line-height:1.7;">

          STATUS AKUN KAMU :
          <br><br>

          <b style="
            color:#c40000;
            font-size:18px;
          ">
            ${finalStatus}
          </b>

          <br><br>

          Halaman ini hanya dapat diakses oleh peserta yang sudah diterima admin.

        </div>

      </div>

    </div>

  `;

  throw new Error("BLOCKED");
}
// ======================
// LOAD INFO
// ======================

async function loadInfo(){

  const chatBox =
    document.getElementById(
      "chatBox"
    );

  const infoRef =
    ref(database, "info");

  onValue(infoRef, async(snapshot)=>{

    if(!snapshot.exists()){

      chatBox.innerHTML = `
        <div class="loading">
          Belum ada informasi
        </div>
      `;

      return;

    }

    // ======================
    // FILTER CHAT
    // ======================

   const data =
  Object.entries(snapshot.val())
  .filter(([key,item]) => {

    // ❌ HAPUS DATA KOSONG / SUDAH DIDELETE
    if (!item) return false;

    if (!item.isi && !item.gambar) return false;

    if (!item.type) return false;

    // filter lama kamu tetap jalan
    return item.type !== "gabung-purna";

  });

    // ======================
    // JIKA KOSONG
    // ======================

    if(data.length === 0){

chatBox.innerHTML = `
  <div class="loading" style="text-align:center; line-height:1.6;">

    <img src="assets/images/advertisement.png" 
         style="
           width:140px;
           height:auto;
           margin-bottom:12px;
           border-radius:12px;
         ">

    <div style="font-weight:bold; font-size:15px;">
      Selamat datang di menu pesan informasi~
    </div>

    <div style="font-size:13px; color:#777; margin-top:5px;">
      saat ini belum ada pesan informasi terbaru!
    </div>

  </div>
`;

      return;

    }

    // ======================
    // TERBARU DI BAWAH
    // ======================

  data.sort((a, b) => {
  const timeA = a[1].timestamp || a[1].tanggal || 0;
  const timeB = b[1].timestamp || b[1].tanggal || 0;

  return timeA - timeB; // lama → baru (TERBARU DI BAWAH)
});

    let html = "";

    // ======================
    // AMBIL DATA VIEWER
    // ======================

    let viewerData = {

      nama : "User",
      foto : "",
      role : "user"

    };

    if(currentUser){

      // USERS

      const userSnap =
        await get(
          ref(
            database,
            "users/" + currentUser.uid
          )
        );

      if(userSnap.exists()){

        const userData =
          userSnap.val();

        viewerData = {

          nama :
            userData.namaLengkap ||
            userData.nama ||
            "User",

          foto :
            userData.fotoSelfie ||
            userData.foto ||
            "",

          role : "user"

        };

      }

      // ADMIN

      const adminSnap =
        await get(
          ref(
            database,
            "admin/" + currentUser.uid
          )
        );

      if(adminSnap.exists()){

        const adminData =
          adminSnap.val();

        viewerData = {

          nama :
            adminData.nama ||
            "Admin",

          foto :
            adminData.foto ||
            "",

          role : "admin"

        };

      }

      // PURNA

      const purnaSnap =
        await get(
          ref(
            database,
            "purna/" + currentUser.uid
          )
        );

      if(purnaSnap.exists()){

        const purnaData =
          purnaSnap.val();

        viewerData = {

          nama :
            purnaData.namaPurna ||
            "Purna",

          foto :
            purnaData.foto ||
            "",

          role : "purna"

        };

      }

    }

    // ======================
    // LOOP CHAT
    // ======================

    for(const [key,item] of data){

      // ======================
      // AUTO VIEW
      // ======================

      if(currentUser){

        try{

          await update(
            ref(
              database,
              "info/" + key + "/views"
            ),
            {

              [currentUser.uid]:{

                nama :
                  viewerData.nama,

                foto :
                  viewerData.foto,

                role :
                  viewerData.role,

                waktu :
                  Date.now()

              }

            }
          );

        }catch(error){

          console.log(error);

        }

      }

      // ======================
      // DEFAULT
      // ======================

      let nama =
        item.nama ||
        "User";

      let foto =
        item.foto ||
        "assets/images/RI.webp";

      let role =
        "Admin";

      // ======================
      // JIKA PURNA
      // ======================

      if(
        item.role === "purna" ||
        item.type === "chat-purna"
      ){

        role = "Purna";

        if(item.uid){

          try{

            const purnaSnap =
              await get(
                ref(
                  database,
                  "purna/" + item.uid
                )
              );

            if(purnaSnap.exists()){

              const purnaData =
                purnaSnap.val();

              nama =
                purnaData.namaPurna ||
                nama;

              foto =
                purnaData.foto ||
                foto;

            }

          }catch(error){

            console.log(error);

          }

        }

      }

      // ======================
      // JIKA USER
      // ======================

      if(
        item.role === "user" ||
        item.type === "chat-user"
      ){

        role = "User";

      }

      // ======================
      // HTML CHAT
      // ======================

      html += `

      <div class="chat-item">

        <img
        src="${foto}"
        class="chat-avatar">

        <div class="chat-bubble">

          <div class="chat-top">

            <div class="chat-title">
              ${nama}
            </div>

            <div class="role-badge">
              ${role}
            </div>

          </div>

          <div class="chat-message">

            ${item.isi || "-"}

          </div>

          ${
            item.gambar
            ?
            `
            <img
            src="${item.gambar}"
            class="chat-image">
            `
            :
            ""
          }

          <div class="chat-date">

            ${item.tanggal || ""}

          </div>

        </div>

      </div>

      `;

    }

    // ======================
    // TAMPILKAN
    // ======================

    chatBox.innerHTML = html;

    // ======================
    // AUTO SCROLL
    // ======================

    setTimeout(()=>{

      window.scrollTo({

        top:document.body.scrollHeight,

        behavior:"smooth"

      });

    },200);

  });

}

loadInfo();

</script>
