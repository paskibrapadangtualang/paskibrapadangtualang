<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Info Hari Ini</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

*{
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
  -ms-user-select:none;
}

img{
  -webkit-user-drag:none;
  -webkit-user-select:none;
  user-select:none;
}

a,
button,
div{
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  touch-action:manipulation;
}

body{
  background:#f5f5f5;
  padding-bottom:90px;
}

/* HEADER */

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:65px;
  background:#c40000;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:bold;
  z-index:1000;
  box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

/* CONTAINER */

.container{
  padding:85px 15px 20px;
}

/* CHAT */

.chat-box{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.chat-item{
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.chat-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
  border:2px solid #fff;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.chat-bubble{
  background:white;
  padding:14px;
  border-radius:15px;
  width:100%;
  box-shadow:0 2px 5px rgba(0,0,0,0.08);
}

.chat-top{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
  flex-wrap:wrap;
}

.chat-title{
  font-size:15px;
  font-weight:bold;
  color:#c40000;
}

.role-badge{
  font-size:11px;
  background:#c40000;
  color:white;
  padding:4px 8px;
  border-radius:30px;
}

.chat-message{
  font-size:14px;
  color:#444;
  line-height:1.6;
  word-break:break-word;
}

.chat-image{
  width:100%;
  margin-top:10px;
  border-radius:12px;
}

.chat-date{
  font-size:11px;
  color:#888;
  margin-top:10px;
  text-align:right;
}

/* LOADING */

.loading{
  text-align:center;
  color:#777;
  margin-top:30px;
}

/* NAVBAR */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -2px 5px rgba(0,0,0,0.1);
}

.nav-item{
  text-decoration:none;
  color:#444;
  font-size:12px;
  font-weight:bold;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.nav-item img{
  width:24px;
  height:24px;
  object-fit:contain;
}

.active{
  color:#c40000;
}

</style>
</head>
<body>

<!-- HEADER -->
<header>
  INFO HARI INI
</header>

<!-- CONTAINER -->
<div class="container">

  <div
  class="chat-box"
  id="chatBox">

    <div class="loading">
      Loading pesan...
    </div>

  </div>

</div>

<!-- NAVBAR -->
<nav class="bottom-nav">

  <a href="home.html" class="nav-item">
    <img src="assets/images/home.png">
    <span>Home</span>
  </a>

  <a href="postingan.html" class="nav-item">
    <img src="assets/images/postingan.png">
    <span>Postingan</span>
  </a>

  <a href="user.html" class="nav-item active">
    <img src="assets/images/user.png">
    <span>User</span>
  </a>

</nav>

<!-- FIREBASE -->
<script type="module">

// ======================
// FIREBASE
// ======================

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,
  ref,
  onValue,
  get,
  update
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ======================
// FIREBASE CONFIG
// ======================

const firebaseConfig = {

  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b"

};

// ======================
// INIT
// ======================

const app =
initializeApp(firebaseConfig);

const database =
getDatabase(app);

const auth =
getAuth(app);

let currentUser = null;








// ======================
// CEK LOGIN + VALIDASI STATUS
// ======================

onAuthStateChanged(auth, async(user)=>{

  // ======================
  // BELUM LOGIN
  // ======================

  if(!user){

    document.body.innerHTML = `
      <div style="
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        flex-direction:column;
        background:#f5f5f5;
        padding:20px;
        text-align:center;
      ">

        <img src="assets/images/locked.png"
        style="
          width:120px;
          margin-bottom:15px;
        ">

        <h2 style="color:#c40000;">
          AKSES DITOLAK
        </h2>

        <p style="
          color:#555;
          margin-top:10px;
          line-height:1.6;
          font-size:14px;
        ">
          Kamu harus login terlebih dahulu
          untuk membuka halaman ini.
        </p>

      </div>
    `;

    return;

  }

  currentUser = user;

  try{

    // ======================
    // AMBIL DATA USER
    // ======================

    const userSnap = await get(
      ref(database, "users/" + user.uid)
    );

    // ======================
    // JIKA DATA TIDAK ADA
    // ======================

    if(!userSnap.exists()){

      forceBlocked(
        "Data akun tidak ditemukan"
      );

      return;

    }

    const userData = userSnap.val();

    const status =
  userData.statusPenerimaan ?? "Belum ada status";

    // ======================
    // HANYA DITERIMA
    // ======================

    if(status !== "Diterima"){

      forceBlocked(status);

      return;

    }

    // ======================
    // LOLOS
    // ======================

    loadInfo();

  }catch(error){

    console.log(error);

    forceBlocked(
      "Terjadi kesalahan sistem"
    );

  }

});


// ======================
// HALAMAN BLOKIR
// ======================

function forceBlocked(status){

  const finalStatus = status?.toString()?.trim() || "Tidak diketahui";

  document.body.innerHTML = `

    <div style="
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      background:#f5f5f5;
      padding:20px;
      text-align:center;
    ">

      <img src="assets/images/banned_icon.png"
      style="width:130px;margin-bottom:18px;">

      <h2 style="color:#c40000;margin-bottom:10px;">
        AKSES TIDAK DIIZINKAN
      </h2>

      <div style="
        background:white;
        padding:15px;
        border-radius:14px;
        width:100%;
        max-width:330px;
      ">

        <div style="font-size:14px;color:#444;line-height:1.7;">

          STATUS AKUN KAMU :
          <br><br>

          <b style="
            color:#c40000;
            font-size:18px;
          ">
            ${finalStatus}
          </b>

          <br><br>

          Halaman ini hanya dapat diakses oleh peserta yang sudah diterima admin.

        </div>

      </div>

    </div>

  `;

  throw new Error("BLOCKED");
}
// ======================
// LOAD INFO
// ======================

async function loadInfo(){

  const chatBox =
    document.getElementById(
      "chatBox"
    );

  const infoRef =
    ref(database, "info");

  onValue(infoRef, async(snapshot)=>{

    if(!snapshot.exists()){

      chatBox.innerHTML = `
        <div class="loading">
          Belum ada informasi
        </div>
      `;

      return;

    }

    // ======================
    // FILTER CHAT
    // ======================

   const data =
  Object.entries(snapshot.val())
  .filter(([key,item]) => {

    // ❌ HAPUS DATA KOSONG / SUDAH DIDELETE
    if (!item) return false;

    if (!item.isi && !item.gambar) return false;

    if (!item.type) return false;

    // filter lama kamu tetap jalan
    return item.type !== "gabung-purna";

  });

    // ======================
    // JIKA KOSONG
    // ======================

    if(data.length === 0){

chatBox.innerHTML = `
  <div class="loading" style="text-align:center; line-height:1.6;">

    <img src="assets/images/advertisement.png" 
         style="
           width:140px;
           height:auto;
           margin-bottom:12px;
           border-radius:12px;
         ">

    <div style="font-weight:bold; font-size:15px;">
      Selamat datang di menu pesan informasi~
    </div>

    <div style="font-size:13px; color:#777; margin-top:5px;">
      saat ini belum ada pesan informasi terbaru!
    </div>

  </div>
`;

      return;

    }

    // ======================
    // TERBARU DI BAWAH
    // ======================

  data.sort((a, b) => {
  const timeA = a[1].timestamp || a[1].tanggal || 0;
  const timeB = b[1].timestamp || b[1].tanggal || 0;

  return timeA - timeB; // lama → baru (TERBARU DI BAWAH)
});

    let html = "";

    // ======================
    // AMBIL DATA VIEWER
    // ======================

    let viewerData = {

      nama : "User",
      foto : "",
      role : "user"

    };

    if(currentUser){

      // USERS

      const userSnap =
        await get(
          ref(
            database,
            "users/" + currentUser.uid
          )
        );

      if(userSnap.exists()){

        const userData =
          userSnap.val();

        viewerData = {

          nama :
            userData.namaLengkap ||
            userData.nama ||
            "User",

          foto :
            userData.fotoSelfie ||
            userData.foto ||
            "",

          role : "user"

        };

      }

      // ADMIN

      const adminSnap =
        await get(
          ref(
            database,
            "admin/" + currentUser.uid
          )
        );

      if(adminSnap.exists()){

        const adminData =
          adminSnap.val();

        viewerData = {

          nama :
            adminData.nama ||
            "Admin",

          foto :
            adminData.foto ||
            "",

          role : "admin"

        };

      }

      // PURNA

      const purnaSnap =
        await get(
          ref(
            database,
            "purna/" + currentUser.uid
          )
        );

      if(purnaSnap.exists()){

        const purnaData =
          purnaSnap.val();

        viewerData = {

          nama :
            purnaData.namaPurna ||
            "Purna",

          foto :
            purnaData.foto ||
            "",

          role : "purna"

        };

      }

    }

    // ======================
    // LOOP CHAT
    // ======================

    for(const [key,item] of data){

      // ======================
      // AUTO VIEW
      // ======================

      if(currentUser){

        try{

          await update(
            ref(
              database,
              "info/" + key + "/views"
            ),
            {

              [currentUser.uid]:{

                nama :
                  viewerData.nama,

                foto :
                  viewerData.foto,

                role :
                  viewerData.role,

                waktu :
                  Date.now()

              }

            }
          );

        }catch(error){

          console.log(error);

        }

      }

      // ======================
      // DEFAULT
      // ======================

      let nama =
        item.nama ||
        "User";

      let foto =
        item.foto ||
        "assets/images/RI.webp";

      let role =
        "Admin";

      // ======================
      // JIKA PURNA
      // ======================

      if(
        item.role === "purna" ||
        item.type === "chat-purna"
      ){

        role = "Purna";

        if(item.uid){

          try{

            const purnaSnap =
              await get(
                ref(
                  database,
                  "purna/" + item.uid
                )
              );

            if(purnaSnap.exists()){

              const purnaData =
                purnaSnap.val();

              nama =
                purnaData.namaPurna ||
                nama;

              foto =
                purnaData.foto ||
                foto;

            }

          }catch(error){

            console.log(error);

          }

        }

      }

      // ======================
      // JIKA USER
      // ======================

      if(
        item.role === "user" ||
        item.type === "chat-user"
      ){

        role = "User";

      }

      // ======================
      // HTML CHAT
      // ======================

      html += `

      <div class="chat-item">

        <img
        src="${foto}"
        class="chat-avatar">

        <div class="chat-bubble">

          <div class="chat-top">

            <div class="chat-title">
              ${nama}
            </div>

            <div class="role-badge">
              ${role}
            </div>

          </div>

          <div class="chat-message">

            ${item.isi || "-"}

          </div>

          ${
            item.gambar
            ?
            `
            <img
            src="${item.gambar}"
            class="chat-image">
            `
            :
            ""
          }

          <div class="chat-date">

            ${item.tanggal || ""}

          </div>

        </div>

      </div>

      `;

    }

    // ======================
    // TAMPILKAN
    // ======================

    chatBox.innerHTML = html;

    // ======================
    // AUTO SCROLL
    // ======================

    setTimeout(()=>{

      window.scrollTo({

        top:document.body.scrollHeight,

        behavior:"smooth"

      });

    },200);

  });

}

loadInfo();

// ======================
// DISABLE COPY
// ======================

document.addEventListener(
  "contextmenu",
  function(e){

    e.preventDefault();

  }
);

document.addEventListener(
  "selectstart",
  function(e){

    e.preventDefault();

  }
);

document.addEventListener(
  "dragstart",
  function(e){

    e.preventDefault();

  }
);

</script>
</body>
</html>
