async function cekMaintenance(){

try{

const snap =
await get(
ref(
database,
"maintenance"
)
);

if(
!snap.exists()
)
return;

const data =
snap.val();

// maintenance OFF

if(
data.aktif !== true
)
return;

// halaman sekarang

const page =
window.location.pathname
.toLowerCase();

// jangan redirect
// kalau sudah maintenance

if(
page.includes(
"maintenance.html"
)
){
return;
}

// bypass admin

if(

page.includes(
"admin"
)

||

page.includes(
"bendahara"
)

){
return;
}

// redirect

window.location.href =
"https://paskibrapadangtualang.net/maintenance.html";

}catch(err){

console.log(
"Maintenance Error:",
err
);

}

}

cekMaintenance();

   async function loadAngkatan(tahun){

  try{

    judulAngkatan.innerText =
      "Data Angkatan Tahun " + tahun;

    containerAnggota.innerHTML = `
      <div class="empty-data">

      ref(database, "users")
    );

      const data = snapshot.val();

      containerAnggota.innerHTML = "";

      let ditemukan = false;

      Object.keys(data).forEach((id)=>{

        const item = data[id];

        // SUPPORT 2 FIELD

          item.tahunPaskibra ||
          item.angkatanTahun;

        if(tahunUser == tahun){

          ditemukan = true;

>

`;

  <script>

    function toggleFilterMenu(){

      const menu =
        document.getElementById(
          "filterMenuAngkatan"
        );

      if(menu.style.display === "block"){

        menu.style.display = "none";

      }else{

        menu.style.display = "block";

      }

    }

    // TUTUP SAAT KLIK LUAR

    window.onclick = function(e){

      if(
        !e.target.matches('.filter-button')
      ){

        const menu =
          document.getElementById(
            "filterMenuAngkatan"
          );

        if(menu.style.display === "block"){

          menu.style.display = "none";

        }

      }

    }
