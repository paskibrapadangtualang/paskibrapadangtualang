    *{

  user-select: none; /* blok seleksi teks */
  -webkit-user-select: none;
  -ms-user-select: none;
}


img{
  -webkit-user-drag: none;
  -webkit-user-select: none;
  user-select: none;
}
    


/* hilangkan highlight biru saat klik */
a, button, div{
  -webkit-tap-highlight-color: transparent;
}

/* optional: cegah zoom pinch (mobile) */

    body{
      background:#f5f5f5;
      padding-top:80px;
      padding-bottom:30px;

    /* HEADER */

    .header{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:65px;
      background:#c40000;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 15px;
      z-index:1000;
      box-shadow:0 2px 8px rgba(0,0,0,0.15);
    }

    .header-title{
      color:white;
      font-size:18px;
      font-weight:bold;
    }

    /* FILTER */

    .filter-box{
      position:relative;
    }

    .filter-button{
      background:white;
      border:none;
      padding:10px 15px;
      border-radius:12px;
      font-size:13px;
      font-weight:bold;
      cursor:pointer;
    }

    .filter-menu{
      position:absolute;
      top:52px;
      right:-12px;
      width:170px;
      background:white;
      border-radius:15px;
      box-shadow:0 3px 12px rgba(0,0,0,0.15);
      overflow:hidden;
      display:none;
      z-index:2000;
    }

    .filter-item{
      padding:14px;
      font-size:14px;
      border-bottom:1px solid #eee;
      cursor:pointer;
    }

    .filter-item:hover{
      background:#f5f5f5;
    }

    /* CONTAINER */

    .container{
      padding:15px;
    }

    .angkatan-title{
      font-size:20px;
      font-weight:bold;
      margin-bottom:20px;
      color:#222;
    }

    /* CARD */

    .anggota-card{
      background:white;
      border-radius:18px;
      padding:18px;
      margin-bottom:15px;
      box-shadow:0 3px 10px rgba(0,0,0,0.08);
      transition:0.2s;
    }

    .anggota-card:active{
      transform:scale(0.98);
    }

    .anggota-nama{
      font-size:17px;
      font-weight:bold;
      color:#111;
      margin-bottom:10px;
    }

    .anggota-nomor{
      font-size:14px;
      color:#666;
    }

    .empty-data{
      text-align:center;
      color:#777;
      margin-top:50px;
      font-size:14px;
    }

   async function loadAngkatan(tahun){

  try{

    judulAngkatan.innerText =
      "Data Angkatan Tahun " + tahun;

    containerAnggota.innerHTML = `
      <div class="empty-data">
        Loading data...
      </div>
    `;

    const snapshot = await get(
      ref(database, "users")
    );

    if(snapshot.exists()){

      const data = snapshot.val();

      containerAnggota.innerHTML = "";

      let ditemukan = false;

      Object.keys(data).forEach((id)=>{

        const item = data[id];

        // SUPPORT 2 FIELD
        const tahunUser =
          item.tahunPaskibra ||
          item.angkatanTahun;

        if(tahunUser == tahun){

          ditemukan = true;

         containerAnggota.innerHTML += `

  <div 
  class="anggota-card"
  onclick="viewProfile('${id}')"
  style="cursor:pointer;"
>

    <!-- FOTO PROFIL -->
    <div style="
      display:flex;
      align-items:center;
      gap:15px;
    ">

      <img
        src="${item.fotoSelfie || 'assets/images/user.png'}"
        style="
          width:70px;
          height:70px;
          border-radius:50%;
          object-fit:cover;
          border:3px solid #c40000;
        "
      >

      <div>

        <!-- NAMA -->
        <div class="anggota-nama">
          ${item.namaLengkap || '-'}
        </div>

        <!-- ANGKATAN -->
        <div class="anggota-nomor">
          Angkatan :
          ${item.angkatanTahun || '-'}
        </div>

        <!-- ASAL SEKOLAH -->
        <div class="anggota-nomor">

          ${item.asalSekolah || '-'}
        </div>

        <!-- NOMOR PENDAFTARAN -->

          Nomor Pendaftaran :
          ${item.nomorPendaftaran || '-'}
        </div>

      </div>

    </div>

  </div>

`;

        }

      });

      if(!ditemukan){

        containerAnggota.innerHTML = `
          <div class="empty-data">
            Belum ada data angkatan tahun ${tahun}
          </div>
        `;

      }

    }else{

      containerAnggota.innerHTML = `
        <div class="empty-data">
          Data tidak ditemukan
        </div>
      `;

    }

  }catch(error){

    console.log(error);

    containerAnggota.innerHTML = `
      <div class="empty-data">
        Gagal memuat data
      </div>
    `;

  }

}

  <!-- SCRIPT FILTER -->

  <script>

    function toggleFilterMenu(){

      const menu =
        document.getElementById(
          "filterMenuAngkatan"
        );

      if(menu.style.display === "block"){

        menu.style.display = "none";

      }else{

        menu.style.display = "block";

      }

    }

    // TUTUP SAAT KLIK LUAR

    window.onclick = function(e){

      if(
        !e.target.matches('.filter-button')
      ){

        const menu =
          document.getElementById(
            "filterMenuAngkatan"
          );

        if(menu.style.display === "block"){

          menu.style.display = "none";

        }

      }

    }









    document.addEventListener('contextmenu', function(e){
  e.preventDefault(); // disable klik kanan / copy
});

document.addEventListener('selectstart', function(e){

});

document.addEventListener('dragstart', function(e){
