<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List Sejarah Paskibra</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#e9e9e9;
  padding-top:40px; /* penting */
}

.header{
  background:linear-gradient(to right,#d41818,#c40f0f);
  color:white;

  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:999;

  display:flex;
  justify-content:center;  /* ini yang bikin ke tengah */
  align-items:center;

  padding:12px 15px;
  font-weight:bold;
  letter-spacing:1px;
}

.container{
  padding:15px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.03);
}

.card img{
  width:100%;
  height:150px;
  object-fit:cover;
}

.card-body{
  padding:10px;
}

.title{
  font-weight:bold;
  font-size:16px;
  margin-bottom:5px;
}

.badge{
  display:inline-block;
  background:#c40000;
  color:white;
  padding:4px 8px;
  font-size:12px;
  border-radius:20px;
}
</style>
</head>

<body>

<div class="header">Sejarah Paskibra</div>

<div class="container" id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

async function loadList(){

  const snap = await get(ref(db, "postingansejarah"));

  const container = document.getElementById("list");

  if(!snap.exists()){
    container.innerHTML = "Tidak ada data";
    return;
  }

  const data = snap.val();

  Object.keys(data).forEach(id => {

    const item = data[id];

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${item.gambar}">
      <div class="card-body">
        <div class="title">${item.judul}</div>
        <div class="badge">${item.tahun}</div>
      </div>
    `;

    card.onclick = () => {
      location.href = "detail.html?id=" + id;
    };

    container.appendChild(card);
  });

}

loadList();

</script>

</body>
</html>
