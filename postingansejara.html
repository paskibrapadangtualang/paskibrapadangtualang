<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",

  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);













/* =========================
MAINTENANCE GLOBAL
========================= */

async function cekMaintenance(){

try{

const snap =
await get(
ref(
db,
"maintenance"
)
);

if(
!snap.exists()
)
return;

const data =
snap.val();

// maintenance OFF

if(
data.aktif !== true
)
return;

// halaman sekarang

const page =
window.location.pathname
.toLowerCase();

// sudah di halaman maintenance

if(
page.includes(
"maintenance.html"
)
){
return;
}

// bypass admin

if(

page.includes(
"admin"
)

||

page.includes(
"bendahara"
)

){
return;
}

// redirect

window.location.href =
"https://paskibrapadangtualang.net/maintenance.html";

}catch(err){

console.log(
"Maintenance Error:",
err
);

}

}

cekMaintenance();






async function loadList(){

  const snap = await get(ref(db, "postingansejarah"));

  const container = document.getElementById("list");

  if(!snap.exists()){
    container.innerHTML = "Tidak ada data";
    return;
  }

  const data = snap.val();

  Object.keys(data).forEach(id => {

    const item = data[id];

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${item.gambar}">
      <div class="card-body">
        <div class="title">${item.judul}</div>
        <div class="badge">${item.tahun}</div>
      </div>
    `;

    card.onclick = () => {
      location.href = "detail.html?id=" + id;
    };

    container.appendChild(card);
  });

}

loadList();

</script>
