<body>

<div class="card" id="detailIklan">
  Loading...
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.appspot.com",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const container = document.getElementById("detailIklan");

async function load(){

  const snap = await get(ref(db, "iklan/" + id));

  if(!snap.exists()){
    container.innerHTML = "Iklan tidak ditemukan";
    return;
  }

  const data = snap.val();

  let imgs = "";
  if(data.gambarList){
    Object.values(data.gambarList).forEach(img=>{
      imgs += `<img src="${img}">`;
    });
  }

  container.innerHTML = `
    <h1 style="
  font-size:19px;
  font-weight:800;
  line-height:1.4;
  color:#111;
  margin-bottom:10px;
">
  ${data.judul || "-"}
</h1>
    ${imgs}
    <p style="
  white-space:pre-line;
  line-height:1.8;
  color:#444;
  font-size:15px;
  margin-top:10px;
">
  ${data.deskripsi || "-"}
</p>
    <p><b>📍 ${data.alamat}</b></p>
  `;
}

load();

</script>
