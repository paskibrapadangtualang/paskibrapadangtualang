<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// FIREBASE CONFIG

const firebaseConfig = {

  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b"

};

// INIT

const app =
  initializeApp(firebaseConfig);

const database =
  getDatabase(app);

const auth =
  getAuth(app);

// ===============================
// NAVBAR USER
// ===============================

onAuthStateChanged(auth, async(user)=>{

  const navProfile =
    document.getElementById("navProfile");

  const navText =
    document.getElementById("navText");

  const menuUser =
    document.getElementById("menuUser");

  if(user){

    try{

      const snapshot =
        await get(
          ref(database,"users/" + user.uid)
        );

      if(snapshot.exists()){

        const data =
          snapshot.val();

        navProfile.src =
          data.fotoSelfie ||
          "assets/images/user.png";

        navText.innerText =
          "User";

        menuUser.href =
          "user.html";

      }

    }catch(error){

      console.log(error);

    }

  }else{

    navProfile.src =
      "assets/images/user.png";

    navText.innerText =
      "Login";

    menuUser.href =
      "akun.html";

  }

});

// ===============================
// CONTAINER
// ===============================

const postinganContainer =
  document.getElementById(
    "postinganContainer"
  );

// ===============================
// LOAD POSTINGAN
// ===============================

async function loadPostingan(){

  try{

    const snapshot =
      await get(
        ref(database,"postingan")
      );

    postinganContainer.innerHTML =
      "";

    if(snapshot.exists()){

      const data =
        snapshot.val();

      Object.entries(data)

      // TERBARU PALING ATAS

      .sort((a,b)=>

        b[1].createdAt -
        a[1].createdAt

      )

      .forEach(([id,post])=>{

        // FOTO PERTAMA

        let gambarAwal = "";

        if(
          post.gambarList &&
          post.gambarList.length > 0
        ){

          gambarAwal =
            post.gambarList[0];

        }else{

          gambarAwal =
            post.gambar;

        }

        // DESKRIPSI SINGKAT

        let deskripsiSingkat =
          post.deskripsi
          .substring(0,120);

        if(
          post.deskripsi.length > 120
        ){

          deskripsiSingkat += "...";

        }

const BASE_URL =
  "https://paskibrapadangtualang.github.io/paskibrapadangtualang/";

const linkPost =
  BASE_URL + "detailpostingan.html?id=" + id;

postinganContainer.innerHTML += `

<div class="post-card">

  <div onclick="bukaDetail('${id}')">

    <img src="${gambarAwal}">

    <div class="post-content">

      <h3>${post.judul || "-"}</h3>

      <p>${deskripsiSingkat || "-"}</p>

      <div class="post-date">
        ${post.tanggal || "-"}
      </div>

    </div>

  </div>

  <!-- SHARE -->
  <div style="
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:12px;
    border-top:1px solid #eee;
    background:#fafafa;
  ">

    <!-- COPY -->
    <div onclick="event.stopPropagation(); salinLink('${linkPost}')"
      style="display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;">

      <img src="assets/images/copy.png"
        style="width:24px;height:24px;object-fit:contain;">

      <span style="font-size:11px;">Salin</span>

    </div>

    <!-- WHATSAPP -->
    <div onclick="event.stopPropagation(); shareWA('${linkPost}')"
      style="display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;">

      <img src="assets/images/whatsapp.png"
        style="width:24px;height:24px;object-fit:contain;">

      <span style="font-size:11px;">WhatsApp</span>

    </div>

    <!-- FACEBOOK -->
    <div onclick="event.stopPropagation(); shareFB('${linkPost}')"
      style="display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;">

      <img src="assets/images/facebook.png"
        style="width:24px;height:24px;object-fit:contain;">

      <span style="font-size:11px;">Facebook</span>

    </div>

    <!-- INSTAGRAM -->
    <div onclick="event.stopPropagation(); shareIG('${linkPost}')"
      style="display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;">

      <img src="assets/images/social.png"
        style="width:24px;height:24px;object-fit:contain;">

      <span style="font-size:11px;">Instagram</span>

    </div>

  </div>

</div>

`;

      });

    }else{

      postinganContainer.innerHTML = `

      <p
        style="
          text-align:center;
          color:#777;
        "
      >
        Belum ada postingan
      </p>

      `;

    }

  }catch(error){

    console.log(error);

    postinganContainer.innerHTML = `

    <p
      style="
        text-align:center;
        color:red;
      "
    >
      Gagal memuat postingan
    </p>

    `;

  }

}

// ===============================
// DETAIL POSTINGAN
// ===============================

window.bukaDetail =
function(id){

  window.location.href =
    "detailpostingan.html?id=" + id;

}

// ===============================
// LOAD
// ===============================

loadPostingan();




window.toggleMenu = function () {
  const menu = document.getElementById("dropdownMenu");

  if (!menu) return;

  if (menu.style.display === "flex") {
    menu.style.display = "none";
  } else {
    menu.style.display = "flex";
  }
};
















window.salinLink = async function(link){
  try{
    await navigator.clipboard.writeText(link);
    alert("Link berhasil disalin");
  }catch{
    alert("Gagal menyalin link");
  }
};

window.shareWA = function(link){
  const text =
`🔥 PASKIBRA PADANG TUALANG

Baca postingan:
${link}`;

  window.open(
    "https://wa.me/?text=" + encodeURIComponent(text),
    "_blank"
  );
};

window.shareFB = function(link){
  window.open(
    "https://www.facebook.com/sharer/sharer.php?u=" +
    encodeURIComponent(link),
    "_blank"
  );
};

window.shareIG = async function(link){
  await navigator.clipboard.writeText(link);
  alert("Link disalin, paste ke Instagram");
  window.open("https://instagram.com", "_blank");
};










document.addEventListener('contextmenu', function(e){
  e.preventDefault(); // disable klik kanan / copy
});

document.addEventListener('selectstart', function(e){
  e.preventDefault(); // disable blok teks
});

document.addEventListener('dragstart', function(e){
  e.preventDefault(); // disable drag gambar
});



</script>
</script>
