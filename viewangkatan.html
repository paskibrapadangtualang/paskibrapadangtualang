async function cekMaintenance(){

try{

const snap =
await get(
ref(
db,
"maintenance"
)
);

if(
!snap.exists()
)
return;

const data =
snap.val();

// maintenance OFF

if(
data.aktif !== true
)
return;

// halaman sekarang

const page =
window.location.pathname
.toLowerCase();

// sudah di halaman maintenance

if(
page.includes(
"maintenance.html"
)
){
return;
}

// bypass admin

if(

page.includes(
"admin"
)

||

page.includes(
"bendahara"
)

){
return;
}

// redirect

window.location.href =
"https://paskibrapadangtualang.net/maintenance.html";

}catch(err){

console.log(
"Maintenance Error:",
err
);

}

}

cekMaintenance();










function formatStatus(status){
  if(!status) return "Menunggu Seleksi";

  const s = status.toLowerCase();

  if(s === "diterima") return "Diterima";
  if(s === "ditolak") return "Ditolak";
  if(s === "pending") return "Menunggu Seleksi";

  return "Menunggu Seleksi";
}

function getStatusClass(status){
  if(!status) return "pending";

  const s = status.toLowerCase();

  if(s === "diterima") return "accepted";
  if(s === "ditolak") return "rejected";

  return "pending";
}





/* AMBIL ID DARI URL */
const urlParams = new URLSearchParams(window.location.search);
const userId = urlParams.get("id");

const content = document.getElementById("content");

async function loadUser(){

  if(!userId){
    content.innerHTML = "<div class='loading'>User tidak ditemukan</div>";
    return;
  }

  const snap = await get(ref(db, "users/" + userId));

  if(!snap.exists()){
    content.innerHTML = "<div class='loading'>Data tidak ditemukan</div>";
    return;
  }

  const data = snap.val();

 content.innerHTML = `
  
<div class="profile-card" onclick='openReview(${JSON.stringify(data)})'>
    <div class="profile-left">

<img class="profile-img" src="${data.fotoSelfie ? data.fotoSelfie : 'assets/images/user.png'}"
onerror="this.src='assets/images/user.png'">
      <div class="nama">${data.namaLengkap || '-'}</div>
    </div>

    <div class="profile-right">

      <div class="info">

        <div class="info-item">
          <b>Angkatan:</b> ${data.angkatanTahun || '-'}
        </div>

        <div class="info-item">
          <b>Nomor Pendaftaran:</b> ${data.nomorPendaftaran || '-'}
        </div>

        <div class="info-item">
          <b>Asal Sekolah:</b> ${data.asalSekolah || '-'}
        </div>

        <div class="status ${getStatusClass(data.statusPenerimaan)}">
          Status Penerimaan :
          <span>${formatStatus(data.statusPenerimaan)}</span>
        </div>

      </div>

    </div>

  </div>

`;
}
window.openReview = function(data){
  document.getElementById("reviewModal").classList.add("active");

  const foto = data.fotoSelfie || 'assets/images/user.png';

  document.getElementById("reviewBody").innerHTML = `
    
   <img src="${foto}"
     onerror="this.src='assets/images/user.png'"
     onclick="openPreview(this.src)"
     style="
       width:110px;
       height:110px;
       border-radius:50%;
       object-fit:cover;
       display:block;
       margin:10px auto;
       border:3px solid #c40000;
       cursor:pointer;
     ">

    <div class="info-item"><b>Nama:</b> ${data.namaLengkap || '-'}</div>
    <div class="info-item"><b>Angkatan:</b> ${data.angkatanTahun || '-'}</div>
    <div class="info-item"><b>Sekolah:</b> ${data.asalSekolah || '-'}</div>

    <div class="status ${getStatusClass(data.statusPenerimaan)}">
      ${formatStatus(data.statusPenerimaan)}
    </div>
  `;
}

window.closeReview = function(){
  document.getElementById("reviewModal").classList.remove("active");
}
loadUser();




window.openPreview = function (src) {

}

window.closePreview = function () {

}
