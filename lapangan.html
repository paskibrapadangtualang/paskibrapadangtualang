<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Peta Lapangan Padang Tualang</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    position: relative;
    margin: 0;
    color: white;
    padding-bottom: 50px;
    overflow-x: hidden;
}

body::before{
    content: "";
    position: fixed;
    inset: 0;
    background: url('assets/images/pngwing.com (2).png') no-repeat center center fixed;
    background-size: cover;
    filter: blur(6px) brightness(0.6);
    transform: scale(1.05); /* biar blur tidak kepotong */
    z-index: -2;
}

body::after{
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    z-index: -1;
}
/* HEADER */

.title{
    position:sticky;
    top:0;
    z-index:999;


    text-align:center;
    font-size:18px;
    font-weight:bold;
    letter-spacing:1px;

    background:#e00000;
    padding:20px;

    box-shadow:
      0 4px 10px rgba(0,0,0,0.2);
}

/* CONTAINER */

.map-container{
    max-width:750px;
    margin:40px auto;
    position:relative;
    padding:0 20px;
}

/* GARIS UTAMA */

.main-line{
    position:absolute;
    left:58px;
    top:0;
    bottom:0;
    width:5px;
    background:#ffd700;
    border-radius:10px;
}

/* ITEM */

.map-item{
    position:relative;
    margin:35px 0;
    padding-left:120px;
    animation:fadeIn 0.4s ease;
}

/* GARIS CABANG */

.map-item::before{
    content:"";
    position:absolute;
    left:58px;
    top:22px;
    width:50px;
    height:5px;
    background:#ffd700;
}

/* PANAH */

.map-item::after{
    content:"➜";
    position:absolute;
    left:104px;
    top:8px;
    font-size:22px;
    color:#ffd700;
}

/* CARD */

.map-card{
    background:white;
    color:#111;
    padding:18px 22px;
    border-radius:18px;
    font-weight:bold;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.25);

    transition:0.3s;
}

.map-card:hover{
    transform:translateX(8px);
    background:#ffd700;
}

/* LOADING */

.loading{
    text-align:center;
    margin-top:50px;
    color:#ffd700;
}

/* ANIMASI */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}




/* LOKASI AKTIF */

.active-card{

    background:
      linear-gradient(
        135deg,
        #ffd700,
        #ffb300
      ) !important;

    color:#111;

    position:relative;

    border:
      3px solid white;

    animation:
      glowPulse 2s infinite;

    overflow:hidden;
}

/* BADGE */

.active-badge{

    display:inline-block;

    background:#c40000;

    color:white;

    font-size:12px;

    font-weight:bold;

    padding:
      8px 14px;

    border-radius:999px;

    margin-bottom:12px;

    letter-spacing:1px;

    box-shadow:
      0 0 15px rgba(255,0,0,0.4);

    animation:
      badgeBlink 1.8s infinite;
}

/* ICON */

.active-icon{

    font-size:28px;

    margin-right:8px;

    animation:
      bounce 1.5s infinite;
}

/* EFEK GLOW */

@keyframes glowPulse{

    0%{
        box-shadow:
          0 0 0 rgba(255,215,0,0.4);
    }

    50%{
        box-shadow:
          0 0 30px rgba(255,215,0,0.9);
    }

    100%{
        box-shadow:
          0 0 0 rgba(255,215,0,0.4);
    }

}

/* BADGE */

@keyframes badgeBlink{

    0%{
        opacity:1;
    }

    50%{
        opacity:0.7;
    }

    100%{
        opacity:1;
    }

}

/* ICON */

@keyframes bounce{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

    100%{
        transform:translateY(0);
    }

}

/* NAMA LAPANGAN */

.lapangan-title{

    display:flex;
    align-items:center;

    background:
      rgba(255,255,255,0.25);

    padding:
      14px 18px;

    border-radius:14px;

    backdrop-filter:blur(4px);

    font-size:17px;
    font-weight:bold;

    line-height:1.5;

    border:
      1px solid rgba(255,255,255,0.35);

}




.loader{
    position:fixed;
    inset:0;
    background:#e00000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:99999;
    color:white;
}

.spinner{
    width:55px;
    height:55px;
    border-radius:50%;
    border:5px solid rgba(255,255,255,0.25);
    border-top:5px solid #fff;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    0%{ transform:rotate(0deg); }
    100%{ transform:rotate(360deg); }
}

.loader p{
    margin-top:12px;
    font-size:14px;
    opacity:0.9;
    letter-spacing:0.5px;
}



</style>
</head>
<body>

<div class="title">
    PETA LAPANGAN PADANG TUALANG
</div>

<div class="map-container">

    <div class="main-line"></div>

    <!-- DATA FIREBASE MASUK KE SINI -->
    <div id="lapanganList"></div>

</div>

<div class="loading" id="loading">
    
</div>






<div id="loader" class="loader">
    <div class="spinner"></div>
    <p>Memuat data lapangan...</p>
</div>





<script type="module">

/* FIREBASE */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* CONFIG */

const firebaseConfig = {

  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b"

};

/* INIT */

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);










    




/* =========================
MAINTENANCE GLOBAL
========================= */

async function cekMaintenance(){

try{

const snap =
await get(
ref(
db,
"maintenance"
)
);

if(
!snap.exists()
)
return;

const data =
snap.val();

// maintenance OFF

if(
data.aktif !== true
)
return;

// halaman sekarang

const page =
window.location.pathname
.toLowerCase();

// sudah di halaman maintenance

if(
page.includes(
"maintenance.html"
)
){
return;
}

// bypass admin

if(

page.includes(
"admin"
)

||

page.includes(
"bendahara"
)

){
return;
}

// redirect

window.location.href =
"https://paskibrapadangtualang.net/maintenance.html";

}catch(err){

console.log(
"Maintenance Error:",
err
);

}

}

cekMaintenance();











/* ELEMENT */

const lapanganList =
    document.getElementById("lapanganList");

const loading =
    document.getElementById("loading");

/* AMBIL DATA REALTIME */

const lapanganRef =
    ref(db, "lapangan");

/*
DATA AKAN OTOMATIS:
- tambah sendiri
- update sendiri
- hapus sendiri
*/

onValue(lapanganRef, (snapshot)=>{

    const loader = document.getElementById("loader");

    lapanganList.innerHTML = "";

    // tampilkan loader saat mulai load
    loader.style.display = "flex";

    if(!snapshot.exists()){

        loader.innerHTML = `
            <div class="spinner"></div>
            <p>Belum ada data lapangan</p>
        `;

        return;
    }

    snapshot.forEach((child)=>{

        const data = child.val();

        const aktifClass =
            data.lokasiAktif ? "active-card" : "";

        const badge =
            data.lokasiAktif
            ? `<div class="active-badge">📍 LOKASI PENGIBARAN 2026</div>`
            : "";

        const item = `
        <div class="map-item">

            <div class="map-card ${aktifClass}">

                ${badge}

                <div class="lapangan-title">

                    <span class="active-icon">
                        ${data.lokasiAktif ? "📍" : ""}
                    </span>

                    ${data.nama}

                </div>

            </div>

        </div>`;

        lapanganList.innerHTML += item;
    });

    // sembunyikan loader setelah data tampil
    loader.style.display = "none";

});

</script>

</body>
</html>
