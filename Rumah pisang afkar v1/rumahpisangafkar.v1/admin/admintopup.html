<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Admin Top Up</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding-bottom:100px;
}

.header{
position:sticky;
top:0;
z-index:99;
background:white;
padding:18px;
font-size:22px;
font-weight:bold;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.list{
padding:15px;
}

.card{
background:white;
border-radius:24px;
padding:18px;
margin-bottom:15px;
box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px;
margin-bottom:15px;
}

.user{
display:flex;
gap:12px;
align-items:center;
}

.user img{
width:55px;
height:55px;
border-radius:50%;
object-fit:cover;
}

.nama{
font-size:16px;
font-weight:bold;
}

.email{
font-size:12px;
color:#777;
margin-top:4px;
}

.nominal{
font-size:22px;
font-weight:bold;
color:#16a34a;
}

.row{
display:flex;
justify-content:space-between;
padding:10px 0;
font-size:14px;
border-bottom:1px dashed #eee;
}

.label{
color:#777;
}

.value{
font-weight:bold;
text-align:right;
max-width:60%;
word-break:break-word;
}

.bukti{
width:100%;
border-radius:18px;
margin-top:15px;
border:1px solid #eee;
}

.btnWrap{
display:flex;
gap:10px;
margin-top:18px;
}

button{
flex:1;
height:52px;
border:none;
border-radius:16px;
font-size:14px;
font-weight:bold;
cursor:pointer;
}

.approve{
background:linear-gradient(135deg,#22c55e,#16a34a);
color:white;
}

.reject{
background:#ef4444;
color:white;
}

.badge{
padding:8px 14px;
border-radius:12px;
font-size:12px;
font-weight:bold;
display:inline-block;
margin-top:10px;
}

.pending{
background:#fff3dc;
color:#ff9800;
}

.approved{
background:#dcfce7;
color:#16a34a;
}

.rejected{
background:#fee2e2;
color:#ef4444;
}

.empty{
padding:80px 20px;
text-align:center;
}

.empty img{
width:180px;
margin-bottom:15px;
}

.empty h2{
font-size:20px;
margin-bottom:10px;
}

.empty p{
font-size:14px;
color:#777;
line-height:1.7;
}

</style>
</head>
<body>

<div class="header">
Admin Top Up
</div>

<div class="list"
id="list">

Loading...

</div>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
get,
update
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={

apiKey:"AIzaSyD3DTcca7yZKVtllCk3TQOUe6Yv2hSyG_g",

authDomain:
"shoponline-93646.firebaseapp.com",

databaseURL:
"https://shoponline-93646-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"shoponline-93646"

};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const list =
document.getElementById("list");

/* =========================
LOAD DATA TOPUP
========================= */

async function loadData(){

const snap =
await get(
ref(db,"topup")
);

list.innerHTML = "";

if(!snap.exists()){

list.innerHTML = `

<div class="empty">

<img src="https://cdn-icons-png.flaticon.com/512/7486/7486740.png">

<h2>
Belum Ada Top Up
</h2>

<p>
Data top up pengguna
akan muncul di sini
</p>

</div>

`;

return;

}

let arr = [];

snap.forEach(item=>{

const d = item.val();

arr.push(d);

});

arr.sort((a,b)=>
(b.createdAt || 0) - (a.createdAt || 0)
);

for(const d of arr){

const userSnap =
await get(
ref(db,"users/"+d.uid)
);

const user =
userSnap.exists()
? userSnap.val()
: {};

let badge = `
<div class="badge pending">
Menunggu
</div>
`;

if(d.status === "approved"){

badge = `
<div class="badge approved">
Berhasil
</div>
`;

}

if(d.status === "rejected"){

badge = `
<div class="badge rejected">
Ditolak
</div>
`;

}

const tanggal =
new Date(
d.createdAt || Date.now()
)
.toLocaleString("id-ID");

list.innerHTML += `

<div class="card">

<div class="top">

<div class="user">

<img src="${
user.foto ||
'https://ui-avatars.com/api/?name=User'
}">

<div>

<div class="nama">
${user.nama || 'User'}
</div>

<div class="email">
${user.email || '-'}
</div>

${badge}

</div>

</div>

<div class="nominal">
+Rp ${Number(d.nominal || 0)
.toLocaleString("id-ID")}
</div>

</div>

<div class="row">
<div class="label">
ID
</div>

<div class="value">
${d.id || '-'}
</div>
</div>

<div class="row">
<div class="label">
Metode
</div>

<div class="value">
${d.metode || '-'}
</div>
</div>

<div class="row">
<div class="label">
Tanggal
</div>

<div class="value">
${tanggal}
</div>
</div>

<div class="row">
<div class="label">
UID User
</div>

<div class="value">
${d.uid || '-'}
</div>
</div>

${
d.bukti
?
`
<img
src="${d.bukti}"
class="bukti">
`
:
''
}

${
d.status === "pending"
?
`
<div class="btnWrap">

<button
class="approve"
onclick="approveTopup('${d.id}')">

Approve

</button>

<button
class="reject"
onclick="rejectTopup('${d.id}')">

Tolak

</button>

</div>
`
:
''
}

</div>

`;

}

}

/* =========================
APPROVE TOPUP
========================= */

window.approveTopup =
async(id)=>{

try{

const snap =
await get(
ref(db,"topup/"+id)
);

if(!snap.exists()){

alert("Top up tidak ditemukan");

return;

}

const data = snap.val();

/* SUDAH APPROVE */

if(data.status === "approved"){

alert("Sudah di approve");

return;

}

/* AMBIL USER */

const userRef =
ref(db,"users/"+data.uid);

const userSnap =
await get(userRef);

if(!userSnap.exists()){

alert("User tidak ditemukan");

return;

}

const user = userSnap.val();

const saldoLama =
Number(user.saldo || 0);

const nominal =
Number(data.nominal || 0);

const saldoBaru =
saldoLama + nominal;

/* UPDATE SALDO USER */

await update(userRef,{
saldo: saldoBaru
});

/* UPDATE STATUS TOPUP */

await update(
ref(db,"topup/"+id),
{
status:"approved",
approvedAt:Date.now()
}
);

alert("Top up berhasil di approve");

loadData();

}
catch(err){

console.log(err);

alert("Gagal approve");

}

};

/* =========================
REJECT TOPUP
========================= */

window.rejectTopup =
async(id)=>{

try{

await update(
ref(db,"topup/"+id),
{
status:"rejected",
rejectedAt:Date.now()
}
);

alert("Top up ditolak");

loadData();

}
catch(err){

console.log(err);

alert("Gagal menolak");

}

};

loadData();

</script>

</body>
</html>
