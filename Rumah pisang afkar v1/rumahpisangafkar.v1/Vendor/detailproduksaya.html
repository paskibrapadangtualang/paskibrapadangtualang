<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detail Produk Saya</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
padding-bottom:80px;
}

.header{
background:#ff6f00;
color:white;
padding:15px;
font-weight:bold;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:15px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.img{
width:100%;
height:200px;
object-fit:cover;
border-radius:12px;
margin-bottom:10px;
}

.btn{
background:#ff6f00;
color:white;
border:none;
padding:12px;
width:100%;
border-radius:10px;
font-weight:bold;
margin-top:10px;
}

.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
justify-content:center;
align-items:center;
padding:15px;
}

.form{
background:white;
padding:15px;
border-radius:12px;
width:100%;
max-width:420px;
}

input,textarea{
width:90%;
padding:10px;
margin-top:8px;
border:1px solid #ddd;
border-radius:8px;
}

label{
font-size:12px;
color:#666;
}

</style>
</head>

<body>

<div class="header">
<div>Detail Produk</div>
</div>

<div class="container" id="box"></div>

<!-- POPUP EDIT -->
<div class="popup" id="popup">
  <div class="form">
    <h3>Edit Produk</h3>

    <label>Nama</label>
    <input id="nama">

    <label>Harga</label>
    <input id="harga" type="number">

    <label>Harga Awal</label>
    <input id="hargaAwal" type="number">

    <label>Stok</label>
    <input id="stok" type="number">

<label>Deskripsi</label>
<textarea id="deskripsi" style="
width:100%;
min-height:250px;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
resize:vertical;
font-size:14px;
line-height:1.5;
box-sizing:border-box;
"></textarea>

    <label>Gambar</label>
    <input type="file" id="file">

    <button class="btn" onclick="saveEdit()">Simpan</button>
    <button class="btn" style="background:#999" onclick="closeEdit()">Tutup</button>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyD3DTcca7yZKVtllc3TQOUe6Yv2hSyG_g",
authDomain:"shoponline-93646.firebaseapp.com",
databaseURL:"https://shoponline-93646-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"shoponline-93646",
storageBucket:"shoponline-93646.firebasestorage.app",
messagingSenderId:"435032364443",
appId:"1:435032364443:web:5f76384f794693a892bd3e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const storeId = localStorage.getItem("storeId");
const id = new URLSearchParams(location.search).get("id");

let currentData = {};
let uploadUrl = "";

/* CLOUDINARY */
const CLOUD_NAME = "djxlbemky";
const UPLOAD_PRESET = "uploadgambar";

async function load(){

const snap = await get(ref(db,"produk/"+id));

if(!snap.exists()) return;

const p = snap.val();
currentData = p;

document.getElementById("box").innerHTML = `
<div class="card">

<img class="img" src="${p.gambar?.[0] || 'assets/images/default.png'}">

<h3>${p.nama}</h3>
<p>Rp ${Number(p.harga).toLocaleString("id-ID")}</p>
<p>Harga Awal: Rp ${Number(p.hargaAwal).toLocaleString("id-ID")}</p>
<p>Stok: ${p.stok}</p>
    <!-- 🔥 TAMBAHAN KATEGORI -->
    <div style="font-size:11px;color:#999;margin-top:3px;">
      ${p.kategori || "Tanpa Kategori"}
    </div>
<p style="
white-space:pre-line;
line-height:1.5;
font-size:13px;
color:#444;
">
${(p.deskripsi || "-")
  .replace(/\n/g, "\n")}
</p>

<button class="btn" onclick="openEdit()">Edit Produk</button>

</div>
`;
}

load();

/* OPEN EDIT */
window.openEdit = ()=>{
document.getElementById("popup").style.display="flex";

nama.value = currentData.nama || "";
harga.value = currentData.harga || "";
hargaAwal.value = currentData.hargaAwal || "";
stok.value = currentData.stok || "";
deskripsi.value = currentData.deskripsi || "";
};

/* CLOSE */
window.closeEdit = ()=>{
document.getElementById("popup").style.display="none";
};

/* UPLOAD CLOUDINARY */
async function upload(file){

const form = new FormData();
form.append("file",file);
form.append("upload_preset",UPLOAD_PRESET);

const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{
method:"POST",
body:form
});

const data = await res.json();
return data.secure_url;
}

/* SAVE */
window.saveEdit = async ()=>{

let img = currentData.gambar?.[0];

const file = document.getElementById("file").files[0];

if(file){
img = await upload(file);
}

/* update firebase */
await update(ref(db,"produk/"+id),{
nama:nama.value,
harga:Number(harga.value),
hargaAwal:Number(hargaAwal.value),
stok:Number(stok.value),
deskripsi:deskripsi.value,
"gambar/0": img
});

alert("Berhasil diupdate");
location.reload();
};

</script>

</body>
</html>
