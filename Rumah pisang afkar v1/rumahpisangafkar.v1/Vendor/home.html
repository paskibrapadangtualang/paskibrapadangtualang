// =========================

function createCard(data,key){

const harga=
(data.harga||0)
.toLocaleString(
"id-ID"
);

const hargaAwal=
(data.hargaAwal||0)
.toLocaleString(
"id-ID"
);

const produkId=
data.id || key;

const gambarUtama=

Array.isArray(
data.gambar
)

?

data.gambar[0]

:

(
data.gambar ||

"https://via.placeholder.com/300"
);


return `

<div

class="card"

data-id="${produkId}"

>

${data.promo ? `

<div class="promo">

🔥 PROMO

</div>

` : ""}

<img src="${gambarUtama}">

<div class="info">

<div class="nama">

${data.nama||"-"}

</div>

<div class="harga">

Rp ${harga}

</div>

<div class="coret">

Rp ${hargaAwal}

</div>

<div class="row">

${
data.cod ?

'<div class="tag">🚚 COD</div>'

:

''
}

${
data.kupon ?

'<div class="tag">🎫 Kupon</div>'

:

''
}

<div class="tag">

⚡ ${data.stok||0}

</div>

</div>

<div class="lokasi">

📍 ${data.lokasi||"-"}

</div>

</div>

</div>

`;

}

// =========================

// =========================

snapshot.forEach(

(item)=>{

const data=
item.val();

const key=
item.key;

produkList.innerHTML +=
createCard(
data,
key
);

}

);

card.onclick=

}

}

);

}

// UPDATE DOT

function updateDot(){

document
.querySelectorAll(
".dot"
)

.forEach(
x=>x.classList.remove(
"active"
)
);

document
.querySelectorAll(
".dot"
)

[current]

.classList.add(
"active"
);

}


// NEXT

window.nextBanner =
function(){

current++;

if(
current >=
bannerDummy.length
){

current = 0;

}

slider.scrollTo({

left:
slider.offsetWidth
*
current,

behavior:
"smooth"

});

updateDot();

};


// PREV

window.prevBanner =
function(){

current--;

if(
current < 0
){

current =
bannerDummy.length - 1;

}

slider.scrollTo({

left:
slider.offsetWidth
*
current,

behavior:
"smooth"

});

updateDot();

};


// AUTO SLIDE

setInterval(()=>{

nextBanner();

},4000);


// GESER MANUAL

slider.addEventListener(
"scroll",

()=>{

current =
Math.round(

slider.scrollLeft /
slider.offsetWidth

);

updateDot();

}

);

if (produkSnap.exists()) {
produkSnap.forEach(x => {
allProduk.push({ id: x.key, ...x.val() });
});
}

// AMBIL DATA STORE

if (storeSnap.exists()) {

Store
</div>
</div>

</div>
`;

});

searchResult.innerHTML = html;

});
