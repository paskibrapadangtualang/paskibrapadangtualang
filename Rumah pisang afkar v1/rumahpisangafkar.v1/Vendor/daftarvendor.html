<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftar Store Vendor</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

.box{
max-width:450px;
margin:auto;
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

input,textarea{
width:100%;
padding:10px;
margin:6px 0;
border:1px solid #ddd;
border-radius:8px;
outline:none;
}

button{
width:100%;
padding:12px;
background:#ff6f00;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

label{
font-size:12px;
color:#555;
}
</style>
</head>
<body>

<div class="box">

<h3>Daftar Store Vendor</h3>

<input id="nama" placeholder="Nama Store">
<textarea id="deskripsi" placeholder="Deskripsi Store"></textarea>

<input id="kategori" placeholder="Kategori (Food, Fashion, dll)">
<input id="alamat" placeholder="Alamat Lengkap">
<input id="hp" placeholder="Nomor HP">
<input id="wa" placeholder="WhatsApp">

<!-- EMAIL ASLI (INI YANG DIPAKAI LOGIN) -->
<input id="email" type="email" placeholder="Email Login Store">

<label>Logo Store</label>
<input type="file" id="logo">

<label>Banner Store</label>
<input type="file" id="banner">

<input id="password" type="password" placeholder="Password">
<input id="confirm" type="password" placeholder="Konfirmasi Password">

<label>Foto KTP</label>
<input type="file" id="ktp">

<label>Foto Selfie</label>
<input type="file" id="selfie">

<button onclick="register()">Daftar Store</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, createUserWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey:"AIzaSyD3DTcca7yZKVtllCk3TQOUe6Yv2hSyG_g",
authDomain:"shoponline-93646.firebaseapp.com",
databaseURL:"https://shoponline-93646-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"shoponline-93646",
storageBucket:"shoponline-93646.firebasestorage.app",
messagingSenderId:"435032364443",
appId:"1:435032364443:web:5f76384f794693a892bd3e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

/* CLOUDINARY */
const CLOUD_NAME = "djxlbemky";
const UPLOAD_PRESET = "uploadgambar";
const CLOUD_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

async function uploadToCloudinary(file){
  if(!file) return "";

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);

  const res = await fetch(CLOUD_URL, {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  if(!data.secure_url){
    throw new Error("Upload gagal");
  }

  return data.secure_url;
}

window.register = async () => {
try {

const nama = document.getElementById("nama").value.trim();
const deskripsi = document.getElementById("deskripsi").value.trim();
const kategori = document.getElementById("kategori").value.trim();
const alamat = document.getElementById("alamat").value.trim();
const hp = document.getElementById("hp").value.trim();
const wa = document.getElementById("wa").value.trim();

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;
const confirm = document.getElementById("confirm").value;

if(!nama || !email || !password){
alert("Nama, Email, dan Password wajib diisi!");
return;
}

if(password.length < 6){
alert("Password minimal 6 karakter!");
return;
}

if(password !== confirm){
alert("Password tidak sama!");
return;
}

/* AUTH PAKAI EMAIL ASLI */
const userCredential = await createUserWithEmailAndPassword(
  auth,
  email,
  password
);

const uid = userCredential.user.uid;

/* FILE */
const ktpFile = document.getElementById("ktp").files[0];
const selfieFile = document.getElementById("selfie").files[0];
const logoFile = document.getElementById("logo").files[0];
const bannerFile = document.getElementById("banner").files[0];

/* UPLOAD */
const ktp = await uploadToCloudinary(ktpFile);
const selfie = await uploadToCloudinary(selfieFile);
const logo = await uploadToCloudinary(logoFile);
const banner = await uploadToCloudinary(bannerFile);

/* STORE ID */
const storeId = "store_" + Date.now();

/* SAVE DB */
await set(ref(db,"stores/"+storeId),{

uid,
nama,
deskripsi,
kategori,
alamat,
hp,
wa,
email,

logo,
banner,
ktp,
selfie,

role:"store",
status:"pending",
createdAt: Date.now()
});

alert("Store berhasil dibuat!");
location.href = "loginvendor.html";

} catch(err){
console.error(err);

if(err.code === "auth/email-already-in-use"){
alert("Email sudah terdaftar!");
return;
}

alert(err.message || "Gagal register store");
}

};

</script>
</body>
</html>
