/* =========================
AMBIL LOKASI GPS
========================= */

window.ambilLokasi = async ()=>{

if(!navigator.geolocation){

alert("Browser tidak support GPS");
return;

}

navigator.geolocation.getCurrentPosition(

async(pos)=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

try{

const url =
`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`;

const res = await fetch(url);

const data = await res.json();

lokasiDetail = {

provinsi:
data.address.state || "",

kabupaten:
data.address.county || "",

kecamatan:
data.address.city_district || "",

desa:
data.address.village || "",

jalan:
data.address.road || "",

kodepos:
data.address.postcode || "",

latitude: lat,
longitude: lng,

alamatLengkap:
data.display_name || ""

};

lokasiValid = true;

document.getElementById("lokasiBox")
.innerHTML = `

<b>Lokasi Terdeteksi:</b><br><br>

${data.display_name}

`;

}catch(err){

alert("Gagal mengambil lokasi");

}

},

(err)=>{

alert("GPS wajib diaktifkan");

lokasiValid = false;

},

{
enableHighAccuracy:true
}

);

};

/* =========================
UPLOAD CLOUDINARY
========================= */

async function uploadToCloud(file){

const form = new FormData();

form.append("file", file);

form.append("upload_preset",
UPLOAD_PRESET);

const res = await fetch(CLOUD_URL,{
method:"POST",
body:form
});

const data = await res.json();

return data.secure_url;

}

/* =========================
GENERATE SKU
========================= */

function generateSKU(
kategori,
warna,
ukuran
){

return (
kategori.substring(0,3).toUpperCase()
+
"-" +
Date.now()
+
"-" +
warna
+
"-" +
ukuran
);

}

if(!lokasiValid){

btn.disabled = false;

return;

parseInt(

parseInt(

);

parseInt(

);

const diskon =
parseInt(
document.getElementById("diskon").value || 0
);

parseInt(
document.getElementById("ongkir").value || 0

const metodeCOD =

document.getElementById("kategori").value;

const berat =
parseInt(
document.getElementById("berat").value || 0
);

const panjang =
parseInt(
document.getElementById("panjang").value || 0

const lebar =
parseInt(
document.getElementById("lebar").value || 0

parseInt(

/* VALIDASI */

if(!nama || !harga){

btn.disabled = false;
btn.innerHTML = "Simpan Produk";

return;

/* =========================
UPLOAD GAMBAR
========================= */

let gambar = {};

for(let i=0;i<files.length;i++){

gambar[i] =
await uploadToCloud(files[i]);

}

/* =========================

========================= */

let sku = {};

.includes("fashion")){

const warna =
document.getElementById("warna")
.value
.split(",");

const ukuran =
document.getElementById("ukuran")
.value
.split(",");

let no = 0;

warna.forEach(w=>{

ukuran.forEach(u=>{

const kode =
generateSKU(
kategori,
w.trim(),
u.trim()
);

sku["sku"+no] = {

sku:kode,

warna:w.trim(),

ukuran:u.trim(),

stok:stok,

harga:harga

};

no++;

});

});

}
