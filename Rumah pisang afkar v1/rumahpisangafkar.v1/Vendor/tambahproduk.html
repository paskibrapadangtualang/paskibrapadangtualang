<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tambah Produk</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
padding:15px;
}

.box{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

input, textarea{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:14px;
}

button{
width:100%;
padding:14px;
background:#ff6f00;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
font-size:15px;
}

.preview{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:10px;
}

.preview img{
width:70px;
height:70px;
object-fit:cover;
border-radius:8px;
border:1px solid #ddd;
}
</style>
</head>

<body>

<div class="box">

<h2>Tambah Produk</h2>

<input id="nama" placeholder="Nama Produk">
<textarea id="deskripsi" placeholder="Deskripsi"></textarea>

<input id="harga" type="number" placeholder="Harga">
<input id="hargaAwal" type="number" placeholder="Harga Awal">
<input id="stok" type="number" placeholder="Stok">
<input id="diskon" type="number" placeholder="Diskon %">
<input id="lokasi" placeholder="Lokasi">

<label>Kategori Produk</label>
<select id="kategori" style="
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:14px;
">

  <option value="">Pilih Kategori</option>
  <option value="fashion">Fashion</option>
  <option value="food">Food</option>
  <option value="digital">Produk Digital</option>
  <option value="elektronik">Elektronik</option>
  <option value="tanaman">Tanaman</option>
  <option value="dekorasi">Dekorasi</option>
  <option value="makeup">Make Up</option>
  <option value="skincare">Skincare</option>

</select>









<input type="file" id="gambar" multiple accept="image/*">

<div class="preview" id="preview"></div>

<button onclick="uploadProduk()">Simpan Produk</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
apiKey:"AIzaSyD3DTcca7yZKVtllc3TQOUe6Yv2hSyG_g",
authDomain:"shoponline-93646.firebaseapp.com",
databaseURL:"https://shoponline-93646-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"shoponline-93646",
storageBucket:"shoponline-93646.firebasestorage.app",
messagingSenderId:"435032364443",
appId:"1:435032364443:web:5f76384f794693a892bd3e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* CLOUDINARY */
const CLOUD_NAME = "djxlbemky";
const UPLOAD_PRESET = "uploadgambar";
const CLOUD_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

const storeId = localStorage.getItem("storeId");

if(!storeId){
alert("Store belum login");
location.href="login.html";
}

/* PREVIEW */
document.getElementById("gambar").addEventListener("change",(e)=>{
const preview = document.getElementById("preview");
preview.innerHTML = "";

Array.from(e.target.files).forEach(file=>{
const url = URL.createObjectURL(file);
preview.innerHTML += `<img src="${url}">`;
});
});

/* UPLOAD KE CLOUDINARY */
async function uploadToCloud(file){
const form = new FormData();
form.append("file", file);
form.append("upload_preset", UPLOAD_PRESET);

const res = await fetch(CLOUD_URL, {
method:"POST",
body:form
});

const data = await res.json();
return data.secure_url;
}

window.uploadProduk = async () => {

const nama = document.getElementById("nama").value;
const deskripsi = document.getElementById("deskripsi").value;
const harga = parseInt(document.getElementById("harga").value || 0);
const hargaAwal = parseInt(document.getElementById("hargaAwal").value || 0);
const stok = parseInt(document.getElementById("stok").value || 0);
const diskon = parseInt(document.getElementById("diskon").value || 0);
const lokasi = document.getElementById("lokasi").value;
const kategori = document.getElementById("kategori").value;

const files = document.getElementById("gambar").files;

if(!nama || !harga){
alert("Nama & Harga wajib diisi");
return;
}

/* UPLOAD GAMBAR */
let images = {};

for(let i=0;i<files.length;i++){
images[i] = await uploadToCloud(files[i]);
}

/* DATA PRODUK */
const id = "produk" + Date.now();

const data = {
id,
storeId,
nama,
deskripsi,
harga,
hargaAwal,
stok,
diskon,
lokasi,
kategori,
promo: diskon > 0,
kupon: false,
cod: true,
gambar: images
};

await set(ref(db,"produk/"+id),data);

alert("Produk berhasil disimpan");
location.href="produksaya.html";
};

</script>

</body>
</html>
