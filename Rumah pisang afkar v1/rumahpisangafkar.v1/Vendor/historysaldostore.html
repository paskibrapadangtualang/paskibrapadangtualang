<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Riwayat Saldo</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f6f6f6;
padding-bottom:90px;
color:#111;
}

/* ================= HEADER ================= */

.header{

background:
linear-gradient(
180deg,
#ff8a00 0%,
#ff6f00 100%
);

padding:
18px 18px 22px;

color:white;

position:sticky;
top:0;
z-index:99;

display:flex;
align-items:center;
gap:14px;

box-shadow:
0 2px 10px rgba(0,0,0,.08);

}

.back{

width:34px;
height:34px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

background:rgba(255,255,255,.15);

font-size:17px;
cursor:pointer;

}

.titleHeader{
font-size:20px;
font-weight:700;
letter-spacing:.2px;
}

/* ================= LIST ================= */

.list{
padding:14px;
}

/* ================= CARD ================= */

.card{

background:white;

border-radius:18px;

padding:15px;

margin-bottom:12px;

box-shadow:
0 2px 8px rgba(0,0,0,.04);

cursor:pointer;

transition:.15s;

border:1px solid #f1f1f1;

}

.card:active{
transform:scale(.99);
}

/* ================= TOP ROW ================= */

.topRow{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
}

.leftRow{
display:flex;
gap:13px;
flex:1;
}

/* ================= ICON ================= */

.icon{

width:56px;
height:56px;

border-radius:18px;

display:flex;
align-items:center;
justify-content:center;

font-size:22px;

flex:none;

background:#f8eddc;
color:#ff9800;

}
/* ================= TEXT ================= */

.title{

font-size:15px;
font-weight:700;

margin-bottom:4px;

color:#111;

}

.desc{

font-size:13px;
line-height:1.5;

color:#777;

margin-bottom:8px;

word-break:break-word;

}

/* ================= BADGE ================= */

.badge{

display:inline-flex;
align-items:center;
justify-content:center;

padding:5px 10px;

border-radius:999px;

font-size:11px;
font-weight:700;

}

.badge.approved{
background:#dcfce7;
color:#16a34a;
}

.badge.pending{
background:#fff7d6;
color:#d97706;
}

.badge.rejected{
background:#ffe4e6;
color:#dc2626;
}

/* ================= AMOUNT ================= */

.amount{

font-size:17px;
font-weight:700;

white-space:nowrap;

padding-top:2px;

}

.plus{
color:#16a34a;
}

.minus{
color:#dc2626;
}

/* ================= BOTTOM ================= */

.bottomInfo{

margin-top:13px;
padding-top:12px;

border-top:1px solid #f3f3f3;

display:flex;
justify-content:space-between;
align-items:center;

font-size:12px;
color:#999;

}

/* ================= EMPTY ================= */

.empty{

text-align:center;

padding:
90px 20px;

color:#999;

}

.empty i{
font-size:50px;
margin-bottom:15px;
color:#ddd;
}

.empty h3{
font-size:18px;
margin-bottom:6px;
color:#555;
}

.empty p{
font-size:13px;
}

/* ================= LOADING ================= */

.loading{
text-align:center;
padding:70px 20px;
color:#999;
font-size:14px;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<div
class="back"
onclick="history.back()">
<i class="fa fa-arrow-left"></i>
</div>

<div class="titleHeader">
Riwayat Saldo
</div>

</div>

<!-- LIST -->
<div
class="list"
id="list">

<div class="loading">
Memuat riwayat...
</div>

</div>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getDatabase, ref, get } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyD3DTcca7yZKVtllK3TQOUe6Yv2hSyG_g",
authDomain: "shoponline-93646.firebaseapp.com",
databaseURL: "https://shoponline-93646-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "shoponline-93646"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const list = document.getElementById("list");

/* ================= FORMAT ================= */

function rupiah(x){
return "Rp " + Number(x || 0)
.toLocaleString("id-ID");
}

function waktu(t){

if(!t) return "-";

const d = new Date(Number(t));

if(isNaN(d)) return "-";

return d.toLocaleString("id-ID",{
day:"2-digit",
month:"short",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
});

}






function shortId(id){

if(!id) return "-";

/* ambil STORE_ORD + angka utama */
const match = id.match(/STORE_ORD\d+/);

if(match){
return match[0];
}

/* fallback */
return id.substring(0,18);

}








/* ================= LOAD ================= */

async function load(){

const uid = localStorage.getItem("uid");
const storeId = localStorage.getItem("storeId");

let data = [];

/* ================= SALDO HISTORY ================= */

const saldoSnap =
await get(ref(db,"saldoHistory"));

if(saldoSnap.exists()){

saldoSnap.forEach(node=>{

if(node.key === uid || node.key === storeId){

node.forEach(x=>{
data.push(x.val());
});

}

});

}

/* ================= TOPUP ================= */

const topupSnap =
await get(ref(db,"topup"));

if(topupSnap.exists()){

topupSnap.forEach(x=>{

const v = x.val();

if(v.uid !== uid) return;

data.push({
id:v.id,
type:"in",
category:"topup",
amount:v.nominal,
status:v.status,
desc:"Top Up " + v.metode,
createdAt:v.createdAt
});

});

}

/* ================= TRANSFER ================= */

const trfSnap =
await get(ref(db,"transfer"));

if(trfSnap.exists()){

trfSnap.forEach(x=>{

const v = x.val();

const isSender =
v.fromId === uid ||
v.fromId === storeId;

const isReceiver =
v.toId === uid ||
v.toId === storeId;

if(!isSender && !isReceiver) return;

let type = "in";

if(isSender && !isReceiver){
type = "out";
}

data.push({
id:v.id,
type:type,
category:"transfer",
amount:Number(v.nominal || 0),
status:
v.status==="berhasil"
? "approved"
: "pending",

desc:
type==="out"
? "Transfer ke " + (v.namaPenerima || "-")
: "Transfer dari " + (v.namaPengirim || "-"),

createdAt:v.createdAt
});

});

}

/* ================= SORT ================= */

data.sort((a,b)=>
(b.createdAt || 0) -
(a.createdAt || 0)
);

/* ================= EMPTY ================= */

list.innerHTML = "";

if(data.length === 0){

list.innerHTML = `

<div class="empty">

<i class="fa fa-wallet"></i>

<h3>Belum Ada Riwayat</h3>

<p>
Transaksi saldo akan muncul di sini
</p>

</div>

`;

return;

}

/* ================= RENDER ================= */

data.forEach(d=>{

const isOut = d.type === "out";

/* ================= ICON ================= */

let icon = "fa-wallet";
let iconBg = "#f8eddc";
let iconColor = "#ff9800";




if(d.category === "transfer"){

icon =
isOut
? "fa-paper-plane"
: "fa-download";

iconBg =
isOut
? "#ffe4e6"
: "#dcfce7";

iconColor =
isOut
? "#ef4444"
: "#16a34a";

}

/* =========================
PEMBAYARAN MODAL
========================= */

if(d.category === "pembayaran_modal"){

icon = "fa-cart-shopping";

iconBg = "#fee2e2";

iconColor = "#dc2626";

}





/* ================= STATUS ================= */

let badge = "pending";

if(d.status === "approved"){
badge = "approved";
}

if(d.status === "rejected"){
badge = "rejected";
}

/* ================= TITLE ================= */

let title = "Transaksi";

if(d.category === "transfer"){
title =
isOut
? "Transfer Keluar"
: "Uang Masuk";
}

if(d.category === "topup"){
title = "Top Up Saldo";
}


if(d.category === "pembayaran_modal"){
title = "Pembayaran Modal";
}


/* ================= RENDER ================= */

list.innerHTML += `

<div
class="card"
onclick="
location.href=
'${
d.category === 'order_selesai'
? 'Buktitransaksitoko.html'

: d.category === 'pembayaran_modal'
? 'detailtransaksimodal.html'

: 'buktitransaksi.html'
}?id=${d.id}'
"
>

<div class="topRow">

<div class="leftRow">

<div
class="icon"
style="
background:${iconBg};
color:${iconColor};
">

<i class="fa ${icon}"></i>

</div>

<div style="flex:1;min-width:0;">

<div class="title">
${title}
</div>

<div class="desc">
${d.desc}
<br>
ID:${shortId(d.id)}
</div>

<div class="badge ${badge}">
${badge==="approved"
? "Berhasil"
: badge==="rejected"
? "Ditolak"
: "Pending"}
</div>

</div>

</div>

<div
class="amount
${isOut ? 'minus' : 'plus'}">

${isOut ? "-" : "+"}
${rupiah(d.amount)}

</div>

</div>

<div class="bottomInfo">

<div>
${waktu(d.createdAt)}
</div>

<div>
${d.category.toUpperCase()}
</div>

</div>

</div>

`;

});

}

load();







</script>
</body>
</html>
