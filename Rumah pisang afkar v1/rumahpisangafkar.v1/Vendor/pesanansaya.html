<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase,update , ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyD3DTcca7yZKVtllcK3TQOUe6Yv2hSyG_g",

projectId:"shoponline-93646",

messagingSenderId:"435032364443",
appId:"1:435032364443:web:5f76384f794693a892bd3e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);













let currentOrderId = null;




const storeId = localStorage.getItem("storeId");
const list = document.getElementById("list");

if(!storeId){
  list.innerHTML = `<div class="empty">Kamu belum login</div>`;
  throw new Error("No login");
}

async function loadOrders() {

  const snap = await get(ref(db, "pesanan"));

  if (!snap.exists()) {
    list.innerHTML = `<div class="empty">Belum ada pesanan</div>`;
    return;
  }

  let baru = "";
  let proses = "";
  let selesai = "";

  let found = false;

  snap.forEach(item => {

    const data = item.val();
    const items = data.items || {};

    const filteredItems = Object.values(items).filter(p => p.storeId === storeId);

    if (filteredItems.length === 0) return;

    found = true;

    let totalStore = 0;
    filteredItems.forEach(p => {
      totalStore += (p.harga || 0) * (p.qty || 1);
    });

    let status = data.status || "pending";

    let statusClass = "pending";
    if (status === "diproses" || status === "dikirim") statusClass = "proses";
    if (status === "selesai") statusClass = "selesai";

    const card = `
      <div class="card" onclick="openOrder('${data.id}')">

        <div style="font-weight:bold;margin-bottom:5px;">
          ${data.id}
        </div>

        <div style="font-size:12px;color:#666;">
          ${filteredItems.length} produk
        </div>

        <div style="margin-top:8px;font-weight:bold;color:#ff6f00;">
          Rp ${totalStore.toLocaleString("id-ID")}
        </div>

        <span class="status ${statusClass}">
          ${status}
        </span>

      </div>
    `;

    // 🔥 PEMISAH SECTION
    if (status === "selesai") {
      selesai += card;
    } else if (status === "diproses" || status === "dikirim") {
      proses += card;
    } else {
      baru += card;
    }

  });

  if (!found) {
    list.innerHTML = `<div class="empty">Belum ada pesanan masuk</div>`;
    return;
  }

  // 🔥 FINAL OUTPUT SECTION STYLE
  list.innerHTML = `
    ${baru ? `<h3 style="margin:10px 0;">🟠 Pesanan Baru</h3>` + baru : ""}

    ${proses ? `<h3 style="margin:20px 0 10px;">🔵 Pesanan Diproses</h3>` + proses : ""}

    ${selesai ? `<h3 style="margin:20px 0 10px;">🟢 Pesanan Selesai</h3>` + selesai : ""}
  `;
}


function shortId(id){
  if(!id) return "-";
  return id.slice(0, 6) + "..." + id.slice(-3);
}


function resetButton(id,color){

const btn =
document.getElementById(id);

if(!btn) return;

btn.disabled=false;

btn.style.background=color;
btn.style.color="white";
btn.style.cursor="pointer";
btn.style.opacity="1";

}




window.openOrder = async (orderId) => {

resetButton(
"btnTerima",
"#22c55e"
);

resetButton(
"btnTolak",
"#ef4444"
);

resetButton(
"btnDiantar",
"#f59e0b"
);

  currentOrderId = orderId;

  const snap = await get(ref(db, "pesanan/" + orderId));
  if (!snap.exists()) return;






const data = snap.val();

/* PRODUK ORDER INI */
const items = Object.values(
data.items || {}
).filter(
p => p.storeId === storeId
);

/* LOCK BUTTON */
if(data.lockTerima===true)
setLock("btnTerima");

if(data.lockTolak===true)
setLock("btnTolak");

if(data.lockDiantar===true)
setLock("btnDiantar");


 const statusMap = {
pending:1,
disetujui:2,
diproses:3,
dikirim:4,
selesai:5
};

const steps = [
"Pesanan",
"Disetujui",
"Diproses",
"Dikirim",
"Selesai"
];

const level =
statusMap[data.status] || 1;

let total = 0;
let html = "";

html += `
<div style="
display:flex;
justify-content:space-between;
margin-bottom:15px;
">
`;

steps.forEach((s,i)=>{

let bg="#ddd";
let text="#999";

/* =========================
DIBATALKAN
========================= */
if(
data.status==="dibatalkan"
){

bg="#ef4444";
text="#ef4444";

}

/* =========================
SELESAI
========================= */
if(
data.status==="dibatalkan"
){

bg="#ef4444";
text="#ef4444";

}

/* SELESAI = FULL ORANGE */
else if(
data.status==="selesai"
){

bg="#ff6f00";
text="#ff6f00";

}

/* NORMAL */
else if(
i < level
){

bg="#ff6f00";
text="#ff6f00";

}

/* =========================
NORMAL
========================= */
else if(
i < level
){

bg="#ff6f00";
text="#ff6f00";

}

html += `
<div style="
text-align:center;
flex:1;
position:relative;
">

<div style="
width:28px;
height:28px;
border-radius:50%;
margin:auto;
background:${bg};
color:white;
font-size:12px;
line-height:28px;
font-weight:bold;
box-shadow:
0 3px 8px rgba(
0,0,0,.12
);
">

${
data.status==="dibatalkan"
? "✕"
: i+1
}

</div>

<div style="
font-size:10px;
margin-top:6px;
color:${text};
font-weight:bold;
">

${s}

</div>

</div>
`;

});

html += `
</div>
`;
  // =========================
  // SECTION HELPER
  // =========================
  const section = (img, title) => `
    <div style="display:flex;align-items:center;gap:8px;margin:10px 0;font-weight:bold;">
      <img src="assets/images/${img}" style="width:18px;height:18px;">
      <span>${title}</span>
    </div>
    <div>------------------------</div>
  `;

  // =========================
  // DATA PEMBELI
  // =========================
  html += section("ba61750a46794d8847c3f463c5e71cc4.png", "DATA PEMBELI");

html += `
  <div style="font-size:13px;line-height:1.6;">
    <b>${data.nama || "Tanpa Nama"}</b><br>
    <span style="font-size:11px;color:#777;">
      ID: ${shortId(data.user)}
    </span>
  </div>
  <div>------------------------</div>
`;

  // =========================
  // ALAMAT
  // =========================
const a = data.alamat || {};

html += `
  <div style="
    border:1px dashed #ff6f00;
    border-radius:12px;
    padding:12px;
    background:linear-gradient(135deg,#fff7f0,#fff);
    position:relative;
    overflow:hidden;
  ">

    <!-- HEADER LABEL -->
    <div style="
      display:flex;
      align-items:center;
      gap:8px;
      font-weight:bold;
      font-size:13px;
      color:#ff6f00;
      margin-bottom:10px;
    ">
      <img src="assets/images/lokasi 17 (1).png" style="width:18px;height:18px;">
      ALAMAT PENGIRIMAN
    </div>

    <div style="
      font-size:13px;
      line-height:1.7;
      color:#333;
    ">
      <b style="font-size:14px;">
        ${data.nama || "-"}
      </b><br>

      ${a.alamat || "-"}<br>
      ${a.dusun || ""}<br>
      ${a.kecamatan || "-"}<br>
      ${a.kabupaten || "-"}<br>
      ${a.provinsi || "-"}<br>

      <div style="margin-top:6px;font-weight:bold;">
        Kode Pos: ${a.kodepos || "-"}
      </div>
    </div>

    <!-- STAMP STYLE (LIKE ENVELOPE) -->
    <div style="
      position:absolute;
      top:10px;
      right:10px;
      font-size:10px;
      padding:4px 8px;
      border:1px solid #ff6f00;
      border-radius:6px;
      color:#ff6f00;
      font-weight:bold;
      opacity:0.8;
    ">
      SHIPPING
    </div>

  </div>

  <div>------------------------</div>
`;

  // =========================
  // METODE
  // =========================
  html += section("aaq.png", "METODE PEMBAYARAN");

  html += `
    <div style="font-size:13px;">
      ${data.metode || "-"}
    </div>
    <div>------------------------</div>
  `;

  // =========================
  // ORDER INFO
  // =========================
  html += section("aaz.png", "INFORMASI ORDER");

  html += `
    <div style="font-size:13px;line-height:1.6;">
      ID: ${data.id || "-"}<br>
      Status: ${data.status || "-"}<br>
      Tanggal: ${new Date(data.createdAt || Date.now()).toLocaleString("id-ID")}
    </div>
    <div>------------------------</div>
  `;

  // =========================
  // PRODUK
  // =========================
  html += section("shopping-cart.png", "PRODUK");

  items.forEach(p => {

    const subtotal = (p.harga || 0) * (p.qty || 1);
    total += subtotal;

    html += `
      <div style="
        display:flex;
        gap:10px;
        padding:10px 0;
        border-bottom:1px solid #eee;
      ">

        <img src="${p.gambar || 'assets/images/gambar.png'}"
          onerror="this.src='assets/images/gambar.png'"
          style="
            width:55px;height:55px;
            border-radius:10px;
            object-fit:cover;
          ">

        <div style="flex:1;font-size:13px;line-height:1.4;">
          <b>${p.nama || "-"}</b><br>
          Qty: ${p.qty || 1}<br>
          Harga: Rp ${(p.harga || 0).toLocaleString("id-ID")}<br>
          Subtotal: <b style="color:#ff6f00;">Rp ${subtotal.toLocaleString("id-ID")}</b>
        </div>

      </div>
    `;
  });

  // =========================
  // TOTAL
  // =========================
  html += `
    <div style="margin-top:15px;font-size:16px;font-weight:bold;color:#ff6f00;">
      TOTAL: Rp ${total.toLocaleString("id-ID")}
    </div>
  `;

  // =========================
  // SHOW POPUP
  // =========================
  document.getElementById("popupContent").innerHTML = html;
  document.getElementById("orderPopup").style.display = "flex";
};


// CLOSE POPUP
window.closePopup = () => {
  document.getElementById("orderPopup").style.display = "none";
};






function getTimeNow(){
  return {
    timestamp: Date.now(),
    waktu: new Date().toLocaleString("id-ID", {
      year: "numeric",
      month: "long",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    })
  };
}



function setLock(id){

const btn =
document.getElementById(id);

if(!btn) return;

btn.disabled = true;

btn.style.background="#bdbdbd";
btn.style.color="#666";
btn.style.cursor="not-allowed";
btn.style.opacity=".8";

}











window.acceptOrder = async()=>{

if(!currentOrderId) return;

if(
!confirm(
"Terima pesanan?"
)
) return;

await update(
ref(
db,
"pesanan/"+currentOrderId
),
{
status:"diproses",

"logStatus/diterima":
getTimeNow(),

lockTerima:true,
lockTolak:true
}
);

setLock(
"btnTerima"
);

setLock(
"btnTolak"
);

loadOrders();

};
  closePopup();





window.rejectOrder = async()=>{

if(!currentOrderId) return;

if(
!confirm(
"Tolak pesanan ini?"
)
) return;

await update(
ref(
db,
"pesanan/"+currentOrderId
),
{
status:"dibatalkan",

"logStatus/ditolak":
getTimeNow(),

"logStatus/ditolakOleh":
"penjual",

lockTerima:true,
lockTolak:true,
lockDiantar:true
}
);

setLock(
"btnTerima"
);

setLock(
"btnTolak"
);

setLock(
"btnDiantar"
);

alert(
"Pesanan ditolak"
);

loadOrders();

};





window.sendOrder = async()=>{

if(!currentOrderId) return;

/* CEK ORDER */
const snap = await get(
ref(
db,
"pesanan/"+currentOrderId
)
);

if(!snap.exists()) return;

const data = snap.val();

/* WAJIB TERIMA DULU */
if(
data.lockTerima !== true
){

alert(
"Terima pesanan dulu sebelum diantar"
);

return;

}

/* JIKA SUDAH DITOLAK */
if(
data.lockTolak === true &&
data.status==="dibatalkan"
){

alert(
"Pesanan sudah ditolak"
);

return;

}

if(
!confirm(
"Pesanan akan diantar?"
)
) return;

/* UPDATE */
await update(
ref(
db,
"pesanan/"+currentOrderId
),
{
status:"dikirim",

"logStatus/dikirim":
getTimeNow(),

lockDiantar:true
}
);

setLock(
"btnDiantar"
);

alert(
"Pesanan diantar"
);

loadOrders();

};

window.chatBuyer = () => {
  const snap = window.lastOrderData;
  if (!snap) return;

  const phone = snap.noWa || snap.whatsapp || "";

  if (!phone) {
    alert("Nomor pembeli tidak tersedia");
    return;
  }

  window.open(`https://wa.me/${phone}`, "_blank");
};

loadOrders();

</script>
