async function startApp(uid){

/* LOAD ORDER */
const snap =
await get(
ref(
db,
"pesanan"
)
);

/* CEK ADA ORDER ATAU TIDAK */

/* LOOP DATA */

const ordersSelesai = [];
const ordersBatal = [];
const ordersDibatalkan = [];


/* AMBIL DATA */
snap.forEach(item => {

  const d = item.val();

  if(d.user !== uidUser) return;

  adaOrder = true;

  // simpan berdasarkan status




const realStatus =
d.status === "cod"
? "pending"
: d.status;

  ordersDibatalkan.push(d);

}
else if(realStatus === "selesai"){

  ordersSelesai.push(d);

}
else{

  ordersBaru.push(d);

}

ordersBaru.sort((a,b)=>
(b.createdAt || 0) - (a.createdAt || 0)
);

(b.createdAt || 0) - (a.createdAt || 0)

window.lihatDetail = async (data) => {

const urutan = {
  pending: 1,
  disetujui: 2,
  diproses: 3,
  dikirim: 4,
  selesai: 5,
  dibatalkan: 0
};

const realStatus =
  data.status === "cod" ? "pending" : data.status;

const level = urutan[realStatus] ?? 1;

/* =========================
TITLE STATUS
========================= */

let titleStatus = "Detail Pesanan";
let bgStatus = "#ff9800";
let descStatus = "";

if (realStatus === "pending") {
  titleStatus = "Pesanan Menunggu";
  bgStatus = "#ff9800";
  descStatus = "Pesanan sedang menunggu konfirmasi dari penjual.";
}

if (realStatus === "disetujui") {
  titleStatus = "Pesanan Disetujui";
  bgStatus = "#00bcd4";
  descStatus = "Pesanan telah diterima dan disetujui oleh penjual.";
}

if (realStatus === "diproses") {
  titleStatus = "Pesanan Diproses";
  bgStatus = "#9c27b0";
  descStatus = "Pesanan sedang diproses dan disiapkan oleh penjual.";
}

if (realStatus === "dikirim") {
  titleStatus = "Pesanan Dikirim";
  bgStatus = "#2196f3";
  descStatus = "Pesanan sedang diantar ke alamat tujuan.";
}

if (realStatus === "selesai") {
  titleStatus = "Pesanan Selesai";
  bgStatus = "#22c55e";
  descStatus = "Pesanan telah selesai dan diterima dengan baik.";
}

if (realStatus === "dibatalkan") {
  titleStatus = "Pesanan Dibatalkan";
  bgStatus = "#ef4444";
  descStatus = "Pesanan ini telah dibatalkan dan tidak dapat diproses kembali.";
}

/* =========================
BUILD HTML
========================= */

let html = `
<div class="detail-wrapper">

  <div class="tracking">
`;

/* step tracking */
const langkah = ["Pesanan","Disetujui","Diproses","Diantar","Selesai"];

langkah.forEach((x, i) => {
  const aktif = (i + 1) <= level;

  html += `
    <div class="step ${aktif ? "active" : ""}">
      <div class="circle">${i + 1}</div>
      <div class="line"></div>
      <div class="txt">${x}</div>
    </div>
  `;
});

html += `
  </div>

  <div class="receipt">

    <div style="
      background:${bgStatus}15;
      border:1px solid ${bgStatus}35;
      padding:18px;
      border-radius:18px;
      margin-bottom:18px;
    ">

      <div style="
        font-size:21px;
        font-weight:bold;
        color:${bgStatus};
        margin-bottom:8px;
      ">
        ${titleStatus}
      </div>

      <div style="
        font-size:13px;
        line-height:1.7;
        color:#555;
      ">
        ${descStatus}
      </div>

    </div>

    <div class="receipt-header">
      <h3>${realStatus.toUpperCase()}</h3>
      <p>Tracking Pesanan</p>
    </div>

    <div class="receipt-body">

      <div class="row">
        <span>ID</span>
        <span>${data.id}</span>
      </div>

      <div class="row">
        <span>Status</span>
        <span class="status ${realStatus}">${realStatus}</span>
      </div>

      <div class="row">
        <span>Metode</span>
        <span>${data.metode}</span>
      </div>

      <div class="divider"></div>

      <div class="row total">
        <span>Total</span>
        <span>Rp ${(data.total || 0).toLocaleString("id-ID")}</span>
      </div>

      <div class="divider"></div>

      <div class="section-title">Produk</div>
`;






/* =========================
AMBIL NAMA STORE (FIX)
========================= */

const storeSet = new Set();
Object.values(data.items || {}).forEach(item => {
  if (item.storeId) storeSet.add(item.storeId);
});

const storeCache = {};

// hanya tampil NAMA STORE
for (const storeId of storeSet) {

  if (!storeCache[storeId]) {
    const snap = await get(ref(db, "stores/" + storeId));

    storeCache[storeId] = snap.exists()
      ? snap.val()
      : { nama: storeId };
  }

const storeData = storeCache[storeId];

const fotoStore =
storeData.foto ||
storeData.logo ||
storeData.gambar ||
"assets/images/default-store.png";

html += `

<div class="row" style="
align-items:center;
margin-top:10px;
">

  <span>Store</span>

  <div style="
  display:flex;
  align-items:center;
  gap:10px;

    <img
    src="${fotoStore}"
    onerror="this.src='assets/images/default-store.png'"

    border:1px solid #eee;
    ">

    <div style="
    font-weight:bold;
    color:#222;
    ">
      ${storeData.nama}
    </div>

  </div>

</div>

`;
}

/* =========================
LIST PRODUK
========================= */

Object.values(data.items || {}).forEach(x => {

let img = x.gambar || "assets/images/default.png";

      Qty: ${x.qty}
    </div>
    <div style="font-size:12px;font-weight:bold;margin-top:2px;color:#ff6f00;">
      Rp ${(x.harga || 0).toLocaleString("id-ID")}
    </div>
  </div>

</div>

const snap = await get(ref(db, "pesanan/" + id));

if (!snap.exists()) {

popup.remove();
return;
}

const data = snap.val();

/* =========================
CEK STATUS AMAN
========================= */
const statusSekarang = data.status;

if (statusSekarang === "dibatalkan") {
  popup.remove();

  setTimeout(() => {
    alert("Pesanan sudah dibatalkan");
    location.href = `detailpesanan.html?id=${id}`;
  }, 100);

  return;
}

if (statusSekarang === "diproses" || statusSekarang === "dikirim" || statusSekarang === "selesai") {
  alert("Pesanan sudah diproses penjual");
  popup.remove();
  return;
}

UPDATE BATAL + LOG WAKTU
========================= */

})
},

"logStatus/ditolakOleh": "pembeli"
});
/* =========================
REFUND SALDO (FIX AMAN)
========================= */

const userRef = ref(db, "users/" + data.user);
const userSnap = await get(userRef);

if (userSnap.exists()) {

const userData = userSnap.val();

const saldoSekarang = Number(userData.saldo || 0);
const totalOrder = Number(data.total || 0);

const transaksiId = "REFUND" + Date.now();

/* tambah saldo */

saldo: saldoSekarang + totalOrder
});

/* history */
await set(
ref(db, "saldoHistory/" + data.user + "/" + transaksiId),
{
id: transaksiId,
type: "in",
category: "refund",
amount: totalOrder,
metode: "REFUND",
status: "approved",
desc: "Refund pembatalan pesanan",
createdAt: Date.now()
}
);

}

}

/* =========================
SUCCESS
========================= */
popup.remove();
alert("Pesanan berhasil dibatalkan");

location.href = `detailpesanan.html?id=${id}`;

  loadOrders();
}

} catch (err) {

console.log("❌ BATAL ERROR FULL:", err);

console.log("❌ STACK:", err?.stack);

alert("Gagal membatalkan pesanan: " + (err?.message || "unknown error"));

}

};
