body{

/* HEADER */

.header{
  position:relative;
  padding:20px;
  color:white;
  border-radius:0 0 25px 25px;
  overflow:hidden;
  min-height:220px;
  background-size:cover;
  background-position:center;
    z-index:1;

}
.profile{
  display:flex;
  position:relative;
  align-items:center;
  gap:15px;

  margin-top:70px; /* 🔥 ini yang nurunin posisi */
}

.profile img{

width:75px;
height:75px;

border-radius:50%;

object-fit:cover;

border:3px solid white;

}

.nama{

font-size:22px;
font-weight:bold;
}

.level{

margin-top:5px;

display:inline-block;

padding:5px 12px;

background:white;

color:#ff6f00;

border-radius:20px;

font-size:12px;

}

.stats{

display:flex;

gap:25px;

margin-top:15px;

font-size:14px;

}

/* ICON PNG */

.iconRow{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  padding:1px;

  margin-top:-15px;

  position:relative;
  z-index:10; /* 🔥 ini kunci */
}

.iconBox{

background:white;

padding:6px;

border-radius:18px;

text-align:center;

box-shadow:
0 4px 12px rgba(
0,0,0,.05
);

}

.iconBox img{

width:32px;
height:32px;

object-fit:contain;

margin-bottom:8px;

}

.iconBox p{
font-size:11px;
}

/* CARD */

.card{

background:white;

margin:15px;

padding:18px;

border-radius:22px;



}

.title{

display:flex;

justify-content:space-between;

margin-bottom:18px;

font-weight:bold;

}

.menu4{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:12px;

text-align:center;

}

.menu4 i{

font-size:25px;

color:#ff6f00;

margin-bottom:8px;

}

.menu4 p{

font-size:12px;

}

/* DOMPET */

.wallet{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:12px;

}

.walletItem{

background:#fff4ec;

padding:15px;

border-radius:18px;

}

.walletItem h4{

color:#ff6f00;

margin-bottom:5px;

}

/* AKTIVITAS */

.activity{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:12px;

}

.activity div{

background:#fafafa;

padding:18px;

border-radius:16px;

}

/* NAV */

.nav{

position:fixed;

left:0;
right:0;
bottom:0;

height:78px;

background:white;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:
0 -3px 15px rgba(
0,0,0,.08
);

}

.navItem{

display:flex;

flex-direction:column;

align-items:center;

gap:5px;

font-size:12px;

color:#777;

}

.active{
color:#ff6f00;
}

.navItem i{
font-size:20px;
}


.headerOverlay{
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(0,0,0,.4), rgba(0,0,0,.7));
}
















/* CARD */
#afkarCardActivity{
  background:#fff;

  padding:18px;

}

/* TITLE */
#afkarTitleActivity{

}

/* GRID */
#afkarActivityGrid{

/* ITEM */
.afkarActivityItem{
  background:#f8f8f8;
  border-radius:14px;
  padding:14px;

  display:flex;
  align-items:center;
  gap:10px;

  transition:.2s;
  cursor:pointer;
}

.afkarActivityItem:hover{
  transform:translateY(-2px);
  background:#fff3e6;
}

/* ICON */
.afkarIcon{
  font-size:20px;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.05);
}

/* TEXT */
.afkarText{
  font-size:13px;
  font-weight:600;
  color:#333;
}

messagingSenderId:
"435032364443",

appId:
"1:435032364443:web:5f76384f794693a892bd3e"

};


const app=
initializeApp(

);

const db=
getDatabase(
app
);


/* USER LOGIN */

const uidUser=

localStorage.getItem(
"userId"
)

||

"OPMxN10uM3XCKIfRD02Mvd7PdK72";



/* REF USER */

const userRef = ref(db, "users/"+uidUser);

/* =========================
DUMMY BANNER PROFIL (AMAN)
========================= */
async function ensureBanner(){

  const snap = await get(userRef);

  if(!snap.exists()) return;

  const data = snap.val();

  if(!data.bannerProfil){

    await set(userRef, {
      ...data,
      bannerProfil:
        "https://picsum.photos/800/300?random=" + uidUser
    });

    console.log("Banner dummy dibuat");
  }

}
await ensureBanner();


/* BUAT DATA TAMBAHAN OTOMATIS */
async function createExtraData(){

const snap = await get(userRef);
console.log("USER SNAP:", snap.val());
if(!snap.exists()) return;

const data = snap.val();

let updateData = {};

/* FOLLOW */
if(data.mengikuti === undefined)
  updateData.mengikuti = 0;

if(data.pengikut === undefined)
  updateData.pengikut = 0;

/* SALDO */
/* SALDO UTAMA */
if (data.saldo === undefined) {
  updateData.saldo = 0;
}

/* POIN */
if(data.poinAfkar === undefined)
  updateData.poinAfkar = 0;

/* LEVEL */
if(!data.level)
  updateData.level = "Silver Member";

/* BANNER (INI YANG KAMU MAU) */
if(!data.bannerProfil){
  updateData.bannerProfil =
    "https://picsum.photos/800/300?random=" + uidUser;
}

/* SAVE KE FIREBASE */
if(Object.keys(updateData).length > 0){
  await set(ref(db,"users/"+uidUser),{
    ...data,
    ...updateData
  });
}

}


await createExtraData();







/* AMBIL DATA USER */

const snap=
await get(
userRef
);


if(
!snap.exists()
){

document
.getElementById(
"namaUser"
)

.innerHTML=
"User tidak ditemukan";

throw new Error(
"user kosong"
);

}


const user=
snap.val();




document.getElementById("headerBox").style.backgroundImage =
`url(${user.bannerProfil})`;`



linear-gradient(135deg, rgba(0,0,0,.3), rgba(0,0,0,.6)),
url(${user.bannerProfil || "https://picsum.photos/800/300"})
center/cover no-repeat
`;

/* PROFIL */

document

"namaUser"

.innerHTML=

user.nama

"foto"

.src=

document
.getElementById(
"ikut"

user.mengikuti
||

0;


document
.getElementById(
"pengikut"
)

.innerHTML=

user.pengikut
||

0;


/* LEVEL */
document.querySelector(".level").innerHTML =
  user.level || "Silver Member";

/* SALDO UTAMA */
document.getElementById("saldo").innerHTML =
  "Rp " + (user.saldo || 0).toLocaleString("id-ID");


/* HITUNG ORDER */

const orderSnap=

await get(

ref(
db,
"pesanan"
)

);


let belumBayar=0;
let dikemas=0;
let dikirim=0;
let selesai=0;


if(
orderSnap.exists()
){

orderSnap.forEach(

(x)=>{

const d=
x.val();


if(
d.user!==uidUser
)
return;


/* BELUM BAYAR */

if(

d.status==="pending"

||

d.status==="cod"

)

belumBayar++;


/* DIKEMAS */

if(

d.status==="diproses"

||

d.status==="disetujui"

)

dikemas++;


/* DIKIRIM */

if(
d.status==="dikirim"
)
dikirim++;


/* SELESAI */

if(
d.status==="selesai"
)
selesai++;

}

);

}


/* UPDATE MENU ORDER */

const menu=

document.querySelectorAll(
".menu4 p"
);


menu[0].innerHTML=

"Belum Bayar<br><b>"+belumBayar+"</b>";


menu[1].innerHTML=

"Dikemas<br><b>"+dikemas+"</b>";


menu[2].innerHTML=

"Dikirim<br><b>"+dikirim+"</b>";


menu[3].innerHTML=

"Ulasan<br><b>"+selesai+"</b>";
