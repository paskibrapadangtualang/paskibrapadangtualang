async function createDummyProducts(){

const snap =
await get(
ref(db,"produk")
);

snap.exists()
? snap.val()
: {};

const storeSnap =
await get(
ref(db,"stores")

return;

let finalData = {...lama};

let nomor =
Object.keys(finalData).length + 1;

/* =========================
UPDATE PRODUK LAMA
========================= */

Object.keys(finalData).forEach((key)=>{

const p = finalData[key];

finalData[key] = {

...p,

hargaAwal:
p.hargaAwal ||

(
(p.harga || 10000) + 50000
),

diskon:
p.diskon || 20,

promo:
p.promo ?? true,

cod:
p.cod ?? true,

kupon:
p.kupon ?? true,

lokasi:
p.lokasi || "Jakarta",

stok:
p.stok || 10,

gambar:

Array.isArray(p.gambar)

?

p.gambar

:

[
p.gambar ||
"https://picsum.photos/400/400?random="+nomor,

"https://picsum.photos/401/400?random="+nomor,

"https://picsum.photos/402/400?random="+nomor
]

};

});

/* =========================
TAMBAH PRODUK BARU
========================= */

storeSnap.forEach((s)=>{

const storeId = s.key;

Object.values(finalData).forEach((p)=>{

});

"produk"+nomor;

Math.floor(

)+10,

stok:
Math.floor(

)+1,

lokasi:[

"Jakarta",
"Medan",

async function loadStoreVoucher(){

const list = document.getElementById("voucherList");

const snap = await get(ref(db,"voucher"));

if(!snap.exists()){
  list.innerHTML = `<div style="font-size:12px;color:#999;">Belum ada voucher</div>`;
  return;
}

const now = Date.now();

/* =========================
AMBIL DATA VOUCHER USER
========================= */
const usedSnap = await get(ref(db,"userVoucherUsed/"+uid));
const usedData = usedSnap.exists() ? usedSnap.val() : {};
console.log("USED VOUCHER DATA:", usedData);

let html = "";

snap.forEach((x)=>{

const v = x.val();

/* FILTER */
if(v.status !== "aktif") return;
if(v.expired && v.expired < now) return;
if(v.storeId !== id && v.storeId !== "all") return;

/* CEK SUDAH DIPAKAI USER */
const sudahDipakai = !!usedData?.[x.key];

let diskonText = "";

if(v.tipe === "persen"){
  diskonText = v.diskon + "%";
}else if(v.tipe === "ongkir"){
  diskonText = "FREE";
}else{
  diskonText = v.diskon;
}

let label = v.tipe === "ongkir" ? "ONGKIR" : "OFF";

const exp = new Date(v.expired).toLocaleDateString("id-ID");

html += `
<div class="voucherCard">

<div class="voucherLeft">
<div class="voucherDiskon">${diskonText}</div>
<div class="voucherLabel">${label}</div>
</div>

<div class="voucherRight">

<div class="voucherName">${v.nama}</div>

<div class="voucherMin">
Min. Belanja Rp ${(v.minBelanja||0).toLocaleString("id-ID")}
</div>

<div class="voucherExp">
Berlaku sampai ${exp}
</div>

<div class="voucherBottom">

<div class="voucherKode">${v.kode}</div>

<button class="voucherBtn"
style="
background:${sudahDipakai ? '#ccc' : '#ff6f00'};
cursor:${sudahDipakai ? 'not-allowed' : 'pointer'};
"
${sudahDipakai ? 'disabled' : ''}
onclick="pakaiVoucher('${x.key}')">

${sudahDipakai ? 'Dipakai' : 'Pakai'}

</button>

</div>

</div>

</div>
`;

});

list.innerHTML = html || `<div style="font-size:12px;color:#999;">Tidak ada voucher</div>`;

}

loadStoreVoucher();

/* =========================
PAKAI VOUCHER (FIXED FINAL)
========================= */
window.pakaiVoucher = async function(id){

const voucherRef = ref(db,"voucher/"+id);

const snap = await get(voucherRef);

if(!snap.exists()){
  alert("Voucher tidak ditemukan");
  return;
}

const v = snap.val();

// status
if(v.status !== "aktif"){
  alert("Voucher tidak aktif");
  return;
}

// expired
if(v.expired && v.expired < Date.now()){
  alert("Voucher sudah expired");
  return;
}

const kuota = Number(v.kuota || 0);
const dipakai = Number(v.digunakan || 0);

// kuota check
if(kuota > 0 && dipakai >= kuota){
  alert("Kuota voucher habis");
  return;
}

/* =========================
❗ INI FIX UTAMA (MARK USER SUDAH PAKAI)
========================= */
await set(
  ref(db,"userVoucherUsed/"+uid+"/"+id),
  true
);

/* SIMPAN CHECKOUT */
await set(ref(db,"checkoutVoucher/"+uid), {

id:id,
kode:v.kode || "",
nama:v.nama || "",
tipe:v.tipe || "",
diskon:Number(v.diskon || 0),
maxDiskon:Number(v.maxDiskon || 0),
minBelanja:Number(v.minBelanja || 0),
storeId:v.storeId || "all",
createdAt:Date.now()

});

/* UPDATE KUOTA */
if(kuota > 0){
  await update(voucherRef, {
    digunakan: dipakai + 1
  });
}

alert("Voucher berhasil dipakai");
history.back();

};

);

}

if(num >= 1000){

return (
(num / 1000)
.toFixed(1)
.replace(".0","")
+ "rb"
);

}

return num;

}

let totalReview = 0;

document.getElementById("storeRating")
.innerHTML = "0.0";

.innerHTML = "0 Ulasan";

}

// ambil semua produk

  });

if(!produkSnap.exists())
return;

const produkData =
produkSnap.val();

const reviewData =
snap.val();

// loop review
for(const productId in reviewData){

const produk =
produkData[productId];

if(!produk)
continue;

// hanya produk store ini
if(produk.storeId !== storeId)
continue;

const users =
reviewData[productId];

for(const uid in users){

const r = users[uid];

if(!r.rating)
continue;

totalRating +=
Number(r.rating);

totalReview++;

}

}

const avg = totalReview
? (totalRating / totalReview).toFixed(1)
: "0.0";

// UI
document.getElementById("storeRating")
.innerHTML = avg;

document.getElementById("storeReviewCount")
.innerHTML =
formatAngka(totalReview)
+ " Ulasan";

});

/* =========================
   FILTER TERDEKAT (STORE ONLY)
========================= */
function filterProdukTerdekat() {

  const productList = getProductList();
  if (!productList) return;

  productList.innerHTML = "";

  const hasil = window.dataProduk.filter(d => {

    // =========================
    // 1. JIKA ADA GPS (LOKASI DETAIL)
    // =========================
    if (d.lokasiDetail?.latitude && d.lokasiDetail?.longitude) {

      const userLat = window.userLat;
      const userLng = window.userLng;

      if (!userLat || !userLng) return false;

      const distance = getDistanceKm(
        userLat,
        userLng,
        d.lokasiDetail.latitude,
        d.lokasiDetail.longitude
      );

      // radius 10 km
      return distance <= 10;
    }

    // =========================
    // 2. FALLBACK (LOKASI TEXT)
    // =========================
    const userLoc = (window.userLokasi || "").toLowerCase().trim();
    const lokasiProduk = (d.lokasi || "").toLowerCase().trim();

    return userLoc && lokasiProduk === userLoc;
  });

  console.log("HASIL TERDEKAT:", hasil);

  if (hasil.length === 0) {
    productList.innerHTML = `
      <div style="padding:15px;color:#999;font-size:12px;">
        Aktifkan lokasi anda untuk produk terdekat
      </div>
    `;
    return;
  }

  hasil.forEach(d => {

    productList.innerHTML += `
      <div class="card"
      onclick="location.href='detailproduk.html?id=${d.id}'">

        <div class="imgBox">
          <img src="${Array.isArray(d.gambar) ? d.gambar[0] : d.gambar}">
        </div>

        <div class="productInfo">

          <div class="productName">
            ${d.nama || "-"}
          </div>

          <div class="productPrice">
            Rp ${(d.harga || 0).toLocaleString("id-ID")}
          </div>

          <div class="lokasi">
            📍 ${d.lokasiDetail?.kecamatan || d.lokasi || "-"}
          </div>

        </div>

      </div>
    `;
  });
}
function getDistanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371;

  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1 * Math.PI/180) *
    Math.cos(lat2 * Math.PI/180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  return R * c;
}

navigator.geolocation.getCurrentPosition((pos) => {
  window.userLat = pos.coords.latitude;
  window.userLng = pos.coords.longitude;
});
