<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Saldo Saya</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
padding-bottom:100px;
}

/* HEADER */

.header{
background:white;
padding:18px;
font-size:22px;
font-weight:bold;
position:sticky;
top:0;
z-index:99;
box-shadow:0 2px 10px rgba(0,0,0,.06);
}

/* CARD SALDO */

.cardSaldo{
margin:15px;
border-radius:28px;
overflow:hidden;
background:
linear-gradient(135deg,#ff9800,#ff6f00);
padding:22px;
color:white;
position:relative;
box-shadow:0 8px 25px rgba(255,152,0,.28);
}

.cardSaldo::before{
content:"";
position:absolute;
width:180px;
height:180px;
border-radius:50%;
background:rgba(255,255,255,.08);
top:-80px;
right:-50px;
}

.cardSaldo::after{
content:"";
position:absolute;
width:120px;
height:120px;
border-radius:50%;
background:rgba(255,255,255,.06);
bottom:-50px;
left:-30px;
}

.label{
font-size:13px;
opacity:.9;
margin-bottom:10px;
position:relative;
z-index:2;
}

.nominal{
font-size:36px;
font-weight:bold;
margin-bottom:20px;
position:relative;
z-index:2;
}

.userBox{
display:flex;
align-items:center;
gap:14px;
position:relative;
z-index:2;
}

.userBox img{
width:58px;
height:58px;
border-radius:50%;
object-fit:cover;
border:3px solid rgba(255,255,255,.25);
}

.nama{
font-size:17px;
font-weight:bold;
}

.level{
font-size:12px;
margin-top:4px;
opacity:.9;
}

/* MENU */

.menuWrap{
padding:0 15px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-top:10px;
}

.menu{
background:white;
border-radius:22px;
padding:18px;
box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.menu i{
font-size:24px;
color:#ff9800;
margin-bottom:12px;
}

.menuTitle{
font-size:13px;
font-weight:bold;
margin-bottom:5px;
}

.menuDesc{
font-size:12px;
color:#777;
line-height:1.5;
}

/* INFO */

.info{
margin:15px;
background:white;
padding:18px;
border-radius:22px;
box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.row{
display:flex;
justify-content:space-between;
padding:12px 0;
border-bottom:1px solid #f1f1f1;
font-size:14px;
}

.row:last-child{
border-bottom:none;
}

.row span:first-child{
color:#777;
}

.row span:last-child{
font-weight:bold;
color:#222;
}

/* NAV */

.nav{
position:fixed;
left:0;
right:0;
bottom:0;
height:75px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -3px 15px rgba(0,0,0,.08);
z-index:999;
}

.navItem{
display:flex;
flex-direction:column;
align-items:center;
font-size:12px;
color:#777;
gap:5px;
}

.navItem i{
font-size:20px;
}

.active{
color:#ff9800;
}

</style>
</head>
<body>

<div class="header">
Saldo Saya
</div>

<!-- CARD -->
<div class="cardSaldo">

<div class="label">
Total Saldo Anda
</div>

<div class="nominal" id="saldo">
Rp 0
</div>

<div class="userBox">

<img id="foto"
src="https://picsum.photos/200">

<div>

<div class="nama" id="nama">
Loading...
</div>

<div class="level" id="level">
Member
</div>

</div>

</div>

</div>

<!-- MENU -->
<div class="menuWrap">

  <div class="menu">
    <i class="fa fa-wallet"></i>

    <div class="menuTitle">
      Saldo Utama
    </div>

    <div class="menuDesc">
      
    </div>
  </div>

  <div class="menu">
    <i class="fa fa-coins"></i>

    <div class="menuTitle">
      Saldo Afkar
    </div>

    <div class="menuDesc">
      
    </div>
  </div>

  <div
  class="menu"
  onclick="location.href='top-up.html'"
  style="cursor:pointer;"
  >

    <i class="fa fa-plus-circle"></i>

    <div class="menuTitle">
      Top Up
    </div>

    <div class="menuDesc">
      
    </div>

  </div>


   <div
  class="menu"
  onclick="location.href='historytopup.html'"
  style="cursor:pointer;"
  >

    <i class="fa fa-history"></i>

    <div class="menuTitle">
      Riwayat
    </div>

    <div class="menuDesc">
      
    </div>

  </div>

</div>

<!-- INFO -->
<div class="info">

<div class="row">
<span>Email</span>
<span id="email">-</span>
</div>

<div class="row">
<span>WhatsApp</span>
<span id="wa">-</span>
</div>

<div class="row">
<span>Status</span>
<span id="status">-</span>
</div>

<div class="row">
<span>Poin Afkar</span>
<span id="poin">0</span>
</div>

<div class="row">
<span>Saldo Afkar</span>
<span id="saldoAfkar">Rp 0</span>
</div>

</div>

<!-- NAVIGATION -->

<div class="nav">

<div class="navItem"
onclick="location.href='home.html'">
<i class="fa fa-house"></i>
<span>Home</span>
</div>

<div class="navItem active">
<i class="fa fa-wallet"></i>
<span>Saldo</span>
</div>

<div class="navItem"
onclick="location.href='saya.html'">
<i class="fa fa-user"></i>
<span>Saya</span>
</div>

</div>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
get
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:"AIzaSyD3DTcca7yZKVtllCk3TQOUe6Yv2hSyG_g",

authDomain:
"shoponline-93646.firebaseapp.com",

databaseURL:
"https://shoponline-93646-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"shoponline-93646",

storageBucket:
"shoponline-93646.firebasestorage.app",

messagingSenderId:
"435032364443",

appId:
"1:435032364443:web:5f76384f794693a892bd3e"

};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const auth =
getAuth(app);

/* FORMAT RUPIAH */

function rupiah(angka){

return "Rp " +
Number(angka || 0)
.toLocaleString("id-ID");

}

/* LOGIN */

onAuthStateChanged(auth, async(user)=>{

if(!user){

location.href="index.html";
return;

}

try{

const snap =
await get(
ref(db,"users/" + user.uid)
);

if(!snap.exists()) return;

const data = snap.val();

/* SET DATA */

document.getElementById("saldo")
.innerText =
rupiah(data.saldo);

document.getElementById("saldoAfkar")
.innerText =
rupiah(data.saldoAfkar);

document.getElementById("nama")
.innerText =
data.nama || "User";

document.getElementById("level")
.innerText =
data.level || "Member";

document.getElementById("email")
.innerText =
data.email || "-";

document.getElementById("wa")
.innerText =
data.wa || "-";

document.getElementById("status")
.innerText =
data.status || "-";

document.getElementById("poin")
.innerText =
data.poinAfkar || 0;

document.getElementById("foto")
.src =
data.foto ||
"https://picsum.photos/200";

}catch(err){

console.log(err);
alert("Gagal memuat data");

}

});

</script>
</body>
</html>
