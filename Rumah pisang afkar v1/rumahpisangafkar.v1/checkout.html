/* ===========================
BUAT PESANAN
=========================== */
window.buatPesanan = async () => {

  try {

    const metode = document.querySelector("input[name='pay']:checked");

    if (!metode) {
      alert("Pilih metode pembayaran");
      return;
    }

    /* CEK ORDER AKTIF */
    const cek = await get(ref(db, "pesanan"));

    let aktif = 0;

    if (cek.exists()) {
      cek.forEach((x) => {
        const d = x.val();

        if (d.user === uidUser) {
          if (
            d.status === "pending" ||
            d.status === "diproses" ||
            d.status === "dikirim" ||
            d.status === "cod"
          ) {
            aktif++;
          }
        }
      });
    }

    if (aktif >= 2) {
      alert("Anda hanya bisa order 2x dalam pembelian yang belum selesai.");
      return;
    }

    /* VALIDASI SALDO */
    if (metode.value === "SALDO") {
      if ((user.saldo || 0) < totalBelanja) {
        alert("Saldo utama tidak cukup");
        return;
      }
    }

    if (metode.value === "POIN") {
      if ((user.poinAfkar || 0) < totalBelanja) {
        alert("Poin Afkar tidak cukup");
        return;
      }
    }

    /* 🔥 FIX UTAMA: AMBIL ITEMS DARI rawCart (BUKAN cartSnap) */
    const itemsData = rawCart || {};

    const orderId = "ORD" + Date.now();

    orderTemp = {
      id: orderId,
      user: uidUser,
      nama: user.nama || "",
      foto: user.foto || "",
      metode: metode.value,
      status: metode.value === "COD" ? "cod" : "pending",
      alamat: user.alamatLengkap || {},
      total: totalBelanja,
      createdAt: Date.now(),
      items: itemsData   // ✅ FIX DISINI
    };

    /* popup */
    let html = `
      <div style="line-height:1.8;">
        <b>Metode</b><br>${metode.value}<br><br>
        <b>Total</b><br>
        Rp ${totalBelanja.toLocaleString("id-ID")}
    `;

    if (metode.value === "COD") {
      html += `
        <br><br>
        <div style="padding:14px;background:#fff3dc;border-radius:14px;">
          💵 Siapkan uang tunai<br><br>
          <b>Rp ${totalBelanja.toLocaleString("id-ID")}</b>
        </div>
      `;
    }

    html += `</div>`;

    document.getElementById("confirmText").innerHTML = html;
    document.getElementById("confirmBox").style.display = "flex";

  } catch (err) {
    console.log("ERROR BUAT PESANAN:", err);
    alert("Gagal membuat pesanan");
  }
};
