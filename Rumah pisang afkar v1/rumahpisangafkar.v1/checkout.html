/* =========================
LOAD VOUCHER CHECKOUT
========================= */
/* =========================
LOAD VOUCHER CHECKOUT FIX FULL
========================= */
async function loadVoucherCheckout(){

const totalBox =
document.getElementById("total");

const voucherLabel =
document.getElementById("voucherText");

const snap = await get(
ref(db,"checkoutVoucher/" + uidUser)
);

/* default aman */
voucherAktif = null;
potonganVoucher = 0;

if(!snap.exists()){

if(voucherLabel){
voucherLabel.innerHTML = "Belum ada voucher dipilih";
}

finalTotal =
totalBelanja +
Number(biayaAdmin || 0) +
Number(biayaOngkir || 0);

if(totalBox){
totalBox.innerHTML = `
Rp ${finalTotal.toLocaleString("id-ID")}
`;
}

return;
}

const v = snap.val();

/* =========================
EXPIRED
========================= */

if(
v.expired &&
Date.now() > Number(v.expired)
){

await set(
ref(
db,
"checkoutVoucher/"+uidUser
),
null
);

voucherLabel.innerHTML =
"Voucher expired";

finalTotal =
totalBelanja +
Number(biayaAdmin||0) +
Number(biayaOngkir||0);

renderTotal();

return;
}

/* =========================
MIN BELANJA
========================= */

if(
totalBelanja <
Number(
v.minBelanja||0
)
){

voucherLabel.innerHTML =
`Minimal belanja Rp ${
Number(
v.minBelanja||0
)
.toLocaleString("id-ID")
}`;

finalTotal =
totalBelanja +
Number(biayaAdmin||0) +
Number(biayaOngkir||0);

renderTotal();

return;
}

/* =========================
AKTIFKAN VOUCHER
========================= */

voucherAktif = v;

/* PERSEN */

if(
v.tipe==="persen"
){

potonganVoucher =
Math.floor(

totalBelanja *

(
Number(
v.diskon||0
)/100

)

);

if(v.maxDiskon){

potonganVoucher =
Math.min(
potonganVoucher,
Number(
v.maxDiskon
)
);

}

}

/* ONGKIR */

else if(
v.tipe==="ongkir"
){

potonganVoucher =
Math.min(
Number(
v.diskon||0
),
Number(
biayaOngkir||0
)
);

}

/* NOMINAL */

else if(
v.tipe==="nominal"
){

potonganVoucher =
Number(
v.diskon||0
);

}

/* HITUNG TOTAL */

finalTotal = Math.max(

(
totalBelanja +
Number(
biayaAdmin||0
) +
Number(
biayaOngkir||0
)

)

-

Number(
potonganVoucher||0
),

0

);

/* LABEL */

voucherLabel.innerHTML = `

${v.kode}

<br>

Potongan :
Rp ${potonganVoucher.toLocaleString("id-ID")}

`;

renderTotal();

}

function showToast(

type="info"
){

const wrap =
document.getElementById(
"toastWrap"
);

let icon = "";

if(type==="success"){
icon = "";
}

if(type==="error"){
icon = "";
}

if(type==="warning"){
icon = "";
}

const div =
document.createElement("div");

div.className =
"toast " + type;

div.innerHTML = `

<div class="toastIcon">
${icon}
</div>

<div>
${msg}
</div>

`;

wrap.appendChild(div);

setTimeout(()=>{

div.style.animation =
"toastHide .2s ease forwards";

setTimeout(()=>{
div.remove();
},200);

},2500);

}
