<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Edit Data</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
padding-bottom:100px;
}

.header{

position:sticky;
top:0;

background:
linear-gradient(
135deg,
#ff6f00,
#ff8c00
);

padding:18px;

color:white;

display:flex;
align-items:center;
gap:15px;

font-weight:bold;
font-size:18px;

z-index:100;
}

.back{
font-size:20px;
cursor:pointer;
}

.profileBox{

background:white;

margin:15px;

padding:20px;

border-radius:18px;

box-shadow:
0 3px 12px rgba(0,0,0,.05);

text-align:center;
}

.profileBox img{

width:100px;
height:100px;

border-radius:50%;

object-fit:cover;

border:4px solid #ff7a00;

}

.uploadBtn{

margin-top:15px;

display:inline-block;

padding:10px 18px;

background:#fff3ea;

color:#ff6f00;

border-radius:12px;

font-size:14px;

}

.section{

background:white;

margin:15px;

padding:18px;

border-radius:18px;

box-shadow:
0 3px 12px rgba(0,0,0,.05);

}

.title{
font-size:15px;
font-weight:bold;
margin-bottom:15px;
color:#ff6f00;
}

input,
select,
textarea{

width:100%;

padding:15px;

margin-bottom:14px;

border:none;

outline:none;

border-radius:14px;

background:#f3f4f6;

}

textarea{
height:120px;
resize:none;
}

.saveBtn{

margin:15px;

padding:16px;

border:none;

width:calc(100% - 30px);

background:
linear-gradient(
135deg,
#ff6f00,
#ff8c00
);

color:white;
font-size:15px;
font-weight:bold;
border-radius:15px;

}

#status{
text-align:center;
font-size:13px;
color:#777;
}


#loadingBox{

position:fixed;

top:0;
left:0;

width:100%;
height:100vh;

background:
rgba(255,255,255,.92);

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

gap:12px;

z-index:99999;

}

.spinner{

width:60px;
height:60px;

border-radius:50%;

border:6px solid #ececec;

border-top-color:#ff6f00;
border-right-color:#ff8c00;

animation:
spin .7s linear infinite;

}

@keyframes spin{

0%{
transform:rotate(0deg);
}

100%{
transform:rotate(360deg);
}

}
#statusText{

font-size:14px;

font-weight:bold;

color:#ff6f00;

}

#notif{

position:fixed;

top:15px;
left:15px;
right:15px;
padding:14px;
border-radius:14px;
background:
linear-gradient(
135deg,
#ff6f00,
#ff8c00
);

color:white;
font-weight:bold;
display:none;
z-index:9999;
box-shadow:
0 8px 25px rgba(0,0,0,.15);

}


</style>
</head>

<body>

<div class="header">

<i class="fa fa-arrow-left back"
onclick="history.back()"></i>

Edit Profil

</div>

<div class="profileBox">

<img id="preview">

<br>

<label class="uploadBtn">

<i class="fa fa-camera"></i>
Ganti Foto

<input
type="file"
id="foto"
accept="image/*"
hidden>

</label>

</div>

<div class="section">

<div class="title">
Informasi Akun
</div>

<input id="nama"
placeholder="Nama Lengkap">

<input id="email"
placeholder="Email">

<input id="wa"
placeholder="No Whatsapp">

<select id="jk">

<option>
Laki-Laki
</option>

<option>
Perempuan
</option>

</select>

</div>

<div class="section">

<div class="title">
Alamat Pengiriman
</div>

<input id="dusun"
placeholder="Dusun">

<input id="kecamatan"
placeholder="Kecamatan">

<input id="kabupaten"
placeholder="Kabupaten">

<input id="provinsi"
placeholder="Provinsi">

<input id="kodepos"
placeholder="Kode Pos">

<textarea
id="alamat"
placeholder="Alamat lengkap">
</textarea>

</div>

<div class="section">

<div class="title">
Rekening / Ewallet
</div>

<input id="bank"
placeholder="Bank / Ewallet">

<input id="norek"
placeholder="Nomor Rekening">

<input id="namarek"
placeholder="Nama Rekening">

</div>

<div class="section">

<div class="title">
PIN Saldo Internal
</div>

<input
type="password"
id="pin"
maxlength="6"
placeholder="PIN 6 digit">

</div>

<button
class="saveBtn"
onclick="simpan()">

Simpan Perubahan

</button>



<div id="loadingBox">

<div class="spinner"></div>

<div id="statusText">
Memuat profil...
</div>

</div>

<div id="notif"></div>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
get,
update
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={

apiKey:"AIzaSyD3DTcca7yZKVtllCk3TQOUe6Yv2hSyG_g",

authDomain:"shoponline-93646.firebaseapp.com",

databaseURL:"https://shoponline-93646-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"shoponline-93646",

storageBucket:"shoponline-93646.firebasestorage.app",

messagingSenderId:"435032364443",

appId:"1:435032364443:web:5f76384f794693a892bd3e"

};

const app=
initializeApp(firebaseConfig);

const db=
getDatabase(app);

const uid=
localStorage.getItem(
"userId"
);

async function load(){

const snap=
await get(
ref(
db,
"users/"+uid
)
);

if(!snap.exists()){
loadingBox.style.display="none";
return;

}

const d=
snap.val();

preview.src=
d.foto;

nama.value=
d.nama||"";

email.value=
d.email||"";

wa.value=
d.wa||"";

jk.value=
d.jk||"";

dusun.value=
d.alamatLengkap?.dusun||"";

kecamatan.value=
d.alamatLengkap?.kecamatan||"";

kabupaten.value=
d.alamatLengkap?.kabupaten||"";

provinsi.value=
d.alamatLengkap?.provinsi||"";

kodepos.value=
d.alamatLengkap?.kodepos||"";

alamat.value=
d.alamatLengkap?.alamat||"";

bank.value=
d.bank||"";

norek.value=
d.norek||"";

namarek.value=
d.namarek||"";



/* HILANGKAN SPINNER */
/* DELAY 2 DETIK */

setTimeout(()=>{

loadingBox.style.display="none";

},2000);

}

load();


window.simpan=
async()=>{

loadingBox.style.display="flex";

statusText.innerText=
"Menyimpan perubahan...";

await update(

ref(
db,
"users/"+uid
),

{

nama:nama.value,
email:email.value,
wa:wa.value,
jk:jk.value,

bank:bank.value,
norek:norek.value,
namarek:namarek.value,

pinTransfer:
pin.value,

pinSudahDibuat:
pin.value!=="",

profilLengkap:true,

alamatLengkap:{

dusun:dusun.value,

kecamatan:
kecamatan.value,

kabupaten:
kabupaten.value,

provinsi:
provinsi.value,

kodepos:
kodepos.value,

alamat:
alamat.value

}

}

);

setTimeout(()=>{

loadingBox.style.display="none";

notif.style.display="block";

notif.innerHTML=
"<i class='fa fa-circle-check'></i> Data berhasil diperbarui";

setTimeout(()=>{

notif.style.display="none";

},3000);

},2000);

notif.innerHTML=
"<i class='fa fa-circle-check'></i> Data berhasil diperbarui";

setTimeout(()=>{

notif.style.display="none";

},3000);

};

</script>

</body>
</html>
