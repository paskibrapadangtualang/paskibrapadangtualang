function renderStars(rating) {
  let stars = "";
  const r = Math.round(Number(rating));

  for (let i = 1; i <= 5; i++) {

    let size = "10px"; // kecil
    if (i === 2) size = "14px"; // sedang
    if (i >= 3) size = "18px"; // besar

    if (i <= r) {
      stars += `<span style="color:#ff9800;font-size:${size};">★</span>`;
    } else {
      stars += `<span style="color:#ccc;font-size:${size};">★</span>`;
    }
  }

  return stars;
}

function formatTerjual(num){

num = Number(num || 0);

if(num >= 1000000){

return (
(num/1000000)
.toFixed(1)
.replace(".0","")
+ "jt"
);

}

if(num >= 1000){

return (
(num/1000)
.toFixed(1)
.replace(".0","")
+ "rb"
);

}

return num;

}

window.addCart = async () => {

  if (!requireLogin()) return;

  // 🔥 CEK STOK DULU
  const stok = Number(data.stok || 0);

  if (stok <= 0) {
    showStokModal(); // popup Shopee
    return; // STOP
  }

  const uid = getUID();

  try {

    const produkId =
      data.id ||
      id ||
      "produk_" + Date.now();

    const gambarUtama =
      Array.isArray(data.gambar)
        ? data.gambar[0]
        : data.gambar;

    await set(
      ref(db, "cart/" + uid + "/" + produkId),
      {

        /* =========================
        INFO PRODUK
        ========================= */

        id: produkId,

        nama: data.nama || "",

        harga: Number(data.harga || 0),

        qty: 1,

        stok: Number(data.stok || 0),

        gambar: gambarUtama || "",

          // 🔥 FIX INI
  ongkir: Number(data.ongkir || 0),

        hargaAwal: Number(data.hargaAwal || 0),

         cod: true,
  codAllowed: true,


        storeId:
        data.storeId || "unknown_store",

        kategori:
        data.kategori || "",

        deskripsi:
        data.deskripsi || "",

        /* =========================
        PRODUK GUDANG
        ========================= */

        gudangProduk:
        data.gudangProduk || false,

        gudangId:
        data.gudangId || "",

        supplier:
        data.supplier || "",

        supplierResmi:
        data.supplierResmi || false,

        /* =========================
        HARGA GUDANG
        ========================= */

        hargaModal:
        Number(data.hargaModal || 0),

        hargaJual:
        Number(data.hargaJual || data.harga || 0),

        keuntunganStore:
        Number(data.keuntunganStore || 0),

        komisi:
        Number(data.komisi || 0),

        komisiPersen:
        Number(data.komisiPersen || 0),

        penjelasanKomisi:
        data.penjelasanKomisi || ""

      }
    );

    alert("Produk ditambahkan ke keranjang");

  }

  catch (err) {

    console.log("CART ERROR:", err);

    alert("Gagal menambahkan");

  }

};



window.checkoutNow = async () => {

  if (!requireLogin()) return;

  // CEK STOK DULU
  const stok = Number(data.stok || 0);

  if (stok <= 0) {
    showStokModal(); // popup Shopee
    return; // STOP DI SINI
  }

  const uid = getUID();

  const alamatLengkap = await cekAlamatLengkap(uid);

  if (!alamatLengkap) {
    showAlamatModal();
    return;
  }


  const productId =
    data.id ||
    new URLSearchParams(location.search).get("id") ||
    "prod_" + Date.now();

  const product = {
    id: productId,
    nama: data.nama || "",
    harga: Number(data.harga) || 0,
    qty: 1,
      // 🔥 FIX INI
  ongkir: Number(data.ongkir || 0),

    gambar: Array.isArray(data.gambar)
      ? data.gambar[0]
      : (data.gambar || ""),
    storeId: data.storeId || "unknown_store",
    gudangProduk: data.gudangProduk || false,
    gudangId: data.gudangId || "",
    supplier: data.supplier || "",
    supplierResmi: data.supplierResmi || false,
    hargaModal: Number(data.hargaModal || 0),
    hargaJual: Number(data.hargaJual || data.harga || 0),
    keuntunganStore: Number(data.keuntunganStore || 0),
    komisi: Number(data.komisi || 0),
    komisiPersen: Number(data.komisiPersen || 0),
    penjelasanKomisi: data.penjelasanKomisi || ""
  };

  localStorage.setItem("checkoutMode", "buynow");
  localStorage.setItem("buyNowCart", JSON.stringify({
    [product.id]: product
  }));

  location.href = "checkout.html";
};
