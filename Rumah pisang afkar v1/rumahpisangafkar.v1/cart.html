<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Keranjang</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

.item{

background:white;

padding:15px;

margin-bottom:10px;

border-radius:15px;

display:flex;

gap:10px;
}

img{
width:80px;
height:80px;
object-fit:cover;
}

.buy{

width:100%;

height:55px;

border:none;

background:#ff9800;

color:white;

border-radius:15px;

}

</style>

</head>

<body>

<h2>Keranjang</h2>

<div id="list"></div>

<button
class="buy"

onclick="
location.href=
'checkout.html'
">

Checkout

</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase,
  ref,
  get,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyD3DTcca7yZKVtllCk3TQOUe6Yv2hSyG_g",
  authDomain: "shoponline-93646.firebaseapp.com",
  databaseURL: "https://shoponline-93646-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "shoponline-93646",
  storageBucket: "shoponline-93646.firebasestorage.app",
  messagingSenderId: "435032364443",
  appId: "1:435032364443:web:5f76384f794693a892bd3e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

await setPersistence(auth, browserSessionPersistence);

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    location.href = "index.html";
    return;
  }

 const list = document.getElementById("list");

const cartRef = ref(db, "cart/" + user.uid);
const snap = await get(cartRef);

list.innerHTML = "";

if (snap.exists()) {

  snap.forEach((child) => {
    const d = child.val();

    if (!d || !d.nama) return;

list.innerHTML += `
  <div class="item">
    <img src="${d.gambar || ''}">
    <div>
      <b>${d.nama}</b><br>
      Rp ${(d.harga || 0).toLocaleString("id-ID")}<br>
      Qty: ${d.qty || 1}<br>

      <small style="color:#888">
        Store: ${d.storeId || "❌ missing storeId"}
      </small>

    </div>
  </div>
`;
  });

} else {
  list.innerHTML = "<p>Keranjang kosong</p>";
}

});

</script>

</body>
</html>
