<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="
width=device-width,
initial-scale=1
">

<title>Keranjang Saya</title>

<link rel="stylesheet"
href="
https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css
">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
padding-bottom:100px;
}

.header{

height:70px;

background:#d29a01;

display:flex;
color: #ffffff;

align-items:center;

padding:20px;

font-size:22px;

font-weight:bold;

box-shadow:
0 2px 10px rgba(
0,0,0,.05
);

}

.list{
padding:15px;
}

.item{

background:white;

border-radius:20px;

padding:12px;

margin-bottom:12px;

display:flex;

gap:12px;

box-shadow:
0 3px 10px rgba(
0,0,0,.05
);

}

.item img{

width:90px;

height:90px;

object-fit:cover;

border-radius:14px;

}

.info{
flex:1;
}

.nama{

font-size:15px;

font-weight:bold;

margin-bottom:8px;
}

.harga{

color:#ff6f00;

font-weight:bold;

margin-bottom:8px;
}

.qty{

display:flex;

gap:10px;

align-items:center;
}

.qty button{

width:30px;

height:30px;

border:none;

border-radius:8px;

background:#fff3dc;

}

.bottom{

position:fixed;

left:0;
right:0;
bottom:0;

height:85px;

background:white;

padding:12px;

display:flex;

align-items:center;

justify-content:space-between;

box-shadow:
0 -3px 15px rgba(
0,0,0,.08
);

}

.checkout{

height:50px;

padding:0 25px;

border:none;

border-radius:15px;

background:#ff9800;

color:white;

}

.total{

font-size:18px;

font-weight:bold;

color:#ff6f00;
}

.empty{

padding:60px;

text-align:center;

color:#888;
}

</style>

</head>

<body>

<div class="header">

Keranjang Saya

</div>

<div
class="list"
id="list"
>

</div>

<div class="bottom">

<div
class="total"
id="total"
>

Rp 0

</div>

<button
class="checkout"

onclick="
location.href=
'checkout.html'
"

>

Checkout

</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase,
  ref,
  get,
  set,
  remove,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey:"AIzaSyD3DTcca7yZKVtllCk3TQOUe6Yv2hSyG_g",
  authDomain:"shoponline-93646.firebaseapp.com",
  databaseURL:"https://shoponline-93646-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"shoponline-93646",
  storageBucket:"shoponline-93646.firebasestorage.app",
  messagingSenderId:"435032364443",
  appId:"1:435032364443:web:5f76384f794693a892bd3e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

/* UI */
document.body.style.display = "none";

/* LOGIN */
onAuthStateChanged(auth, (user) => {

  if (!user) {
    location.href = "index.html";
    return;
  }

  document.body.style.display = "block";

  loadCart(user.uid);

});

/* =========================
   LOAD CART
========================= */

function loadCart(uid){

  const list = document.getElementById("list");
  const totalText = document.getElementById("total");

  const cartRef = ref(db, "cart/" + uid);

  onValue(cartRef, (snapshot) => {

    list.innerHTML = "";
    let total = 0;

    if (!snapshot.exists()) {
      list.innerHTML = `<div class="empty">Keranjang kosong</div>`;
      totalText.innerHTML = "Rp 0";
      return;
    }

    snapshot.forEach((item) => {

      const data = item.val();

      const harga = data.harga || 0;
      const qty = data.qty || 1;

      total += harga * qty;

      list.innerHTML += `
        <div class="item">
          <img src="${data.gambar || ''}">
          <div class="info">
            <div class="nama">${data.nama}</div>
            <div class="harga">Rp ${harga.toLocaleString("id-ID")}</div>
            <div class="qty">
              <button onclick="minusQty('${item.key}', '${uid}')">-</button>
              <span>${qty}</span>
              <button onclick="plusQty('${item.key}', '${uid}')">+</button>
            </div>
          </div>
        </div>
      `;

    });

    totalText.innerHTML = "Rp " + total.toLocaleString("id-ID");

  });

}

/* =========================
   PLUS QTY
========================= */

window.plusQty = async (id, uid) => {

  const itemRef = ref(db, "cart/" + uid + "/" + id);

  const snap = await get(itemRef);

  if (!snap.exists()) return;

  const d = snap.val();

  await set(itemRef, {
    ...d,
    qty: (d.qty || 1) + 1
  });

};

/* =========================
   MINUS QTY
========================= */

window.minusQty = async (id, uid) => {

  const itemRef = ref(db, "cart/" + uid + "/" + id);

  const snap = await get(itemRef);

  if (!snap.exists()) return;

  const d = snap.val();

  let qty = (d.qty || 1) - 1;

  if (qty <= 0) {
    await remove(itemRef);
    return;
  }

  await set(itemRef, {
    ...d,
    qty
  });

};

</script>

</body>

</html>
