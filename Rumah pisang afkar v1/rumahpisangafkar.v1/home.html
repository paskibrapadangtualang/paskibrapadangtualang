// ======================
// CHAT BADGE REALTIME
// ======================

onValue(

ref(
db,
"chatcostumer"
),

(snapshot)=>{

let unreadRoom = 0;

if(snapshot.exists()){

snapshot.forEach((storeSnap)=>{

storeSnap.forEach((userSnap)=>{

const userId =
userSnap.key;

if(userId !== uid)
return;

const messages =
userSnap.val();

let adaBelumDibaca =
false;

Object.values(messages)
.forEach((msg)=>{

if(

msg.sender !== uid &&

!msg.readBy?.[uid]

){

adaBelumDibaca = true;

}

});

if(adaBelumDibaca){

unreadRoom++;

}

});

});

}

if(unreadRoom > 0){

chatBadge.style.display=
"flex";

chatBadge.innerText=
unreadRoom;

}else{

chatBadge.style.display=
"none";

}

}

);


// ======================
// CART BADGE REALTIME

onValue(

ref(
db,
"cart/" + uid
),

(snapshot)=>{

let totalCart = 0;

if(snapshot.exists()){

snapshot.forEach((itemSnap)=>{

const item =
itemSnap.val();

/* jumlah qty */
totalCart +=
item.qty || 1;

});

}

if(totalCart > 0){

cartBadge.style.display =
"flex";

totalCart;

}else{

"none";

}

}

);

// =========================

function createCard(data,key){

const harga=
(data.harga||0)
.toLocaleString(
"id-ID"
);

const hargaAwal=
(data.hargaAwal||0)
.toLocaleString(
"id-ID"
);

const produkId=
data.id || key;

const gambarUtama=

Array.isArray(
data.gambar
)

?

data.gambar[0]

:

(
data.gambar ||

"https://via.placeholder.com/300"
);


return `

<div

class="card"

data-id="${produkId}"

>

${data.promo ? `
<div class="promo">
PROMO
</div>

` : ""}

<img src="${gambarUtama}">

<div class="info">

<div class="nama">

${data.nama||"-"}

</div>

<div class="harga">

Rp ${harga}

</div>

<div class="coret">

Rp ${hargaAwal}

</div>

<div class="row">

${
data.cod ? `
<div class="tag" style="display:flex;align-items:center;gap:5px;">
  <img src="assets/images/cash-on-delivery.png" style="width:14px;height:14px;object-fit:contain;">
  COD
</div>
` : ''
}

${
data.kupon ? `
<div class="tag" style="display:flex;align-items:center;gap:5px;">
  <img src="assets/images/id-50009109-dd50489812b1eb792c5cfae00a3b512a@resize_w90_nl.webp" style="width:14px;height:14px;object-fit:contain;">
  Kupon
</div>
` : ''
}

<div class="tag" style="display:flex;align-items:center;gap:5px;">
  <img src="assets/images/id-11134258-7rbkc-mas4hs48hfp464@resize_w90_nl.webp" style="width:34px;height:34px;object-fit:contain;">

<div class="tag" style="display:flex;align-items:center;gap:5px;">
  <img src="assets/images/destination.png" style="width:14px;height:14px;object-fit:contain;">
  ${data.lokasi || "-"}
</div>

</div>
</div>
</div>

`;

}

let produkListener = null;

function loadProducts(){

// cegah listener dobel
if(produkListener) return;

produkListener = onValue(produkRef, (snapshot)=>{

let html = "";

// kalau kosong
if(!snapshot.exists()){
produkList.innerHTML = "<div style='text-align:center;color:#888'>Tidak ada produk</div>";
return;
}

snapshot.forEach((item)=>{

const data = item.val();
const key = item.key;

// safety data
const harga = data.harga ?? 0;
const hargaAwal = data.hargaAwal ?? 0;

html += createCard(data, key);

});

// render sekali saja
produkList.innerHTML = html;

// event klik pakai delegation (WAJIB FIX)

const id = card.dataset.id;

{

const slider =

const dots =

let current = 0;


// BUAT BANNER

bannerDummy.forEach(
(item,index)=>{

slider.innerHTML += `

dots.innerHTML += `

<div class="

}

// UPDATE DOT

function updateDot(){

document
.querySelectorAll(
".dot"
)

.forEach(
x=>x.classList.remove(
"active"
)
);

document
.querySelectorAll(
".dot"
)

[current]

.classList.add(
"active"
);

}


// NEXT

window.nextBanner =
function(){

current++;

if(
current >=
bannerDummy.length
){

current = 0;

}

slider.scrollTo({

left:
slider.offsetWidth
*
current,

behavior:
"smooth"

});

updateDot();

};


// PREV

window.prevBanner =
function(){

current--;

if(
current < 0
){

current =
bannerDummy.length - 1;

}

slider.scrollTo({

left:
slider.offsetWidth
*
current,

behavior:
"smooth"

});

updateDot();

};


// AUTO SLIDE

setInterval(()=>{

nextBanner();

},4000);


// GESER MANUAL

slider.addEventListener(
"scroll",

()=>{

current =
Math.round(

slider.scrollLeft /
slider.offsetWidth

);

updateDot();

}

);

});
}

allStore.push({ id: x.key, ...x.val() });
});

const q = e.target.value.toLowerCase().trim();

if (!q) {

return;
}

(p.nama || "").toLowerCase().includes(q)

(s.nama || "").toLowerCase().includes(q)
);

function initKategori() {

  const boxes = document.querySelectorAll(".catBox");

  boxes.forEach((box) => {

    box.onclick = function () {

      const kategori = this.dataset.kat || "all";

      console.log("Klik kategori:", kategori);

      // 🔥 redirect ke halaman detail
      window.location.href =
        "detailkatagori.html?kategori=" + encodeURIComponent(kategori);

    };

  });

}

// panggil setelah semua render
initKategori();
