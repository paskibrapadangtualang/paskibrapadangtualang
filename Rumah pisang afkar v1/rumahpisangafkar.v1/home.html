// ======================
// CHAT BADGE REALTIME
// ======================

onValue(ref(db,"chatcostumer"),(snapshot)=>{

let unreadRoom=0;

if(snapshot.exists()){

snapshot.forEach((storeSnap)=>{
storeSnap.forEach((userSnap)=>{

const userId=userSnap.key;
if(userId!==uid)return;

const messages=userSnap.val();
let adaBelumDibaca=false;

Object.values(messages).forEach((msg)=>{
if(msg.sender!==uid && !msg.readBy?.[uid]){
adaBelumDibaca=true;
}
});

if(adaBelumDibaca)unreadRoom++;

});
});

}

if(unreadRoom>0){
chatBadge.style.display="flex";
chatBadge.innerText=unreadRoom;
}else{
chatBadge.style.display="none";
}

});


// ======================
// CART BADGE REALTIME
// ======================

onValue(ref(db,"cart/"+uid),(snapshot)=>{

let totalCart=0;

if(snapshot.exists()){

snapshot.forEach((itemSnap)=>{
const item=itemSnap.val();
totalCart+=item.qty||1;
});

}

if(totalCart>0){
cartBadge.style.display="flex";
cartBadge.innerText=totalCart;
}else{
cartBadge.style.display="none";
}

});

function hitungRating(reviews){
  if(!reviews || reviews.length === 0){
    return { avg: 0, count: 0 };
  }

  let total = 0;

  reviews.forEach(r => {
    total += Number(r.rating || 0);
  });

  return {
    avg: total / reviews.length,
    count: reviews.length
  };
}

// =========================
// TRENDING FROM FIREBASE

let trendingSearch = [];

// ambil dari firebase
async function loadTrendingSearch(){
  const snap = await get(ref(db, "searchTrending"));

  if (snap.exists()) {
    trendingSearch = Object.values(snap.val()).slice(0, 6);
  } else {
    // fallback + auto seed ke firebase
    trendingSearch = [
      "toko termurah",
      "makanan ringan",
      "hp murah",
      "keripik pisang",
      "fashion wanita",
      "skincare viral"
    ];

    // auto simpan ke firebase (biar jadi default database)
    const seed = {};
    trendingSearch.forEach((v, i) => {
      seed[i] = v;
    });

    await set(ref(db, "searchTrending"), seed);
  }

  renderIdleSearch();
}

// panggil sekali saat load
loadTrendingSearch();
// =========================
// SHOW / HIDE
// =========================
function openSearch(){
  searchResult.style.display = "block";
}

function closeSearch(){
  setTimeout(() => {
    searchResult.style.display = "none";
  }, 200);
}

// fokus input → tampilkan
searchInput.addEventListener("focus", () => {
  openSearch();
});

// blur → sembunyikan
searchInput.addEventListener("blur", () => {
  closeSearch();
});

// =========================
// SAVE HISTORY
// =========================
function saveSearchHistory(q){
  if(!q) return;

  searchHistory = searchHistory.filter(x => x !== q);
  searchHistory.unshift(q);

  if(searchHistory.length > 8){
    searchHistory.pop();
  }

  localStorage.setItem("searchHistory", JSON.stringify(searchHistory));
}

// =========================
// CLEAR HISTORY
// =========================
window.clearHistory = function(){
  searchHistory = [];
  localStorage.removeItem("searchHistory");
  renderIdleSearch();
};

// =========================
// SET SEARCH
// =========================
window.setSearch = function(val){
  searchInput.value = val;
  searchInput.dispatchEvent(new Event("input"));
};

// =========================
// HIGHLIGHT
// =========================
function highlight(text, q){
  if(!q) return text;
  return (text || "").replace(
    new RegExp(q, "gi"),
    match => `<span style="background:#ffe0b2;color:#ff6f00;padding:2px 4px;border-radius:4px;">${match}</span>`
  );
}

// =========================
// IDLE VIEW
// =========================
function renderIdleSearch(){

  let html = "";

  // HISTORY
  if(searchHistory.length > 0){
    html += `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;">
      <div style="font-size:12px;color:#888;">Riwayat Pencarian</div>
      <div onclick="clearHistory()" style="font-size:11px;color:#ff6f00;cursor:pointer;">Hapus</div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px;padding:0 10px 10px 10px;">
    `;

    searchHistory.forEach(item => {
      html += `
      <div onclick="setSearch('${item}')"
      style="padding:6px 10px;background:#f2f2f2;border-radius:20px;font-size:12px;cursor:pointer;">
      ⏱ ${item}
      </div>
      `;
    });

    html += `</div>`;
  }

  // TRENDING
  html += `
  <div style="padding:10px;border-top:1px solid #eee;background: #cbcbcb;">
    <div style="font-size:12px;color:#000000;margin-bottom:8px;">Trending Pencarian</div>

    <div style="display:flex;flex-wrap:wrap;gap:8px;">
  `;

  trendingSearch.forEach(item => {
    html += `
    <div onclick="setSearch('${item}')"
    style="padding:6px 10px;background:#fff3e0;border-radius:20px;font-size:12px;cursor:pointer;color:#ff6f00;">
    🔥 ${item}
    </div>
    `;
  });

  html += `</div></div>`;

  searchResult.innerHTML = html;
}

// default
renderIdleSearch();

// MAIN SEARCH
// =========================
searchInput.addEventListener("input", (e) => {

  const q = e.target.value.toLowerCase().trim();

  if (!q) {
    renderIdleSearch();
    openSearch();
    return;
  }

  saveSearchHistory(q);

  let hasilProduk = (allProduk || []).filter(p =>

  );

  let hasilStore = (allStore || []).filter(s =>

  );

  let html = `
  <div style="padding:8px 10px;font-size:12px;color:#888;">
    Hasil Pencarian

  `;

  // PRODUK
  hasilProduk.slice(0,8).forEach(p => {
    html += `
    <div onclick="location.href='detailproduk.html?id=${p.id}'"
    style="padding:10px;border-bottom:1px solid #eee;cursor:pointer;">

  });

  // STORE
  hasilStore.slice(0,6).forEach(s => {
    html += `
    <div onclick="location.href='detailstore.html?id=${s.id}'"

        <div style="font-weight:bold;font-size:14px;">
          ${highlight(s.nama, q)}
        </div>
        <div style="font-size:12px;color:#777;">Store</div>
      </div>

    </div>
    `;
  });

  searchResult.innerHTML = html;
  openSearch();

});

function formatTerjual(num){
  num = Number(num || 0);

  if(num >= 1000000){
    return (num/1000000).toFixed(1) + "jt Terjual";
  }

  if(num >= 1000){
    return (num/1000).toFixed(1) + "rb Terjual";
  }

  return num + " Terjual";
}
