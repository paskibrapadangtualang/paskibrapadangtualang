<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ulasan Saya</title>

<style>
body{
  font-family:Arial;
  background:#f5f5f5;
  padding:0px;
}

.box{
  background:white;
  padding:20px;
  border-radius:15px;
}

textarea{
  width:95%;
  height:100px;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
}

.star{
  font-size:30px;
  color:#ccc;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="box">


<div id="productBox" style="display:flex;gap:12px;align-items:center;margin-bottom:15px;padding:12px;background:#fafafa;border-radius:12px;border:1px solid #eee;">
  <img id="productImg" style="width:60px;height:60px;object-fit:cover;border-radius:10px;">
  <div>
    <div id="productName" style="font-weight:bold;font-size:14px;"></div>
    <div id="productPrice" style="color:#ff9800;font-size:13px;"></div>
  </div>
</div>




<h3>Beri Ulasan</h3>

<div id="stars" style="font-size:28px;cursor:pointer;display:flex;gap:5px;">
  <span data-i="1">☆</span>
  <span data-i="2">☆</span>
  <span data-i="3">☆</span>
  <span data-i="4">☆</span>
  <span data-i="5">☆</span>
</div>

<textarea id="komentar" placeholder="Tulis komentar..."></textarea>

<button onclick="kirim()"
style="
margin-top:10px;
width:100%;
padding:12px;
border:none;
background:#ff9800;
color:white;
border-radius:10px;
">
Kirim
</button>

</div>







<!-- =========================
RIWAYAT ULASAN
========================= -->

<div style="
margin-top:18px;
background:white;
padding:18px;
border-radius:15px;
">

<div style="
font-size:16px;
font-weight:bold;
margin-bottom:15px;
">
Riwayat Ulasan Saya
</div>

<div id="reviewList">

<div style="
padding:30px;
text-align:center;
color:#999;
font-size:13px;
">
Memuat ulasan...
</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
get,
set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyD3DTcca7yZKVtllCk3TQOUe6Yv2hSyG_g",
authDomain: "shoponline-93646.firebaseapp.com",
databaseURL: "https://shoponline-93646-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "shoponline-93646"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const orderId =
localStorage.getItem("reviewOrderId");

const uid =
localStorage.getItem("userId");

let rating = 0;

/* =========================
DOM READY
========================= */

document.addEventListener(
"DOMContentLoaded",
async ()=>{

/* =========================
STAR SYSTEM
========================= */

const stars =
document.querySelectorAll("#stars span");

stars.forEach((star)=>{

star.addEventListener("click",()=>{

rating =
Number(star.dataset.i);

updateStars();

});

});

function updateStars(){

stars.forEach((s)=>{

const i =
Number(s.dataset.i);

if(i <= rating){

s.innerHTML = "★";
s.style.color = "#ff9800";

}else{

s.innerHTML = "☆";
s.style.color = "#ccc";

}

});

}

/* =========================
LOAD PRODUCT
========================= */

const snap =
await get(
ref(db,"pesanan/"+orderId)
);

if(snap.exists()){

const order = snap.val();

const items =
order.items || {};

const productId =
Object.keys(items)[0];

const product =
items[productId];

if(product){

document.getElementById("productImg").src =
product.gambar || "";

document.getElementById("productName").innerText =
product.nama || "Produk";

document.getElementById("productPrice").innerText =
"Rp " +
(product.harga || 0)
.toLocaleString("id-ID");

/* CLICK PRODUCT */
document.getElementById("productBox").onclick = ()=>{

location.href =
`detailproduk.html?id=${productId}`;

};

}

}

/* =========================
LOAD REVIEW HISTORY
========================= */

loadReviewHistory();

});

/* =========================
USER DATA
========================= */

async function getUserData(uid){

const snap =
await get(
ref(db,"users/"+uid)
);

if(!snap.exists()){

return {
nama:"User",
foto:"https://picsum.photos/100"
};

}

return snap.val();

}

/* =========================
KIRIM REVIEW
========================= */

window.kirim = async ()=>{

const text =
document.getElementById("komentar")
.value
.trim();

if(!rating){

alert("Pilih rating dulu");
return;

}

if(!text){

alert("Isi komentar");
return;

}

const snap =
await get(
ref(db,"pesanan/"+orderId)
);

if(!snap.exists()){

alert("Order tidak ditemukan");
return;

}

const order = snap.val();

const items =
order.items || {};

const productId =
Object.keys(items)[0];

const product =
items[productId];

if(!product){

alert("Produk tidak ditemukan");
return;

}

const userData =
await getUserData(uid);

let label = "";

if(rating <= 2){

label = "Tidak Bagus";

}else if(rating <= 4){

label = "Lumayan";

}else{

label = "Bagus";

}

await set(
ref(db, "review/"+productId+"/"+uid),
{
nama:
userData.nama || "User",

foto:
userData.foto ||
"https://picsum.photos/100",

rating:
Number(rating),

label:
label,

komentar:
text,

createdAt:
Date.now(),

uid:
uid,

productId:
productId,

productName:
product.nama || "",

productImage:
product.gambar || "",

productPrice:
product.harga || 0,

storeId:
product.storeId || ""
}
);

alert("Review berhasil dikirim");

location.reload();

};

/* =========================
LOAD HISTORY
========================= */

async function loadReviewHistory(){

const reviewBox =
document.getElementById("reviewList");

const snap =
await get(ref(db,"review"));

if(!snap.exists()){

reviewBox.innerHTML = `
<div style="
padding:30px;
text-align:center;
color:#999;
font-size:13px;
">
Belum ada ulasan
</div>
`;

return;

}

let arr = [];

snap.forEach((produk)=>{

produk.forEach((user)=>{

const d = user.val();

if(d.uid === uid){

arr.push(d);

}

});

});

/* TERBARU PALING ATAS */
arr.sort((a,b)=>
(b.createdAt || 0)
-
(a.createdAt || 0)
);

if(arr.length <= 0){

reviewBox.innerHTML = `
<div style="
padding:30px;
text-align:center;
color:#999;
font-size:13px;
">
Belum ada ulasan
</div>
`;

return;

}

let html = "";

for(const r of arr){




let store = {};
let realStoreId = "";

/* =========================
AMBIL DATA PRODUK ASLI
========================= */

const productSnap = await get(
  ref(db, "produk/" + r.productId)
);

if(productSnap.exists()){

  const realProduct = productSnap.val();

  /* STORE ID ASLI DARI PRODUK */
  realStoreId =
    realProduct.storeId ||
    realProduct.store ||
    "";

}

/* =========================
AMBIL STORE ASLI
========================= */

if(realStoreId){

  const storesSnap = await get(
    ref(db, "stores")
  );

  if(storesSnap.exists()){

    storesSnap.forEach((x)=>{

      const s = x.val();

      /* cocok berdasarkan UID atau KEY */
      if(
        x.key === realStoreId
        ||
        s.uid === realStoreId
      ){

        store = s;

      }

    });

  }

}






const date =
new Date(r.createdAt || Date.now());

const waktu =
date.toLocaleString("id-ID") + " WIB";

html += `

<div style="
border:1px solid #eee;
border-radius:14px;
padding:14px;
margin-bottom:14px;
background:#fff;
">

<!-- STORE -->

<div onclick="
location.href='detailstore.html?id=${realStoreId}'
"

style="
display:flex;
align-items:center;
gap:10px;
margin-bottom:12px;
cursor:pointer;
">

<img src="${
store.logo ||
'https://picsum.photos/100'
}"

style="
width:38px;
height:38px;
border-radius:50%;
object-fit:cover;
">

<div>

<div style="
font-size:14px;
font-weight:bold;
">
${store.nama || 'Store'}
</div>

<div style="
font-size:11px;
color:#999;
">
${waktu}
</div>

</div>

</div>

<!-- PRODUCT -->

<div onclick="
location.href='detailproduk.html?id=${r.productId}'
"

style="
display:flex;
gap:12px;
padding:10px;
background:#fafafa;
border-radius:12px;
cursor:pointer;
">

<img src="${
r.productImage || ''
}"

style="
width:65px;
height:65px;
border-radius:10px;
object-fit:cover;
">

<div style="flex:1;">

<div style="
font-size:14px;
font-weight:bold;
line-height:1.4;
margin-bottom:5px;
">
${r.productName || 'Produk'}
</div>

<div style="
font-size:13px;
color:#ff6f00;
font-weight:bold;
">
Rp ${Number(r.productPrice || 0)
.toLocaleString("id-ID")}
</div>

</div>

</div>

<!-- STAR -->

<div style="
margin-top:12px;
font-size:18px;
color:#ff9800;
">

${"★".repeat(r.rating || 0)}
${"☆".repeat(5-(r.rating || 0))}

<span style="
font-size:12px;
margin-left:6px;
color:#666;
">
${r.label || ''}
</span>

</div>

<!-- KOMENTAR -->

<div style="
margin-top:10px;
font-size:14px;
line-height:1.6;
color:#444;
">
${r.komentar || ''}
</div>

</div>

`;

}

reviewBox.innerHTML = html;

}

</script>

</body>
</html>
