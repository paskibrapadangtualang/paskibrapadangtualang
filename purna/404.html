<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>404 | Halaman Tidak Ditemukan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:#0f172a;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:white;
      position:relative;
    }

    /* Background Blur */
    .blur1,
    .blur2{
      position:absolute;
      border-radius:50%;
      filter:blur(120px);
      opacity:.25;
    }

    .blur1{
      width:300px;
      height:300px;
      background:#dc2626;
      top:-100px;
      left:-100px;
    }

    .blur2{
      width:350px;
      height:350px;
      background:#2563eb;
      bottom:-120px;
      right:-120px;
    }

    .card{
      width:90%;
      max-width:520px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);
      border-radius:28px;
      padding:50px 35px;
      text-align:center;
      position:relative;
      z-index:2;
      box-shadow:
      0 10px 40px rgba(0,0,0,.35);
    }

    .error-code{
      font-size:110px;
      font-weight:700;
      line-height:1;
      background:linear-gradient(
      135deg,
      #ffffff,
      #94a3b8
      );
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:15px;
    }

    .title{
      font-size:28px;
      font-weight:600;
      margin-bottom:12px;
    }

    .desc{
      font-size:15px;
      color:#cbd5e1;
      line-height:1.7;
      margin-bottom:35px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:14px 28px;
      border-radius:14px;
      text-decoration:none;
      color:white;
      background:linear-gradient(
      135deg,
      #dc2626,
      #b91c1c
      );
      font-weight:500;
      transition:.3s;
      box-shadow:
      0 10px 20px rgba(220,38,38,.25);
    }

    .btn:hover{
      transform:translateY(-3px);
      box-shadow:
      0 14px 30px rgba(220,38,38,.35);
    }

    .footer{
      margin-top:28px;
      font-size:13px;
      color:#94a3b8;
    }

    @media(max-width:600px){

      .card{
        padding:40px 25px;
      }

      .error-code{
        font-size:85px;
      }

      .title{
        font-size:22px;
      }

      .desc{
        font-size:14px;
      }

    }

  </style>
</head>
<body>

  <div class="blur1"></div>
  <div class="blur2"></div>

  <div class="card">

    <div class="error-code">
      404
    </div>

    <div class="title">
      Halaman Tidak Ditemukan
    </div>

    <div class="desc">
      Maaf, halaman yang kamu cari mungkin sudah dipindahkan,
      dihapus, atau URL yang dimasukkan tidak tersedia.
    </div>

    <a href="https://paskibrapadangtualang.net/" class="btn">
      Kembali ke Beranda
    </a>

    <div class="footer">
      © 2026 Paskibra Padang Tualang
    </div>

  </div>

</body>
</html>
