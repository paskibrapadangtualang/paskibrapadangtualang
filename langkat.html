<style>
body{
  margin:0;

  background:#e9e9e9;

/* HEADER */
.header{
  background:linear-gradient(to right,#1b8f2e,#0f6b20);
  color:white;

  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:999;

  display:flex;
  justify-content:center;  /* ini yang bikin ke tengah */
  align-items:center;

  padding:12px 15px;
  font-weight:bold;
  letter-spacing:1px;
}

/* CONTAINER */
#container{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
  padding-bottom:30px;
}

/* ROW 3 KOLOM UNTUK DESKTOP */
.row{
  display:grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap:20px;
  width:100%;
  max-width:1100px;
  padding:0 10px;
}

/* CARD WRAPPER */
.wrapper{
  display:flex;
  justify-content:center;
}

/* RESPONSIVE HP */
@media(max-width:768px){
  .row{
    grid-template-columns:1fr;
  }
}
/* CARD */
.card{
  background:white;
  width:320px;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,0.2);
  border:1px solid #ccc;
  text-align:center;
  overflow:hidden;
}

/* TOP BAR */
.card-top{
  height:18px;
  background:linear-gradient(to right,#1b8f2e,#0f6b20);
}

/* IMAGE */
.card img{
  width:100%;
  height:360px;
  object-fit:cover;
}

/* TEXT */
.name{
  font-weight:bold;
  font-size:16px;
  margin-top:10px;
  color:#111;
}

.jabatan{
  font-style:italic;
  font-size:14px;
  margin-bottom:15px;
  color:#222;
}

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getDatabase,
ref,
get,
set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBextWTeGMT1x1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);




/* =========================
MAINTENANCE AUTO DUMMY
========================= */

async function seedMaintenance(){

const maintenanceRef =
ref(
db,
"maintenance"
);

const snap =
await get(
maintenanceRef
);

// BUAT OTOMATIS

if(
!snap.exists()
){

await set(
maintenanceRef,
{

aktif:false,

judul:
"Website Sedang Maintenance",

pesan:
"Paskibra Kecamatan Padang Tualang sedang melakukan pembaruan sistem",

gambar:
"assets/images/maintenance.png",

updatedAt:
Date.now()

}
);

console.log(
"Maintenance dummy dibuat"
);

}

}

/* =========================
CEK MAINTENANCE
========================= */

async function cekMaintenance(){

try{

await seedMaintenance();

const snap =
await get(
ref(
db,
"maintenance"
)
);

if(
!snap.exists()
)
return;

const data =
snap.val();

// kalau OFF

if(
data.aktif !== true
)
return;

// halaman sekarang

const page =
window.location.pathname
.toLowerCase();

// jangan redirect
// kalau sudah maintenance

if(
page.includes(
"maintenance.html"
)
){
return;
}

// redirect

window.location.href =
"https://paskibrapadangtualang.net/maintenance.html";

}catch(err){

console.log(
"Maintenance Error:",
err
);

}

}

cekMaintenance();










/* =========================
FOOTER FIREBASE
========================= */

async function loadFooter(){

try{

const snap =
await get(
ref(db,"kontak")
);

if(!snap.exists()){

console.log(
"Kontak belum ada"
);

return;

}

const data =
snap.val();

// alamat
document.getElementById(
"footerAlamat"
).innerText =
data.alamat || "-";

// email
document.getElementById(
"footerEmail"
).innerText =
data.email || "-";

// telepon
document.getElementById(
"footerTel"
).innerText =
data.telepon || "-";

// deskripsi
document.getElementById(
"footerDesc"
).innerText =
data.deskripsi ||
"Portal resmi Paskibra Padang Tualang";

// sosial media
document.getElementById(
"fbLink"
).href =
data.facebook || "#";

document.getElementById(
"igLink"
).href =
data.instagram || "#";

document.getElementById(
"waLink"
).href =
data.whatsapp || "#";

document.getElementById(
"ytLink"
).href =
data.youtube || "#";

}catch(err){

console.log(
"Footer Error:",
err
);

}

}

loadFooter();























const container = document.getElementById("container");

/* =========================
   DUMMY DATA
   ========================= */
async function seedData(){

  const snap = await get(ref(db, "profillangkat"));

  if(!snap.exists()){
    await set(ref(db, "profillangkat"), {
      bupati_001: {
        nama: "H. SYAH AFANDIN, SH.",
        jabatan: "Bupati Langkat",
        gambar: "https://upload.wikimedia.org/wikipedia/commons/placeholder.jpg"
      },
      wakil_001: {
        nama: "H. AMIR HAMZAH",
        jabatan: "Wakil Bupati Langkat",
        gambar: "https://upload.wikimedia.org/wikipedia/commons/placeholder.jpg"
      },
      camat_001: {
        nama: "SAMPLE CAMAT",
        jabatan: "Camat Kecamatan",
        gambar: "https://upload.wikimedia.org/wikipedia/commons/placeholder.jpg"
      }
    });

    console.log("🔥 Dummy dibuat");
  }
}

/* =========================
   LOAD + RENDER
   ========================= */
async function load(){

  await seedData();

  const snap = await get(ref(db, "profillangkat"));

  if(!snap.exists()){
    container.innerHTML = "Data tidak ditemukan";
    return;
  }

  const data = snap.val();

  // ambil masing-masing secara manual biar urut
  const bupati = data.bupati_001;
  const camat = data.camat_001;
  const wakil = data.wakil_001;

  container.innerHTML = `
    <div class="row">

      <!-- KIRI -->
      <div class="wrapper">
        <div class="card">
          <div class="card-top"></div>
          <img src="${bupati.gambar}">
          <div class="name">${bupati.nama}</div>
          <div class="jabatan">${bupati.jabatan}</div>
        </div>
      </div>

      <!-- TENGAH -->
      <div class="wrapper">
        <div class="card">
          <div class="card-top"></div>
          <img src="${camat.gambar}">
          <div class="name">${camat.nama}</div>
          <div class="jabatan">${camat.jabatan}</div>
        </div>
      </div>

      <!-- KANAN -->
      <div class="wrapper">
        <div class="card">
          <div class="card-top"></div>
          <img src="${wakil.gambar}">
          <div class="name">${wakil.nama}</div>
          <div class="jabatan">${wakil.jabatan}</div>
        </div>
      </div>

    </div>
  `;
}

load();

</script>
