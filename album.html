<div class="modal" id="modal">
  <span class="close" onclick="closeModal()">✖</span>
  <img id="modalImg">
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const album = document.getElementById("album");










/* =========================
MAINTENANCE GLOBAL
========================= */

async function cekMaintenance(){

try{

const snap =
await get(
ref(
db,
"maintenance"
)
);

if(
!snap.exists()
)
return;

const data =
snap.val();

// maintenance OFF

if(
data.aktif !== true
)
return;

// halaman sekarang

const page =
window.location.pathname
.toLowerCase();

// sudah di halaman maintenance

if(
page.includes(
"maintenance.html"
)
){
return;
}

// bypass admin

if(

page.includes(
"admin"
)

||

page.includes(
"bendahara"
)

){
return;
}

// redirect

window.location.href =
"https://paskibrapadangtualang.net/maintenance.html";

}catch(err){

console.log(
"Maintenance Error:",
err
);

}

}

cekMaintenance();




























/* =========================
   LOAD SEMUA GAMBAR
========================= */

const loader = document.getElementById("loader");

onValue(ref(db,"postingan"), (snapshot)=>{

  album.innerHTML = "";

  let semuaGambar = [];

  snapshot.forEach((child)=>{

    const data = child.val();

    if(data.gambar) semuaGambar.push(data.gambar);
    if(data.gambarList) Object.values(data.gambarList).forEach(img=>semuaGambar.push(img));
    if(data.fotos) data.fotos.forEach(img=>semuaGambar.push(img));

  });

  semuaGambar.reverse().forEach((img)=>{
    album.innerHTML += `
      <div class="card">
        <img src="${img}" onclick="openModal('${img}')">
      </div>
    `;
  });

  // 🔥 INI PENTING: HILANGKAN LOADER
  loader.style.display = "none";

});

/* =========================
   MODAL ZOOM
========================= */

window.openModal = function(img){

  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = img;

}

window.closeModal = function(){

  document.getElementById("modal").style.display = "none";

}




document.addEventListener('contextmenu', function(e){
  e.preventDefault(); // disable klik kanan / copy
});

document.addEventListener('selectstart', function(e){
  e.preventDefault(); // disable blok teks
});

document.addEventListener('dragstart', function(e){
  e.preventDefault(); // disable drag gambar
});


</script>
