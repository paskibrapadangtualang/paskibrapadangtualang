<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>View Purna</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

body{
  background:#f5f5f5;
  touch-action:manipulation;
}




img{
  -webkit-user-drag:none;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

@keyframes zoomIn{
  from{
    transform:scale(0.7);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }
}

</style>
</head>

<body>

<div id="profileContainer">

  <div style="
    display:flex;
    justify-content:center;
    align-items:center;
    height:80vh;
    flex-direction:column;
  ">

    <div style="
      width:55px;
      height:55px;
      border:5px solid #eee;
      border-top:5px solid #c40000;
      border-radius:50%;
      animation:spin 1s linear infinite;
    "></div>

    <p style="
      margin-top:15px;
      color:#666;
      font-size:14px;
      font-weight:bold;
    ">
      Memuat profile...
    </p>

  </div>

</div>

<!-- MODAL FOTO -->

<div
id="zoomModal"
style="
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:99999;
  padding:20px;
"
onclick="closeZoom()">

<img
id="zoomImage"
style="
  max-width:100%;
  max-height:100%;
  border-radius:20px;
  object-fit:contain;
  animation:zoomIn 0.3s ease;
">

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ================= FIREBASE =================

const firebaseConfig = {

  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

// ================= AMBIL UID =================

const urlParams =
  new URLSearchParams(
    window.location.search
  );

const userId =
  urlParams.get("id");

// ================= CONTAINER =================

const profileContainer =
  document.getElementById(
    "profileContainer"
  );

// ================= SENSOR EMAIL =================

function sensorEmail(email){

  if(!email || !email.includes("@")){
    return "-";
  }

  const parts = email.split("@");

  const nama = parts[0];
  const domain = parts[1];

  if(nama.length <= 3){
    return nama[0] + "***@" + domain;
  }

  const depan = nama.substring(0,2);

  const belakang =
    nama.substring(
      nama.length - 1
    );

  const sensor =
    "*".repeat(
      nama.length - 3
    );

  return `${depan}${sensor}${belakang}@${domain}`;

}

// ================= LOAD PROFILE =================


 async function loadProfile(){

  try{

    const snapshot = await get(
      ref(db, "purna/" + userId)
    );

    if(snapshot.exists()){

      const data = snapshot.val();

      // ======================
      // FIX DATA UNDEFINED
      // ======================

      const foto =
        data.foto ||
        "assets/images/user.png";

      const nama =
        data.namaPurna ||
        data.nama ||
        "Nama belum diisi";

      const jabatan =
        data.jabatan ||
        "Anggota Purna";

      const sekolah =
        data.asalSekolah ||
        "-";

      const jk =
        data.jenisKelamin ||
        "-";

      const email =
        sensorEmail(
          data.email || ""
        );

      const tujuan =
        data.tujuan &&
        data.tujuan.trim() !== ""
        ? data.tujuan
        : "Belum mengisi tujuan";

      const visi =
        data.visi &&
        data.visi.trim() !== ""
        ? data.visi
        : "Belum mengisi visi";

      const misi =
        data.misi &&
        data.misi.trim() !== ""
        ? data.misi
        : "Belum mengisi misi";

      profileContainer.innerHTML = `

<div style="
  padding:20px;
">

  <div style="
    background:white;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
  ">

    <!-- HEADER -->

  <div style="
  background: url('assets/images/lemparpeci.jpg') no-repeat center center;
  background-size: cover;
  height:160px;
  position:relative;
  color:white;
">

      <!-- FOTO -->

      <div style="
        position:absolute;
        left:50%;
        bottom:-60px;
        transform:translateX(-50%);
      ">

        <img
        src="${foto}"

        onclick="zoomFoto('${foto}')"

        style="
          width:130px;
          height:130px;
          border-radius:50%;
          object-fit:cover;
          border:5px solid white;
          box-shadow:0 5px 15px rgba(0,0,0,0.2);
          background:white;
          cursor:pointer;
        ">

      </div>

    </div>

    <!-- CONTENT -->

    <div style="
      padding:80px 22px 25px;
    ">

      <!-- NAMA -->

      <h2 style="
        text-align:center;
        font-size:25px;
        color:#222;
        margin-bottom:10px;
      ">

        ${nama}

      </h2>

      <!-- JABATAN -->

      <div style="
        text-align:center;
        margin-bottom:25px;
      ">

        <span style="
          background:#ffe5e5;
          color:#c40000;
          padding:8px 16px;
          border-radius:30px;
          font-size:13px;
          font-weight:bold;
        ">

          ${jabatan}

        </span>

      </div>

      <!-- DATA -->

      <div style="
        display:flex;
        flex-direction:column;
        gap:15px;
      ">

        <!-- SEKOLAH -->

        <div style="
          background:#f8f8f8;
          padding:15px;
          border-radius:18px;
        ">

          <div style="
            font-size:12px;
            color:#888;
            margin-bottom:5px;
          ">
            Asal Sekolah
          </div>

          <div style="
            font-size:16px;
            font-weight:bold;
            color:#222;
          ">
            ${sekolah}
          </div>

        </div>

        <!-- JK -->

        <div style="
          background:#f8f8f8;
          padding:15px;
          border-radius:18px;
        ">

          <div style="
            font-size:12px;
            color:#888;
            margin-bottom:5px;
          ">
            Jenis Kelamin
          </div>

          <div style="
            font-size:16px;
            font-weight:bold;
            color:#222;
          ">
            ${jk}
          </div>

        </div>

        <!-- EMAIL -->

        <div style="
          background:#f8f8f8;
          padding:15px;
          border-radius:18px;
        ">

          <div style="
            font-size:12px;
            color:#888;
            margin-bottom:5px;
          ">
            Email
          </div>

          <div style="
            font-size:16px;
            font-weight:bold;
            color:#222;
            word-break:break-word;
          ">
            ${email}
          </div>

        </div>

        <!-- TUJUAN -->

        <div style="
          background:#f8f8f8;
          padding:15px;
          border-radius:18px;
        ">

          <div style="
            font-size:12px;
            color:#888;
            margin-bottom:5px;
          ">
            Tujuan
          </div>

          <div style="
            font-size:15px;
            color:#222;
            line-height:1.6;
          ">
            ${tujuan}
          </div>

        </div>

        <!-- VISI MISI -->

        <div style="
          display:flex;
          gap:12px;
        ">

          <!-- VISI -->

          <div style="
            flex:1;
            background:#f8f8f8;
            padding:15px;
            border-radius:18px;
          ">

            <div style="
              color:#c40000;
              font-weight:bold;
              margin-bottom:8px;
              text-align:center;
            ">
              VISI
            </div>

            <div style="
              font-size:14px;
              line-height:1.6;
              color:#444;
              text-align:center;
            ">
              ${visi}
            </div>

          </div>

          <!-- MISI -->

          <div style="
            flex:1;
            background:#f8f8f8;
            padding:15px;
            border-radius:18px;
          ">

            <div style="
              color:#c40000;
              font-weight:bold;
              margin-bottom:8px;
              text-align:center;
            ">
              MISI
            </div>

            <div style="
              font-size:14px;
              line-height:1.6;
              color:#444;
              text-align:center;
            ">
              ${misi}
            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>

`;

    }else{

      profileContainer.innerHTML = `

      <div style="
        text-align:center;
        padding:60px 20px;
        color:#666;
      ">

        Data purna tidak ditemukan

      </div>

      `;

    }

  }catch(error){

    console.log(error);

    profileContainer.innerHTML = `

    <div style="
      text-align:center;
      padding:60px 20px;
      color:red;
    ">

      Gagal memuat profile

    </div>

    `;

  }

}

// ================= ZOOM FOTO =================

window.zoomFoto = function(src){

  document.getElementById(
    "zoomModal"
  ).style.display = "flex";

  document.getElementById(
    "zoomImage"
  ).src = src;

}

window.closeZoom = function(){

  document.getElementById(
    "zoomModal"
  ).style.display = "none";

}

// ================= LOAD =================

loadProfile();

// ================= DISABLE COPY =================

document.addEventListener(
  "contextmenu",
  (e)=>{
    e.preventDefault();
  }
);

document.addEventListener(
  "selectstart",
  (e)=>{
    e.preventDefault();
  }
);

document.addEventListener(
  "dragstart",
  (e)=>{
    e.preventDefault();
  }
);

</script>

</body>
</html>
