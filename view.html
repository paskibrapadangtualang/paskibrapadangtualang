// ================= SENSOR EMAIL =================

function sensorEmail(email){

  if(!email || !email.includes("@")){
    return "-";
  }

  const parts = email.split("@");

  const nama = parts[0];
  const domain = parts[1];

  if(nama.length <= 3){
    return nama[0] + "***@" + domain;
  }

  const depan = nama.substring(0,2);

  const belakang =
    nama.substring(
      nama.length - 1
    );

  const sensor =
    "*".repeat(
      nama.length - 3
    );

  return `${depan}${sensor}${belakang}@${domain}`;

}

</div>

`;
