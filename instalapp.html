<style>



body{
 font-family:Arial,sans-serif;
}
 



.install-popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99999;
  padding:20px;
  backdrop-filter:blur(8px);
}

.install-card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:28px;
  overflow:hidden;
  animation:popupShow .35s ease;
  box-shadow:0 15px 45px rgba(0,0,0,0.25);
}

@keyframes popupShow{
  from{
    opacity:0;
    transform:translateY(40px) scale(.95);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.install-top{
  display:flex;
  gap:15px;
  padding:22px;
  align-items:center;
}

.app-icon{
  width:90px;
  height:90px;
  border-radius:22px;
  object-fit:cover;
  box-shadow:0 8px 20px rgba(0,0,0,0.18);
}

.app-info h2{
  font-size:24px;
  margin-bottom:6px;
  color:#111;
}

.app-info p{
  font-size:14px;
  color:#666;
  margin-bottom:10px;
}

.app-rating{
  font-size:13px;
  color:#0f9d58;
  font-weight:bold;
}

.app-preview{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:0 20px 20px;
}

.app-preview img{
  width:170px;
  height:300px;
  object-fit:cover;
  border-radius:20px;
  flex-shrink:0;
  box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.app-detail{
  display:flex;
  justify-content:space-around;
  padding:18px 10px;
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
}

.detail-box{
  text-align:center;
}

.detail-box h3{
  font-size:20px;
  color:#111;
}

.detail-box span{
  font-size:13px;
  color:#777;
}

.app-description{
  padding:20px;
  font-size:14px;
  line-height:1.8;
  color:#444;
}

.install-btn{
  width:calc(100% - 40px);
  margin:0 20px 22px;
  height:54px;
  border:none;
  border-radius:18px;
  background:#0f9d58;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition:.25s;
}

.install-btn:active{
  transform:scale(.97);
}

.download-box{
  display:none;
  padding:0 20px 25px;
}

.download-text{
  margin-bottom:10px;
  font-size:14px;
  color:#444;
}

.progress-bar{
  width:100%;
  height:10px;
  background:#eee;
  border-radius:20px;

}

.progress-fill{
  width:0%;
  height:100%;
  background:#0f9d58;
  border-radius:20px;
  transition:.2s;
}

</style>


<script>

let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {

  e.preventDefault();

  deferredPrompt = e;

  document.getElementById('installPopup').style.display = 'flex';

});


const installBtn =
  document.getElementById('installBtn');

const downloadBox =
  document.getElementById('downloadBox');

const progressFill =
  document.getElementById('progressFill');


installBtn.onclick = async () => {

  installBtn.style.display = 'none';

  downloadBox.style.display = 'block';

  let progress = 0;

  const anim = setInterval(() => {

    progress += 5;

    progressFill.style.width = progress + '%';

    if(progress >= 100){

      clearInterval(anim);

      setTimeout(async () => {

        if(deferredPrompt){

          deferredPrompt.prompt();

          await deferredPrompt.userChoice;

          deferredPrompt = null;

        }

        document.getElementById('installPopup').style.display = 'none';

      }, 400);

    }

  }, 80);

}

</script>
