  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getDatabase,
      ref,
      set
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // CONFIG FIREBASE
 const firebaseConfig = {

  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b",
  measurementId: "G-1KGNVS3MRX"

};

    // INIT FIREBASE
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);


// CEK LOGIN

onAuthStateChanged(auth, (user)=>{

  const loadingScreen =
    document.getElementById(
      "loadingScreen"
    );

  // CEK HALAMAN REGISTER SEDANG TERBUKA

  const registerBox =
    document.getElementById(
      "registerBox"
    );

  const sedangRegister =
    !registerBox.classList.contains(
      "hidden"
    );

  if(user && !sedangRegister){

    window.location.href =
      "user.html";

  }else{

    loadingScreen.style.display =
      "none";

  }

});


    // TAMPIL REGISTER
    window.showRegister = function(){
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("registerBox").classList.remove("hidden");
    }

    // TAMPIL LOGIN
    window.showLogin = function(){
      document.getElementById("registerBox").classList.add("hidden");
      document.getElementById("loginBox").classList.remove("hidden");
    }

    // HITUNG UMUR
    window.hitungUmur = function(){

      const tanggalLahir = document.getElementById("tanggalLahir").value;

      if(!tanggalLahir) return;

      const today = new Date();
      const birthDate = new Date(tanggalLahir);

      let umur = today.getFullYear() - birthDate.getFullYear();

      const month = today.getMonth() - birthDate.getMonth();

      if(month < 0 || (month === 0 && today.getDate() < birthDate.getDate())){
        umur--;
      }

      document.getElementById("umur").value = umur + " Tahun";
    }





    // RESET PASSWORD

window.resetPassword = async function(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value;

  if(email === ""){

    showAlert(
      "Masukkan email terlebih dahulu"
    );

    return;

  }

  try{

    // LOADING

    showLoading(
      "Mengirim reset password..."
    );

    await sendPasswordResetEmail(
      auth,
      email
    );

    hideLoading();

    showAlert(
      "Link reset password berhasil dikirim"
    );

  }catch(error){

    hideLoading();

    let pesan =
      "Terjadi kesalahan";

    if(
      error.code ===
      "auth/user-not-found"
    ){

      pesan =
        "Email tidak ditemukan";

    }else if(
      error.code ===
      "auth/invalid-email"
    ){

      pesan =
        "Format email tidak valid";

    }

    showAlert(pesan);

  }

}

    // LOGIN
 // =====================
// CLOUDINARY
// =====================

const CLOUD_NAME = "djxlbemky";
const UPLOAD_PRESET = "uploadgambar";

// =====================
// LOGIN
// =====================

window.login = async function(){

  const email =
    document.getElementById("loginEmail").value;

  const password =
    document.getElementById("loginPassword").value;

  try{

  // TAMPILKAN LOADING

  showLoading(
    "Mencocokkan data akun..."
  );

  await signInWithEmailAndPassword(
    auth,
    email,
    password
  );

  // HIDE LOADING

  hideLoading();

  // NOTIF

  showAlert("Login berhasil");

  // PINDAH HALAMAN

  setTimeout(()=>{

    window.location.href =
      "user.html";

  }, 1500);

}catch(error){

  hideLoading();

  let pesan = "Terjadi kesalahan";

// EMAIL / PASSWORD SALAH

if(
  error.code === "auth/invalid-credential"
){

  pesan =
    "Email atau password salah";

// EMAIL TIDAK VALID

}else if(
  error.code === "auth/invalid-email"
){

  pesan =
    "Format email tidak valid";

// USER TIDAK ADA

}else if(
  error.code === "auth/user-not-found"
){

  pesan =
    "Akun tidak ditemukan";

// PASSWORD LEMAH

}else if(
  error.code === "auth/weak-password"
){

  pesan =
    "Password terlalu lemah";

// EMAIL SUDAH DIGUNAKAN

}else if(
  error.code === "auth/email-already-in-use"
){

  pesan =
    "Email sudah digunakan";

}else{

  pesan = error.message;

}

showAlert(pesan);

}

}


// CUSTOM ALERT

function showAlert(message){

  const alertBox =
    document.getElementById("customAlert");

  const alertText =
    document.getElementById("alertText");

  alertText.innerText = message;

  alertBox.style.display = "block";

  setTimeout(()=>{

    alertBox.style.display = "none";

  }, 3000);

}

// SHOW LOADING

function showLoading(text = "Memproses..."){

  document.getElementById(
    "loadingBox"
  ).style.display = "flex";

  document.getElementById(
    "loadingText"
  ).innerText = text;

}

// HIDE LOADING

function hideLoading(){

  document.getElementById(
    "loadingBox"
  ).style.display = "none";

}

// =====================
// REGISTER
// =====================

// =====================
// REGISTER
// =====================

window.register = async function(){

  const nama =
    document.getElementById("registerName").value;

  const angkatanTahun =
    document.getElementById("angkatanTahun").value;

  const asalSekolah =
    document.getElementById("asalSekolah").value;

  const tanggalLahir =
    document.getElementById("tanggalLahir").value;

  const umur =
    document.getElementById("umur").value;

  const nomorHp =
    document.getElementById("nomorHp").value;

  const email =
    document.getElementById("registerEmail").value;

  const password =
    document.getElementById("registerPassword").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const tinggiBadan =
    document.getElementById("tinggiBadan").value;

  const nomorWa =
    document.getElementById("nomorWa").value;

  const namaIbu =
    document.getElementById("namaIbu").value;

  const nomorPendaftaran =
    document.getElementById("nomorPendaftaran").value;

  const alamat =
    document.getElementById("alamat").value;

  const foto =
    document.getElementById("fotoSelfie").files[0];

  // VALIDASI PASSWORD

  if(password !== confirmPassword){

    showAlert("Password tidak sama!");
    return;

  }

  // VALIDASI FOTO

  if(!foto){

    showAlert("Foto selfie wajib diupload!");
    return;

  }

  try{

    // TAMPILKAN LOADING

    showLoading("Mengupload data...");

    // =====================
    // UPLOAD FOTO CLOUDINARY
    // =====================

    const formData = new FormData();

    formData.append("file", foto);

    formData.append(
      "upload_preset",
      UPLOAD_PRESET
    );

    const cloudinaryResponse =
      await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
        {
          method: "POST",
          body: formData
        }
      );

    const cloudinaryData =
      await cloudinaryResponse.json();

    const fotoUrl =
      cloudinaryData.secure_url;

    // =====================
    // REGISTER FIREBASE AUTH
    // =====================

    const userCredential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    const user = userCredential.user;

    // =====================
    // SIMPAN DATABASE
    // =====================

    await set(
      ref(database, "users/" + user.uid),
      {

        namaLengkap: nama,

        angkatanTahun: angkatanTahun,

        asalSekolah: asalSekolah,

        tanggalLahir: tanggalLahir,

        umur: umur,

        nomorHp: nomorHp,

        email: email,

        tinggiBadan: tinggiBadan,

        fotoSelfie: fotoUrl,

        nomorWa: nomorWa,

        namaIbu: namaIbu,

        nomorPendaftaran: nomorPendaftaran,

        alamat: alamat,

        statusPenerimaan: "Menunggu Seleksi"

      }
    );

    // HIDE LOADING

    hideLoading();

    // ALERT

    showAlert("Pendaftaran berhasil!");

    // DELAY SUPAYA DATABASE BENAR2 TERSIMPAN

    setTimeout(()=>{

      window.location.href =
        "user.html";

    }, 2000);

  }catch(error){

    hideLoading();

    console.log(error);

    let pesan =
      "Terjadi kesalahan";

    if(
      error.code ===
      "auth/email-already-in-use"
    ){

      pesan =
        "Email sudah digunakan";

    }else if(
      error.code ===
      "auth/weak-password"
    ){

      pesan =
        "Password minimal 6 karakter";

    }else if(
      error.code ===
      "auth/invalid-email"
    ){

      pesan =
        "Format email tidak valid";

    }else{

      pesan = error.message;

    }

    showAlert(pesan);

  }

}
  </script>




<script>

function toggleMenu(){

  const menu =
    document.getElementById("dropdownMenu");

  if(menu.style.display === "block"){

    menu.style.display = "none";

  }else{

    menu.style.display = "block";

  }

}

// TUTUP MENU SAAT KLIK LUAR

window.onclick = function(e){

  if(
    !e.target.matches('.menu-icon')
  ){

    const menu =
      document.getElementById("dropdownMenu");

    if(menu.style.display === "block"){

      menu.style.display = "none";

    }

  }

}















document.addEventListener('contextmenu', function(e){

});

document.addEventListener('selectstart', function(e){

});

document.addEventListener('dragstart', function(e){
  e.preventDefault(); // disable drag gambar
});


</script>
