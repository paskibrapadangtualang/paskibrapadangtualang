/* ================= LOAD ================= */
async function load(){

  // tampilkan spinner dulu
  document.getElementById("loader").style.display = "flex";

  const camatSnap = await get(ref(db, "camat"));
  const ibuSnap = await get(ref(db, "ibucamat"));

  let html = "";

  // CAMAT
  if(camatSnap.exists()){
    const data = camatSnap.val();

    Object.entries(data).forEach(([id, d]) => {
      html += render(d);
    });
  }

  // IBU CAMAT
  if(ibuSnap.exists()){
    const data = ibuSnap.val();

    Object.entries(data).forEach(([id, d]) => {
      html += render(d);
    });
  }

  document.getElementById("content").innerHTML = html;

  // hide spinner setelah selesai
  document.getElementById("loader").style.display = "none";
}


function render(d){
  return `
    <div class="card">

      <div class="header">
        <img src="${d.foto}"
             onclick="openPreview(this.src)">
      </div>

      <div class="content">

        <div class="role"> ${d.jabatan}</div>
        <h3>${d.nama}</h3>

        <div class="info-box">
          <b>🎯 Tujuan</b><br>
          ${d.tujuan}
        </div>

        <div class="vm-box">

          <div class="vm-col">
            <div class="vm-title">VISI</div>
            <div class="vm-text">${d.visi}</div>
          </div>

          <div class="vm-col">
            <div class="vm-title">MISI</div>
            <div class="vm-text">${d.misi}</div>
          </div>

        </div>

      </div>

    </div>
  `;
}
load();
