<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>Data Danton</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
  background:#0f3d2e;
  color:white;

  padding:20px;
  padding-top:90px; /* untuk header fixed */

  position:relative;
  min-height:100vh;
  overflow-x:hidden;
}

/* TITLE */

/* GRID */

.grid{

    display:grid;

    grid-template-columns:
      repeat(2,1fr);

    gap:15px;

}

/* CARD */

.card{

    background:white;

    color:#111;

    border-radius:22px;

    overflow:hidden;

    box-shadow:
      0 8px 20px rgba(0,0,0,0.25);

    transition:0.3s;

}

.card:hover{

    transform:
      translateY(-6px);

}

/* IMG */

.card img{

    width:100%;
    height:180px;

    object-fit:cover;

}

/* CONTENT */

.content{
    padding:20px;
}

/* BADGE */

.badge{

    display:inline-block;

    background:#c40000;

    color:white;

    padding:
      8px 14px;

    border-radius:999px;

    font-size:12px;

    margin-bottom:15px;

}

/* TEXT */

.content h3{

    margin-bottom:12px;

    font-size:22px;

}

.content p{

    margin-bottom:10px;

    line-height:1.5;

}




/* PREVIEW FOTO */

.preview-box{

    position:fixed;

    inset:0;

    background:
      rgba(0,0,0,0.88);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:9999;

    padding:20px;

    animation:fadePreview 0.3s ease;

}

/* IMAGE */

.preview-box img{

    max-width:95%;
    max-height:92vh;

    border-radius:20px;

    box-shadow:
      0 0 40px rgba(255,255,255,0.15);

    animation:zoomIn 0.3s ease;

}

/* CLOSE */

.close-preview{

    position:absolute;

    top:20px;
    right:25px;

    font-size:40px;

    color:white;

    cursor:pointer;

}



@media(max-width:480px){

    .grid{

        grid-template-columns:
          repeat(2,1fr);

        gap:12px;

    }

 /* CONTENT */

.content{
    padding:18px;
}

/* NAMA */

.content h3{

    font-size:20px;

    font-weight:700;

    color:#111;

    margin-bottom:15px;

    line-height:1.3;

    letter-spacing:0.3px;
}


}

/* CURSOR */

.card img{

    cursor:pointer;

}

/* ANIMASI */

@keyframes fadePreview{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

@keyframes zoomIn{

    from{
        transform:scale(0.8);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}



/* MINI BOX */

.mini-box{

    background:#f4f6f9;

    border-radius:14px;

    padding:12px;

    margin-bottom:12px;

    display:flex;

    flex-direction:column;

    gap:4px;

    border:1px solid #e7ebf0;

}

/* LABEL */

.label{

    font-size:11px;

    font-weight:600;

    color:#7b8494;

    letter-spacing:1px;

}

/* VALUE */

.value{

    font-size:14px;

    font-weight:600;

    color:#111827;

    line-height:1.4;

}

/* BUTTON */

.detail-btn{

    width:100%;

    border:none;

    background:#0f3d2e;

    color:white;

    padding:13px;

    border-radius:14px;

    font-weight:600;

    margin-top:8px;

    cursor:pointer;

    transition:0.3s;

}

.detail-btn:hover{

    background:#14543f;

    transform:translateY(-2px);

}




.loader{
  position:fixed;
  inset:0;
  background:#0f3d2e;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:99999;
  color:white;
}

.spinner{
  width:55px;
  height:55px;
  border-radius:50%;
  border:5px solid rgba(255,255,255,0.2);
  border-top:5px solid #ffffff;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  0%{ transform:rotate(0deg); }
  100%{ transform:rotate(360deg); }
}

.loader p{
  margin-top:12px;
  font-size:13px;
  opacity:0.9;
}





.page-header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  width:100%;

  background:rgba(15,61,46,0.95);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  color:white;
  text-align:center;

  font-size:18px;
  font-weight:800;
  letter-spacing:1px;

  padding:16px 10px;

  box-shadow:0 5px 20px rgba(0,0,0,0.25);
  z-index:9999;
}

</style>
</head>
<body>

<div class="page-header">
    DATA DANTON
</div>

<div class="grid" id="listDanton"></div>




<!-- PREVIEW FOTO -->

<div class="preview-box" id="previewBox">

    <span
      class="close-preview"
      onclick="tutupPreview()"
    >
      ×
    </span>

    <img id="previewImage">

</div>



<div id="loader" class="loader">
  <div class="spinner"></div>
  <p>Memuat data danton...</p>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* CONFIG */

const firebaseConfig = {

  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b"

};

const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);

const listDanton =
  document.getElementById("listDanton");

/* SENSOR TANGGAL */

function sensorTanggal(tanggal){

    return tanggal
      .replace(/\d{2}$/, "**")
      .replace(/\d{4}/, "****");

}

/* REALTIME */

onValue(ref(db, "danton"), (snapshot)=>{

    // 👉 tampilkan spinner
    document.getElementById("loader").style.display = "flex";

    listDanton.innerHTML = "";

    snapshot.forEach((child)=>{

        const data = child.val();

        listDanton.innerHTML += `
<div 
  class="card"
  onclick="bukaDetail('${child.key}')"
>

    <img src="${data.gambar}">

    <div class="content">

        <div class="badge">
            ${data.jabatan}
        </div>

        <h3>
            ${data.nama}
        </h3>

        <div class="mini-box">
            <span class="label">ANAK DARI</span>
            <span class="value">${data.anak}</span>
        </div>

        <div class="mini-box">
            <span class="label">SEKOLAH</span>
            <span class="value">${data.sekolah}</span>
        </div>

        <button class="detail-btn">
            Lihat Detail
        </button>

    </div>

</div>
`;
    });

    // 👉 sembunyikan spinner setelah data tampil
    document.getElementById("loader").style.display = "none";

});

window.bukaDetail = function(id){

    window.location.href =
      "detaildanton.html?id=" + id;

}

/* PREVIEW FOTO */

window.lihatFoto = function(src){

    document.getElementById(
      "previewBox"
    ).style.display = "flex";

    document.getElementById(
      "previewImage"
    ).src = src;

}

/* TUTUP */

window.tutupPreview = function(){

    document.getElementById(
      "previewBox"
    ).style.display = "none";

}

/* TUTUP SAAT KLIK BG */

document.getElementById(
  "previewBox"
).addEventListener("click", function(e){

    if(e.target.id === "previewBox"){

        tutupPreview();

    }

});

</script>

</body>
</html>
