function loadUser(uid){

  onValue(
    ref(db,"users/"+uid),

    (snap)=>{

      const data = snap.val() || {};

      const cash =
      data.cash?.[bulan] || {};

      // NAMA USER
      document.getElementById(
        "nama"
      ).innerText =
      "Nama: " +
      (data.namaLengkap || "-");

      // FOTO USER
      document.getElementById(
        "fotoSelfiUser"
      ).src =

      data.fotoSelfie ||
      data.fotoSelfi ||
      data.foto ||
      data.profileImage ||

      "assets/images/icon.png";

      // HITUNG TOTAL BAYAR
      let bayar = 0;

      for(let i in cash){

        if(
          cash[i] &&
          cash[i].status === "paid"
        ){

          bayar +=
          cash[i].nominal ||
          2000;

        }

      }

      // TARGET CASH
      const target =
      totalHari * 2000;

      // TUNGGAKAN
      let tunggakan =
      target - bayar;

      if(
        tunggakan < 0
      ){
        tunggakan = 0;
      }

      // TOTAL BAYAR
      document.getElementById(
        "totalBayar"
      ).innerText =

      "Total Bayar: Rp " +

      bayar.toLocaleString(
        "id-ID"
      );

      // TOTAL TUNGGAKAN
      document.getElementById(
        "totalTunggakan"
      ).innerText =

      "Tunggakan: Rp " +

      tunggakan.toLocaleString(
        "id-ID"
      );

      // RENDER
      renderKalender(cash);

      renderHistory(uid);

    }

  );

}

function renderKalender(cash){

  const box = document.getElementById("kalender");

  box.innerHTML = "";

  for(let i=1;i<=totalHari;i++){

    const div = document.createElement("div");
    div.classList.add("day");

    const hariData = cash[String(i)];

    if(hariData && hariData.status === "paid"){
      div.classList.add("green");
    } else {
      div.classList.add("red");
    }

    div.innerText = i;

    div.onclick = ()=>{
      openPopup(hariData, i);
    };

    box.appendChild(div);
  }
}

// ANTI CLICK KANAN
document.addEventListener("contextmenu", e=>{
  e.preventDefault();
});

// ANTI CTRL
document.addEventListener("keydown", e=>{

  // CTRL + U
  if(e.ctrlKey && e.key.toLowerCase() === "u"){
    e.preventDefault();
  }

  // CTRL + C
  if(e.ctrlKey && e.key.toLowerCase() === "c"){
    e.preventDefault();
  }

  // CTRL + S
  if(e.ctrlKey && e.key.toLowerCase() === "s"){
    e.preventDefault();
  }

  // CTRL + SHIFT + I
  if(e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "i"){
    e.preventDefault();
  }

  // F12
  if(e.key === "F12"){
    e.preventDefault();
  }

});

</script>
