<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Kelola Link Youtube</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#eef2f5;
padding:15px;
}

.header{
background:linear-gradient(
135deg,
#0f6b20,
#178b2f
);
padding:18px;
border-radius:18px;
color:white;
margin-bottom:15px;
box-shadow:
0 5px 15px rgba(
0,0,0,.15
);
}

.header h2{
font-size:22px;
}

.card{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:
0 4px 10px rgba(
0,0,0,.08
);
}

input{
width:100%;
padding:13px;
margin-bottom:12px;
border-radius:10px;
border:1px solid #ddd;
outline:none;
}

input:focus{
border-color:#0f6b20;
}

button{
padding:11px 16px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.save{
background:#0f6b20;
color:white;
width:100%;
}

.editBtn{
background:#f4b400;
color:white;
margin-right:8px;
}

.delBtn{
background:red;
color:white;
}

.videoCard{
background:white;
padding:12px;
margin-bottom:15px;
border-radius:14px;
box-shadow:
0 4px 12px rgba(
0,0,0,.08
);
}

iframe{
width:100%;
height:220px;
border:none;
border-radius:12px;
margin-bottom:10px;
}

.title{
font-size:15px;
font-weight:bold;
margin-bottom:10px;
}

.empty{
padding:30px;
text-align:center;
color:#666;
}

#adminPanel{
display:none;
}
</style>

</head>
<body>

<div id="adminPanel">

<div class="header">
<h2>🎥 Kelola Youtube Kecamatan</h2>
<div>
Tambah • Edit • Hapus Video
</div>
</div>

<div class="card">

<input
id="judul"
placeholder="Judul video">

<input
id="url"
placeholder="Masukkan link youtube">

<button
class="save"
id="btnSave">

Tambah Video

</button>

</div>

<div id="listYoutube"></div>

</div>


<script type="module">

import {
initializeApp
}

from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {

getDatabase,
ref,
push,
set,
update,
remove,
get,
onValue

}

from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b"
};

const app=
initializeApp(
firebaseConfig
);

const db=
getDatabase(app);




/* ROLE */

const role=
localStorage.getItem(
"role"
);

if(
role!=="admincamat" &&
role!=="camat"
){

document.body.innerHTML=`

<div style="
padding:50px;
text-align:center;
font-size:20px;
">

Akses ditolak

</div>

`;

throw "blok";

}

document
.getElementById(
"adminPanel"
)
.style.display=
"block";



let editID=null;



function convertYoutube(url){

if(!url) return "";

try{

// kalau sudah embed
if(
url.includes(
"/embed/"
)
){

const id=
url
.split("/embed/")[1]
.split("?")[0];

return `https://www.youtube.com/embed/${id}`;

}


// format youtu.be
if(
url.includes(
"youtu.be/"
)
){

const id=
url
.split(
"youtu.be/"
)[1]
.split("?")[0]
.split("&")[0];

return `https://www.youtube.com/embed/${id}`;

}


// format youtube watch
if(
url.includes(
"youtube.com/watch"
)
){

const u=
new URL(url);

const id=
u.searchParams.get(
"v"
);

if(id){

return `https://www.youtube.com/embed/${id}`;

}

}


// format shorts
if(
url.includes(
"/shorts/"
)
){

const id=
url
.split(
"/shorts/"
)[1]
.split("?")[0];

return `https://www.youtube.com/embed/${id}`;

}

}catch(e){

console.log(e);

return "";

}

return "";

}



/* SIMPAN */

document
.getElementById(
"btnSave"
)

.onclick=

async()=>{

const judul=
document
.getElementById(
"judul"
).value.trim();

const url=
document
.getElementById(
"url"
).value.trim();

if(
!judul ||
!url
){

alert(
"Lengkapi data"
);

return;

}

const embed=
convertYoutube(
url
);

if(
!embed
){

alert(
"Link tidak valid"
);

return;

}


if(editID){

await update(

ref(
db,
`Yotubecamat/${editID}`
),

{
judul,
url:embed
}

);

editID=null;

document
.getElementById(
"btnSave"
)
.innerText=
"Tambah Video";

}else{

const newData=

push(
ref(
db,
"Yotubecamat"
)

);

await set(
newData,
{
judul,
url:embed
}
);

}


document
.getElementById(
"judul"
).value="";

document
.getElementById(
"url"
).value="";

};



/* LOAD */

onValue(

ref(
db,
"Yotubecamat"
),

snap=>{

let html="";

if(
!snap.exists()
){

html=
`
<div class="empty">
Belum ada video
</div>
`;

}


snap.forEach(
child=>{

const id=
child.key;

const d=
child.val();

html+=`

<div class="videoCard">

<iframe
src="${d.url}"
allowfullscreen>
</iframe>

<div class="title">

${d.judul}

</div>

<button
class="editBtn"
onclick="
editYoutube(
'${id}'
)
">

Edit

</button>

<button
class="delBtn"
onclick="
hapusYoutube(
'${id}'
)
">

Hapus

</button>

</div>

`;

});

document
.getElementById(
"listYoutube"
).innerHTML=
html;

}

);



window.editYoutube=
async(id)=>{

const snap=

await get(

ref(
db,
`Yotubecamat/${id}`
)

);

const d=
snap.val();

document
.getElementById(
"judul"
).value=
d.judul;

document
.getElementById(
"url"
).value=
d.url;

editID=id;

document
.getElementById(
"btnSave"
)
.innerText=
"Update Video";

};



window.hapusYoutube=
async(id)=>{

if(
!confirm(
"Hapus video?"
)
)return;

await remove(

ref(
db,
`Yotubecamat/${id}`
)

);

};

</script>

</body>
</html>
