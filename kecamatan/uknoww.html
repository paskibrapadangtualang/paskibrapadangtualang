<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#0f6b20,#0a4d16);
  color:white;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* container */
.box{
  text-align:center;
  max-width:600px;
  padding:20px;
}

/* Gambar besar */
.box img{
  width:100%;
  max-width:320px;
  height:auto;
  margin-bottom:20px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%{transform:translateY(0px)}
  50%{transform:translateY(-10px)}
  100%{transform:translateY(0px)}
}

/* judul */
h1{
  font-size:24px;
  margin-bottom:10px;
}

/* teks */
p{
  font-size:14px;
  opacity:0.9;
  line-height:1.6;
}

/* loading bar */
.bar{
  width:100%;
  height:8px;
  background:rgba(255,255,255,0.2);
  border-radius:10px;
  overflow:hidden;
  margin-top:20px;
}

.bar span{
  display:block;
  height:100%;
  width:40%;
  background:#e5b800;
  animation:load 2s infinite;
}

@keyframes load{
  0%{width:10%}
  50%{width:90%}
  100%{width:10%}
}

/* button */
button{
  margin-top:20px;
  padding:10px 18px;
  border:none;
  border-radius:8px;
  background:#e5b800;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

  <!-- Gambar besar -->
  <img src="https://cdn-icons-png.flaticon.com/512/564/564619.png" alt="Maintenance">

  <h1>Website Sedang Maintenance</h1>

  <p>
    Sistem sedang dalam perbaikan untuk meningkatkan kualitas layanan.<br>
    Mohon kembali beberapa saat lagi.
  </p>

  <div class="bar">
    <span></span>
  </div>

  <button onclick="location.reload()">
    Coba Lagi
  </button>

</div>

</body>
</html>
