<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    padding-top:95px;

    background:#0f3d2e;

    padding:20px;

    color:white;

    padding-top:95px;

}

/* TITLE */

.title{

    position:fixed;

    top:0;
    left:0;

    width:100%;

    z-index:9999;

    text-align:center;

    font-size:30px;

    font-weight:700;

    padding:20px;

    background:
      rgba(15,61,46,0.92);

    backdrop-filter:blur(12px);

    box-shadow:
      0 4px 15px rgba(0,0,0,0.25);

}

/* GRID */

.grid{

    display:grid;

    grid-template-columns:
      repeat(2,1fr);

    gap:15px;

}

/* CARD */

.card{

    background:white;

    color:#111;

    border-radius:24px;

    overflow:hidden;

    box-shadow:
      0 8px 20px rgba(0,0,0,0.25);

    transition:0.3s;

    cursor:pointer;

}

.card:hover{

    transform:
      translateY(-5px);

}

/* IMG */

.card img{

    width:100%;

    height:180px;

    object-fit:cover;

}

/* CONTENT */

.content{

    padding:18px;

}

/* BADGE */

.badge{

    display:inline-block;

    background:#c40000;

    color:white;

    padding:8px 14px;

    border-radius:999px;

    font-size:11px;

    font-weight:600;

    margin-bottom:15px;

}

/* NAMA */

.content h3{

    font-size:20px;

    font-weight:700;

    margin-bottom:15px;

    color:#111827;

}

/* MINI BOX */

.mini-box{

    background:#f5f7fb;

    border-radius:14px;

    padding:12px;

    margin-bottom:12px;

    border:1px solid #e6ebf2;

}

/* LABEL */

.label{

    font-size:11px;

    font-weight:600;

    color:#6b7280;

    margin-bottom:5px;

}

/* VALUE */

.value{

    font-size:14px;

    font-weight:600;

    color:#111827;

}

/* BUTTON */

.detail-btn{

    width:100%;

    border:none;

    background:#0f3d2e;

    color:white;

    padding:13px;

    border-radius:14px;

    font-weight:600;

    margin-top:8px;

    cursor:pointer;

}

/* MOBILE */

@media(max-width:480px){

    .grid{

        grid-template-columns:
          repeat(2,1fr);

        gap:12px;

    }

    .content{

        padding:14px;

    }

    .content h3{

        font-size:16px;

    }

    .value{

        font-size:12px;

    }

}




/* LOADER */
.loader{
  position:fixed;
  inset:0;
  background:#0f3d2e;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:99999;
  color:white;
}

.spinner{
  width:55px;
  height:55px;
  border-radius:50%;
  border:5px solid rgba(255,255,255,0.2);
  border-top:5px solid #ffffff;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  0%{ transform:rotate(0deg); }
  100%{ transform:rotate(360deg); }
}

.loader p{
  margin-top:12px;
  font-size:13px;
  opacity:0.9;
}


.page-header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  width:100%;

  font-weight:800;
  letter-spacing:1px;
  color:white;

  padding:18px 10px;

  box-shadow:0 6px 18px rgba(0,0,0,0.25);

  z-index:9999;
}

<header class="page-header">
    DATA BAKI

<div id="loader" class="loader">
  <div class="spinner"></div>

</div>



<div class="grid" id="listUsers"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* CONFIG */

const firebaseConfig = {

  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b"

};

/* INIT */

const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);

const listBaki =
  document.getElementById("listUsers");









/* =========================
MAINTENANCE GLOBAL
========================= */





/* =========================
MAINTENANCE GLOBAL
========================= */

async function cekMaintenance(){

try{

const snap =
await get(
ref(
db,
"maintenance"
)
);

if(
!snap.exists()
)
return;

const data =
snap.val();

// maintenance OFF

if(
data.aktif !== true
)
return;

// halaman sekarang

const page =
window.location.pathname
.toLowerCase();

// sudah di halaman maintenance

if(
page.includes(
"maintenance.html"
)
){
return;
}

// bypass admin

if(

page.includes(
"admin"
)

||

page.includes(
"bendahara"
)

){
return;
}

// redirect

window.location.href =
"https://paskibrapadangtualang.net/maintenance.html";

}catch(err){

console.log(
"Maintenance Error:",
err
);

}

}

cekMaintenance();

















/* REALTIME */

onValue(ref(db, "baki"), (snapshot)=>{

    const loader = document.getElementById("loader");

    // tampilkan loader saat mulai load
    loader.style.display = "flex";

    listBaki.innerHTML = "";

    if(!snapshot.exists()){
        loader.innerHTML = `
          <div class="spinner"></div>
          <p>Data belum tersedia</p>
        `;
        return;
    }

    snapshot.forEach((child)=>{

        const data = child.val();

        listBaki.innerHTML += `
        <div class="card"
          onclick="bukaDetail('${child.key}')"
        >

            <img src="${data.gambar}">

            <div class="content">

                <div class="badge">
                    ${data.jabatan}
                </div>

                <h3>${data.nama}</h3>

                <div class="mini-box">
                    <div class="label">ANAK DARI</div>
                    <div class="value">${data.anak}</div>
                </div>

                <div class="mini-box">
                    <div class="label">SEKOLAH</div>
                    <div class="value">${data.sekolah}</div>
                </div>

                <button class="detail-btn">
                    Lihat Detail
                </button>

            </div>

        </div>`;
    });

    // sembunyikan loader setelah selesai render
    loader.style.display = "none";

});

/* DETAIL */

window.bukaDetail = function(id){

    window.location.href =
      "detailbaki.html?id=" + id;

}

</script>

</body>
