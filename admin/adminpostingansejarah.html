<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Sejarah Paskibra</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f4f4;
}

.header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.form{
  background:white;
  padding:15px;
  margin:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input, textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  background:#c40000;
  color:white;
  border:none;
  padding:10px;
  width:100%;
  border-radius:8px;
  cursor:pointer;
}

.list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:140px;
  object-fit:cover;
}

.card-body{
  padding:10px;
}

.del{
  background:black;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">ADMIN SEJARAH PASKIBRA</div>

<div class="form">
  <input id="judul" placeholder="Judul">
  <input id="tahun" placeholder="Tahun">
  <textarea id="sejarah" placeholder="Isi sejarah"></textarea>

  <input type="file" id="file">

  <button onclick="uploadData()">SIMPAN</button>
</div>

<div class="list" id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, set, get, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ======================
   CLOUDINARY UPLOAD
   ====================== */
async function uploadImage(file){

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", "uploadgambar"); // preset kamu
  formData.append("cloud_name", "djxlbemky"); // cloud kamu

  const response = await fetch(
    `https://api.cloudinary.com/v1_1/djxlbemky/image/upload`,
    {
      method: "POST",
      body: formData
    }
  );

  const data = await response.json();

  if(!data.secure_url){
    throw new Error("Upload gagal");
  }

  return data.secure_url;
}

/* ======================
   SIMPAN DATA
   ====================== */
window.uploadData = async function(){

  const judul = document.getElementById("judul").value;
  const tahun = document.getElementById("tahun").value;
  const sejarah = document.getElementById("sejarah").value;
  const file = document.getElementById("file").files[0];

  if(!judul || !tahun || !sejarah || !file){
    alert("Lengkapi data!");
    return;
  }

  const imgUrl = await uploadImage(file);

  const newRef = push(ref(db, "postingansejarah"));

  await set(newRef, {
    judul,
    tahun,
    sejarah,
    gambar: imgUrl
  });

  alert("Data berhasil disimpan!");

  loadList();
}

/* ======================
   LOAD LIST
   ====================== */
function loadList(){

  const list = document.getElementById("list");

  onValue(ref(db, "postingansejarah"), (snap)=>{

    list.innerHTML = "";

    if(!snap.exists()){
      list.innerHTML = "Belum ada data";
      return;
    }

    const data = snap.val();

    Object.keys(data).forEach(id=>{

      const item = data[id];

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <img src="${item.gambar}">
        <div class="card-body">
          <b>${item.judul}</b><br>
          <small>${item.tahun}</small>
          <button class="del" onclick="hapus('${id}')">HAPUS</button>
        </div>
      `;

      list.appendChild(div);
    });

  });
}

/* ======================
   HAPUS DATA
   ====================== */
window.hapus = async function(id){

  if(confirm("Hapus data ini?")){
    await remove(ref(db, "postingansejarah/" + id));
    alert("Terhapus!");
  }
}

loadList();

</script>

</body>
</html>
