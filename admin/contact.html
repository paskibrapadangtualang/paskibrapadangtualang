<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Kontak Paskibra</title>

<style>
body{
  font-family:Arial;
  background:#f4f6fb;
  margin:0;
  padding:20px;
}

h2{
  text-align:center;
  color:#c40000;
  margin-bottom:20px;
}

/* FORM */
.box{
  max-width:500px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input, textarea{
  width:50%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:10px;
  background:#c40000;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:5px;
}

button:hover{
  background:#a00000;
}

/* MONITOR */
.monitor{
  max-width:500px;
  margin:20px auto;
  background:white;
  padding:15px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.item{
  background:#f9f9f9;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  font-size:14px;
}

.item b{
  color:#c40000;
}

.del{
  background:black;
  font-size:12px;
  margin-top:8px;
}
</style>
</head>

<body>

<h2>ADMIN KONTAK PASKIBRA</h2>

<!-- FORM -->
<div class="box">

  <input id="alamat" placeholder="Alamat">
  <input id="telepon" placeholder="Telepon">
  <input id="email" placeholder="Email">

  <button onclick="saveKontak()">
    Simpan / Update Kontak
  </button>

  <button onclick="resetKontak()" style="background:#333;">
    Reset Dummy
  </button>

</div>

<!-- MONITOR -->
<div class="monitor">

  <h3 style="color:#c40000;text-align:center;">
    Monitoring Kontak
  </h3>

  <div id="list"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const kontakRef = ref(db, "kontak");

// =========================
// LOAD DATA
// =========================
async function load(){

  const snap = await get(kontakRef);

  const defaultData = {
    alamat:"Padang Tualang, Langkat",
    telepon:"081234567890",
    email:"paskibrapadangtualang@gmail.com"
  };

  if(!snap.exists()){
    await set(kontakRef, defaultData);
    return load();
  }

  const data = snap.val();

  document.getElementById("alamat").value = data.alamat;
  document.getElementById("telepon").value = data.telepon;
  document.getElementById("email").value = data.email;

  document.getElementById("list").innerHTML = `
    <div class="item">
      <b>Alamat:</b> ${data.alamat}<br>
      <b>Telepon:</b> ${data.telepon}<br>
      <b>Email:</b> ${data.email}<br>

      <button class="del" onclick="hapus()">
        Hapus Kontak
      </button>
    </div>
  `;
}

// =========================
// SIMPAN / UPDATE
// =========================
window.saveKontak = async function(){

  const alamat = document.getElementById("alamat").value;
  const telepon = document.getElementById("telepon").value;
  const email = document.getElementById("email").value;

  if(!alamat || !telepon || !email){
    alert("Lengkapi data!");
    return;
  }

  await set(kontakRef,{
    alamat,
    telepon,
    email
  });

  alert("Kontak berhasil disimpan");
  load();
}

// =========================
// RESET DUMMY
// =========================
window.resetKontak = async function(){

  const dummy = {
    alamat:"Padang Tualang, Langkat",
    telepon:"081234567890",
    email:"paskibrapadangtualang@gmail.com"
  };

  await set(kontakRef, dummy);

  alert("Kontak reset ke default");
  load();
}

// =========================
// HAPUS
// =========================
window.hapus = async function(){

  await remove(kontakRef);

  alert("Kontak dihapus");
  load();
}

load();

</script>

</body>
</html>
