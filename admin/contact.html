<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Admin Kontak Paskibra</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:
linear-gradient(
135deg,
#fff5f5,
#f1f5ff
);

padding:20px;
}

.header{

background:
linear-gradient(
135deg,
#c40000,
#8a0000
);

padding:25px;

border-radius:25px;

color:white;

margin-bottom:20px;

box-shadow:
0 10px 30px
rgba(196,0,0,.2);
}

.header h2{
font-size:24px;
}

.header p{
margin-top:8px;
opacity:.9;
}

.box{

background:white;

padding:20px;

border-radius:25px;

margin-bottom:20px;

box-shadow:
0 8px 25px
rgba(0,0,0,.08);

}

.input{

margin-bottom:14px;
}

.input label{
display:block;
margin-bottom:6px;
font-weight:bold;
color:#444;
}

input,textarea{

width:100%;

padding:13px;

border-radius:14px;

border:1px solid #ddd;

outline:none;

font-size:14px;
}

textarea{
resize:none;
height:90px;
}

.btns{
display:grid;

grid-template-columns:
1fr 1fr;

gap:10px;

margin-top:10px;
}

button{

padding:13px;

border:none;

border-radius:14px;

cursor:pointer;

font-weight:bold;

color:white;
}

.save{
background:#c40000;
}

.reset{
background:#555;
}

.delete{
background:black;
margin-top:12px;
width:100%;
}

.preview{

background:white;

padding:20px;

border-radius:25px;

box-shadow:
0 8px 25px
rgba(0,0,0,.08);

}

.preview h3{
color:#c40000;
margin-bottom:15px;
}

.card{

background:
linear-gradient(
135deg,
#c40000,
#700000
);

color:white;

padding:20px;

border-radius:20px;
}

.row{
margin-bottom:12px;
line-height:1.7;
}

.social{

display:flex;
gap:10px;

flex-wrap:wrap;

margin-top:15px;
}

.tag{

background:
rgba(255,255,255,.15);

padding:8px 12px;

border-radius:30px;

font-size:12px;
}

</style>
</head>

<body>

<div class="header">

<h2>
ADMIN KONTAK PASKIBRA
</h2>

<p>
Kelola footer website dan media sosial
</p>

</div>

<div class="box">

<div class="input">
<label>Alamat</label>
<textarea id="alamat"></textarea>
</div>

<div class="input">
<label>Telepon</label>
<input id="telepon">
</div>

<div class="input">
<label>Email</label>
<input id="email">
</div>

<div class="input">
<label>Facebook</label>
<input id="facebook">
</div>

<div class="input">
<label>Instagram</label>
<input id="instagram">
</div>

<div class="input">
<label>WhatsApp</label>
<input id="whatsapp">
</div>

<div class="input">
<label>YouTube</label>
<input id="youtube">
</div>

<div class="input">
<label>Deskripsi</label>
<textarea id="deskripsi"></textarea>
</div>

<div class="btns">

<button
class="save"
onclick="saveKontak()">

Simpan

</button>

<button
class="reset"
onclick="resetKontak()">

Reset Dummy

</button>

</div>

<button
class="delete"
onclick="hapus()">

Hapus Kontak

</button>

</div>

<div class="preview">

<h3>
Preview Footer
</h3>

<div
class="card"
id="list">

Loading...

</div>

</div>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
get,
set,
remove
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={

apiKey:"AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",

authDomain:"paskibra2026-300eb.firebaseapp.com",

databaseURL:"https://paskibra2026-300eb-default-rtdb.firebaseio.com",

projectId:"paskibra2026-300eb",

storageBucket:"paskibra2026-300eb.firebasestorage.app",

messagingSenderId:"937469132434",

appId:"1:937469132434:web:d1924e1160350000d1b04b"

};

const app=
initializeApp(firebaseConfig);

const db=
getDatabase(app);

const kontakRef=
ref(db,"kontak");

async function load(){

const snap=
await get(kontakRef);

if(!snap.exists()){

await resetKontak();

return;

}

const d=
snap.val();

for(
let k in d
){

const el=
document.getElementById(k);

if(el)
el.value=d[k];

}

render(d);

}

function render(d){

document.getElementById(
"list"
).innerHTML=`

<div class=row>
📍 ${d.alamat||"-"}
</div>

<div class=row>
☎ ${d.telepon||"-"}
</div>

<div class=row>
✉ ${d.email||"-"}
</div>

<div class=row>
${d.deskripsi||""}
</div>

<div class=social>

<div class=tag>
Facebook
</div>

<div class=tag>
Instagram
</div>

<div class=tag>
WhatsApp
</div>

<div class=tag>
YouTube
</div>

</div>

`;

}

window.saveKontak=
async function(){

const data={

alamat:
alamat.value,

telepon:
telepon.value,

email:
email.value,

facebook:
facebook.value,

instagram:
instagram.value,

whatsapp:
whatsapp.value,

youtube:
youtube.value,

deskripsi:
deskripsi.value

};

await set(
kontakRef,
data
);

alert(
"Berhasil disimpan"
);

load();

};

window.resetKontak=
async function(){

const dummy={

alamat:
"Padang Tualang, Langkat, Sumatra Utara",

email:
"paskibrapadangtualang@gmail.com",

telepon:
"+62319",

facebook:
"https://facebook.com/PaskibraPadangTualang",

instagram:
"https://instagram.com/paskibrapadangtualang",

whatsapp:
"https://wa.me/6262319",

youtube:
"https://youtube.com/@paskibrapadangtualang",

deskripsi:
"Portal resmi informasi kegiatan Paskibra Padang Tualang"

};

await set(
kontakRef,
dummy
);

load();

};

window.hapus=
async function(){

if(
!confirm(
"Hapus kontak?"
)
)return;

await remove(
kontakRef
);

load();

};

load();

</script>

</body>
</html>
