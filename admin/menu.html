<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Menu Lainnya</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:
    linear-gradient(
      180deg,
      #0f3d2e,
      #071d15
    );

  min-height:100vh;
  color:white;

  padding:
    20px
    20px
    120px;
}

/* HEADER */

.header{
  text-align:center;
  margin-bottom:35px;
}

.header h1{
  font-size:30px;
  letter-spacing:1px;
}

.header p{
  margin-top:8px;
  opacity:0.8;
  font-size:14px;
}

/* MENU GRID */

.menu-grid{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:18px;

  max-width:700px;
  margin:auto;
}

/* CARD */

.menu-card{
  background:
    rgba(255,255,255,0.08);

  backdrop-filter:blur(8px);

  border:
    1px solid rgba(255,255,255,0.08);

  border-radius:24px;

  padding:25px 15px;

  text-decoration:none;

  color:white;

  display:flex;
  flex-direction:column;
  align-items:center;

  transition:0.3s;
}

/* ICON */

.menu-icon{
  width:75px;
  height:75px;

  background:white;

  border-radius:22px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:15px;

  box-shadow:
    0 4px 15px rgba(0,0,0,0.2);
}

.menu-icon img{
  width:42px;
  height:42px;
  object-fit:contain;
}

/* TEXT */

.menu-card span{
  font-size:14px;
  font-weight:bold;
  text-align:center;
  line-height:1.4;
}

/* HOVER */

.menu-card:hover{
  transform:translateY(-6px);
  background:
    rgba(255,255,255,0.14);
}

.menu-card:hover .menu-icon{
  background:#ffd700;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;

  bottom:0;
  left:0;

  width:100%;

  background:
    rgba(10,10,10,0.95);

  backdrop-filter:blur(10px);

  display:flex;
  justify-content:space-around;

  padding:12px 10px;

  border-top:
    1px solid rgba(255,255,255,0.08);

  z-index:999;
}

.bottom-btn{
  text-decoration:none;
  color:white;

  display:flex;
  flex-direction:column;
  align-items:center;

  font-size:11px;

  opacity:0.8;

  transition:0.3s;
}

.bottom-btn img{
  width:24px;
  height:24px;
  margin-bottom:5px;
  object-fit:contain;
}

.bottom-btn.active{
  color:#ffd700;
  opacity:1;
}

.bottom-btn:hover{
  transform:translateY(-2px);
}

/* RESPONSIVE */

@media(max-width:500px){

  .menu-grid{
    grid-template-columns:1fr 1fr;
  }

}

</style>
</head>
<body>

<!-- HEADER -->

<div class="header">

  <h1>MENU LAINNYA</h1>

  <p>
    Fitur tambahan panel Paskibra
  </p>

</div>

<!-- MENU -->

<div class="menu-grid">

  <!-- MENU 1 -->
  <a href="lapangan.html" class="menu-card">

    <div class="menu-icon">
      <img src="assets/images/Peta lampangan.png">
    </div>

    <span>
      PETA LAPANGAN
    </span>

  </a>

  <!-- MENU 2 -->
  <a href="addanton.html" class="menu-card">

    <div class="menu-icon">
      <img src="../assets/images/DANTON.png">
    </div>

    <span>
      SET DANTON
    </span>

  </a>

  <!-- MENU 3 -->
  <a href="addbaki.html" class="menu-card">

    <div class="menu-icon">
      <img src="assets/images/baki2.png">
    </div>

    <span>
      BAKI
    </span>

  </a>

  <!-- MENU 4 -->
  <a href="#" class="menu-card">

    <div class="menu-icon">
      <img src="assets/images/jadwal.png">
    </div>

    <span>
      JADWAL KEGIATAN
    </span>

  </a>

  <!-- MENU 5 -->
  <a href="#" class="menu-card">

    <div class="menu-icon">
      <img src="assets/images/purna.png">
    </div>

    <span>
      DATA PURNA
    </span>

  </a>

  <!-- MENU 6 -->
  <a href="#" class="menu-card">

    <div class="menu-icon">
      <img src="assets/images/album.png">
    </div>

    <span>
      ALBUM FOTO
    </span>

  </a>

</div>

</script>
</body>
</html>
