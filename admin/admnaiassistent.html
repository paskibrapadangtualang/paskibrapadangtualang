/* =========================
   DETECT WEBSITE FEATURES
========================= */

function detectFeatures(html){

  html = html.toLowerCase();

  let features = [];

  const checks = {

    "Dashboard":[
      "dashboard",
      "panel"
    ],

    "Login":[
      "login",
      "sign in",
      "masuk"
    ],

    "Register":[
      "register",
      "daftar"
    ],

    "Firebase":[
      "firebase"
    ],

    "Admin":[
      "admin"
    ],

    "Absensi":[
      "absensi"
    ],

    "Kas":[
      "kas"
    ],

    "PWA":[
      "manifest",
      "service-worker"
    ],

    "AI":[
      "openai",
      "gpt",
      "gemini"
    ]

  };

  Object.keys(checks).forEach(feature=>{

    let found = checks[feature].some(keyword=>
      html.includes(keyword)
    );

    if(found){
      features.push(feature);
    }

  });

  return features;

}

/* =========================
   SCAN WEBSITE
========================= */

window.scanWebsite = async function(){

  let url =
    document.getElementById("url")
    .value
    .trim();

  if(!url){
    alert("Masukkan URL");
    return;
  }

  try{

    addChat(
      "🔍 Sedang scan website...",
      "ai"
    );

    const res = await fetch(
      "https://api.allorigins.win/raw?url=" +
      encodeURIComponent(url)
    );

    const html = await res.text();

    const parser = new DOMParser();

    const doc = parser.parseFromString(
      html,
      "text/html"
    );

    const title =
      doc.querySelector("title")
      ?.innerText || "Tanpa Judul";

    const features =
      detectFeatures(html);

    const newRef =
      push(ref(db,"aiWebsite"));

    await set(newRef,{

      url,
      title,
      features,
      createdAt:Date.now()

    });

    addChat(
      `✅ Website berhasil di-scan:
      ${title}`,
      "ai"
    );

    document.getElementById("url").value="";

  }catch(err){

    console.log(err);

    addChat(
      "❌ Gagal scan website",
      "ai"
    );

  }

}

/* =========================
   SAVE MEMORY AI
========================= */

window.saveMemory = async function(){

  let keyword =
    document.getElementById("keyword")
    .value
    .trim();

  let answer =
    document.getElementById("answer")
    .value
    .trim();

  /* VALIDASI */

  if(!keyword || !answer){

    alert("Lengkapi data");

    return;

  }

  /* =========================
     FORMAT KEYWORDS
  ========================= */

  let keywords = keyword

    .toLowerCase()

    .split(" ")

    .filter(k => k.trim() !== "")

    .map(k => {

      /* HAPUS # LAMA */

      k = k.replaceAll("#","");

      /* TAMBAHKAN # */

      return "#" + k;

    });

  /* =========================
     FORMAT JAWABAN
  ========================= */

  answer = answer

    /* HAPUS SPASI BERLEBIH */
    .replace(/[ \t]+/g," ")

    /* RAPIKAN ENTER */
    .replace(/\n{3,}/g,"\n\n")

    .trim();

  try{

    /* =========================
       SIMPAN FIREBASE
    ========================= */

    const newRef =
      push(ref(db,"aiCustomMemory"));

    await set(newRef,{

      keywords,
      answer,
      createdAt:Date.now()

    });

    /* RESET INPUT */

    document.getElementById(
      "keyword"
    ).value = "";

    document.getElementById(
      "answer"
    ).value = "";

    /* SUCCESS */

    alert(
      "✅ Memory AI berhasil disimpan"
    );

  }catch(err){

    console.log(err);

    alert(
      "❌ Gagal menyimpan memory"
    );

  }

}

/* =========================

function loadMemory(){

  onValue(
    ref(db,"aiCustomMemory"),
    snap=>{

      const data =
        snap.val() || {};

      let html = "";

      Object.entries(data)
      .reverse()
      .forEach(([id,item])=>{

        html += `

        <div class="item">

          <div class="memory-top">

            <div class="memory-key">

              🏷️ ${
                item.keywords
                ?.join(" ")
                || "-"
              }

            </div>

            <button
              class="delete-btn"
              onclick="deleteMemory('${id}')"
            >
              Hapus
            </button>

          </div>

          <div class="memory-answer">

            ${item.answer}

          </div>

        </div>

        `;

      });

      document
      .getElementById("memory")
      .innerHTML = html;

    }
  );

}

function addChat(text,type){
