<!-- admin/index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f172a;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-box{
  width:350px;
  background:#fff;
  padding:30px;
  border-radius:15px;
}

h2{
  text-align:center;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border-radius:10px;
  border:1px solid #ccc;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

.loading{
  display:none;
  text-align:center;
  margin-top:15px;
  color:#2563eb;
}

</style>
</head>
<body>

<div class="login-box">

<h2>ADMIN PANEL</h2>

<input
  type="email"
  id="email"
  placeholder="Masukkan email admin"
/>

<input
  type="password"
  id="password"
  placeholder="Masukkan password"
/>

<button onclick="loginAdmin()">
Login Admin
</button>

<div class="loading" id="loading">
Memproses login...
</div>

</div>

<script type="module">

// FIREBASE

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,
  ref,
  get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// CONFIG

const firebaseConfig = {

  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b",
  measurementId: "G-1KGNVS3MRX"

};

// INIT

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getDatabase(app);

// LOGIN ADMIN

window.loginAdmin = async function(){

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const loading =
    document.getElementById("loading");

  if(email === "" || password === ""){

    alert("Lengkapi email dan password");

    return;

  }

  try{

    loading.style.display = "block";

    // LOGIN AUTH

    const userCredential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    const user =
      userCredential.user;

    // CEK ADMIN DATABASE

    const adminRef =
      ref(db, "admin/" + user.uid);

    const snapshot =
      await get(adminRef);

    // JIKA BUKAN ADMIN

    if(!snapshot.exists()){

      loading.style.display = "none";

      alert("Akun ini bukan admin");

      return;

    }

    // SIMPAN SESSION

    localStorage.setItem(
      "adminLogin",
      "true"
    );

    localStorage.setItem(
      "adminUID",
      user.uid
    );

    localStorage.setItem(
      "adminData",
      JSON.stringify(snapshot.val())
    );

    // MASUK DASHBOARD

    window.location.href =
      "dashboard.html";

  }catch(error){

    loading.style.display = "none";

    alert(
      "Email atau password salah"
    );

  }

}

</script>

</body>
</html>
