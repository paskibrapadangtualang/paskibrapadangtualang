<!-- admin/index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:url('assets/images/RI.webp') center center / cover no-repeat;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-box{
  width:350px;
  background:#d6d6d6;
  padding:30px;
  border-radius:15px;
}

h2{
  text-align:center;
  margin-bottom:5px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border-radius:10px;
  border:1px solid #ccc;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-bottom:10px;
}

button:hover{
  opacity:0.9;
}

.loading{
  display:none;
  text-align:center;
  margin-top:15px;
  color:#2563eb;
}

.menu{
  margin-top:15px;
  text-align:center;
}

.menu a{
  display:block;
  margin-top:10px;
  color:#2563eb;
  text-decoration:none;
  font-size:14px;
}

.menu a:hover{
  text-decoration:underline;
}

.reset-btn{
  background:#f59e0b;
}


.logo-box{
  text-align:center;
  margin-bottom:25px;
}

.logo-img{
  width:90px;
  height:90px;
  object-fit:contain;
  margin-bottom:12px;
}

.logo-box h2{
  color:#8f8f8f;
  font-size:28px;
  font-weight:bold;
  letter-spacing:1px;
  border-radius: 10px;
}



.shine-text{
  position:relative;
  display:inline-block;
  color:white;
  font-size:28px;
  font-weight:bold;
  letter-spacing:1px;
  overflow:hidden;
}

/* EFEK MENGILAT */
.shine-text::after{
  content:"";
  position:absolute;
  top:0;
  left:-75%;
  width:50%;
  height:100%;

  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.9),
    transparent
  );

  transform:skewX(-25deg);

  animation:shine 2.5s infinite;
}

@keyframes shine{

  0%{
    left:-75%;
  }

  100%{
    left:130%;
  }

}
</style>
</head>
<body>

<div class="login-box">

<div class="logo-box">

  <img
    src="assets/images/RI.webp"
    class="logo-img"
  >

  <h2 class="shine-text">
  ADMIN PANEL
</h2>

</div>

<input
  type="email"
  id="email"
  placeholder="Masukkan email admin"
/>

<input
  type="password"
  id="password"
  placeholder="Masukkan password"
/>

<button onclick="loginAdmin()">
Login Admin
</button>

<button
class="reset-btn"
onclick="resetPassword()">

Atur Ulang Password

</button>

<div class="loading" id="loading">
Memproses login...
</div>

<div class="menu">

<a href="daftaradmin.html">
Daftar Akun Admin
</a>

</div>

</div>

<script type="module">

// FIREBASE

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,
  ref,
  get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// CONFIG

const firebaseConfig = {

  apiKey: "AIzaSyBextWTeGMT1x9c1MHOv4GoHXP8OgW2WsY",
  authDomain: "paskibra2026-300eb.firebaseapp.com",
  databaseURL: "https://paskibra2026-300eb-default-rtdb.firebaseio.com",
  projectId: "paskibra2026-300eb",
  storageBucket: "paskibra2026-300eb.firebasestorage.app",
  messagingSenderId: "937469132434",
  appId: "1:937469132434:web:d1924e1160350000d1b04b",
  measurementId: "G-1KGNVS3MRX"

};

// INIT

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getDatabase(app);

// LOGIN ADMIN

window.loginAdmin = async function(){

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const loading =
    document.getElementById("loading");

  if(email === "" || password === ""){

    alert("Lengkapi email dan password");

    return;

  }

  try{

    loading.style.display = "block";

    // LOGIN AUTH

    const userCredential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    const user =
      userCredential.user;

    // CEK ADMIN DATABASE

    const adminRef =
      ref(db, "admin/" + user.uid);

    const snapshot =
      await get(adminRef);

    // JIKA BUKAN ADMIN

    if(!snapshot.exists()){

      loading.style.display = "none";

      alert("Akun ini bukan admin");

      return;

    }

    const adminData =
      snapshot.val();

    // STATUS PENDING

    if(adminData.status === "pending"){

      loading.style.display = "none";

      alert(
        "Akun ini belum disetujui oleh admin utama untuk login"
      );

      return;

    }

    // STATUS DITOLAK

    if(adminData.status === "ditolak"){

      loading.style.display = "none";

      alert(
        "Akun anda ditolak oleh admin utama"
      );

      return;

    }

    // SIMPAN SESSION

    localStorage.setItem(
      "adminLogin",
      "true"
    );

    localStorage.setItem(
      "adminUID",
      user.uid
    );

    localStorage.setItem(
      "adminData",
      JSON.stringify(snapshot.val())
    );

    // MASUK DASHBOARD

    window.location.href =
      "dashboard.html";

  }catch(error){

    loading.style.display = "none";

    alert(
      "Email atau password salah"
    );

  }

}

// RESET PASSWORD

window.resetPassword = async function(){

  const email =
    document.getElementById("email").value;

  if(email === ""){

    alert(
      "Masukkan email terlebih dahulu"
    );

    return;

  }

  try{

    await sendPasswordResetEmail(
      auth,
      email
    );

    alert(
      "Link reset password berhasil dikirim ke email"
    );

  }catch(error){

    alert(
      "Gagal mengirim reset password"
    );

  }

}

</script>

</body>
</html>
