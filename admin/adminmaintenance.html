<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Admin Maintenance
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:
"Segoe UI",
Arial,
sans-serif;
}

body{

background:
linear-gradient(
180deg,
#f4f7fb,
#e8eef5
);

min-height:100vh;

padding:25px;

color:#1e293b;

}

/* WRAPPER */

.container{

max-width:1300px;

margin:auto;

display:grid;

grid-template-columns:
1.1fr
0.9fr;

gap:25px;

align-items:start;

}

/* HEADER */

.header{

max-width:1300px;

margin:auto auto 25px;

padding:28px;

border-radius:28px;

background:
linear-gradient(
135deg,
#9b0000,
#d40000
);

color:white;

box-shadow:
0 20px 40px
rgba(
155,
0,
0,
.18
);

position:relative;

overflow:hidden;

}

.header::after{

content:"";

position:absolute;

right:-50px;
top:-50px;

width:180px;
height:180px;

border-radius:50%;

background:
rgba(
255,
255,
255,
.08
);

}

.header h1{

font-size:30px;

font-weight:700;

margin-bottom:8px;

}

.header p{

opacity:.9;

font-size:14px;

}

/* CARD */

.card{

background:
rgba(
255,
255,
255,
.95
);

backdrop-filter:
blur(
15px
);

padding:28px;

border-radius:28px;

box-shadow:
0 10px 30px
rgba(
0,
0,
0,
.06
);

}

/* LABEL */

.label{

font-size:13px;

font-weight:700;

margin-bottom:8px;

color:#475569;

}

/* INPUT */

input,
textarea{

width:100%;

padding:16px;

border-radius:18px;

border:
1px solid #dbe2ea;

outline:none;

font-size:14px;

margin-bottom:18px;

transition:.3s;

background:#fff;

}

input:focus,
textarea:focus{

border-color:#c40000;

box-shadow:
0 0 0 5px
rgba(
196,
0,
0,
.08
);

}

textarea{

height:150px;

resize:none;

}

/* SWITCH */

.switch-box{

display:flex;

justify-content:space-between;

align-items:center;

padding:18px;

border-radius:20px;

background:

linear-gradient(
135deg,
#f8fafc,
#edf2f7
);

margin-bottom:22px;

}

.switch{

width:72px;

height:36px;

appearance:none;

border-radius:30px;

background:#b7bcc2;

position:relative;

cursor:pointer;

transition:.3s;

}

.switch:checked{

background:#16a34a;

}

.switch::before{

content:"";

position:absolute;

width:28px;
height:28px;

left:4px;
top:4px;

background:white;

border-radius:50%;

transition:.3s;

}

.switch:checked::before{

left:40px;

}

/* BUTTON */

button{

width:100%;

padding:17px;

border:none;

border-radius:18px;

background:

linear-gradient(
135deg,
#c40000,
#860000
);

color:white;

font-size:15px;

font-weight:700;

cursor:pointer;

transition:.3s;

box-shadow:
0 12px 24px
rgba(
196,
0,
0,
.18
);

}

button:hover{

transform:
translateY(-3px);

}

/* PREVIEW */

.preview-box{

background:

linear-gradient(
180deg,
#ffffff,
#f8fafc
);

padding:22px;

border-radius:22px;

min-height:350px;

border:
1px solid #eef2f7;

}

.preview-box h3{

margin-bottom:18px;

font-size:18px;

}

#preview{

line-height:1.8;

}

#preview img{

width:100%;

max-height:260px;

object-fit:contain;

margin-top:20px;

border-radius:18px;

background:#fff;

padding:10px;

}

/* STATUS */

.status{

display:inline-flex;

align-items:center;

padding:10px 16px;

border-radius:999px;

font-size:12px;

font-weight:700;

margin-bottom:18px;

}

.on{

background:#dcfce7;

color:#15803d;

}

.off{

background:#fee2e2;

color:#b91c1c;

}

/* RESPONSIVE */

@media(
max-width:980px
){

.container{

grid-template-columns:
1fr;

}

.header h1{

font-size:24px;

}

}

@media(
max-width:600px
){

body{

padding:15px;

}

.card{

padding:20px;

border-radius:22px;

}

.header{

padding:22px;

border-radius:22px;

}

.header h1{

font-size:22px;

}

button{

padding:15px;

}

}

</style>
</head>

<body>

<div class="header">

<h1>
ADMIN MAINTENANCE
</h1>

<p>
Kelola mode maintenance website
</p>

</div>

<div class="container">

<div class="card">

<div class="switch-box">

<span>
Aktifkan Maintenance
</span>

<input
type="checkbox"
id="aktif"
class="switch"
>

</div>

<div class="label">
Judul
</div>

<input
id="judul"
placeholder="Judul maintenance"
>

<div class="label">
Pesan
</div>

<textarea
id="pesan"
placeholder="Pesan maintenance"
></textarea>

<div class="label">
Gambar
</div>

<input
id="gambar"
placeholder="assets/images/maintenance.png"
>

<button
onclick="simpan()"
>

SIMPAN DATA

</button>

</div>

<div class="card">

<h3>
Preview
</h3>

<div id="preview">
Loading...
</div>

</div>

</div>

<script>

/* =====================
CEK LOGIN ADMIN
========================= */

const adminLogin =
localStorage.getItem(
"adminLogin"
);

if(
adminLogin !== "true"
){

alert(
"Silakan login admin terlebih dahulu"
);

window.location.href=
"index.html";

}

/* =========================
LOAD DATA
========================= */

import(
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"
).then(async(firebaseApp)=>{

const {
initializeApp
}=firebaseApp;

const firebaseDatabase=
await import(
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"
);

const {
getDatabase,
ref,
get,
set
}=firebaseDatabase;

const firebaseConfig={

apiKey:
"AIzaSyBextWTeGMT1x1MHOv4GoHXP8OgW2WsY",

authDomain:
"paskibra2026-300eb.firebaseapp.com",

databaseURL:
"https://paskibra2026-300eb-default-rtdb.firebaseio.com",

projectId:
"paskibra2026-300eb",

storageBucket:
"paskibra2026-300eb.firebasestorage.app",

messagingSenderId:
"937469132434",

appId:
"1:937469132434:web:d1924e1160350000d1b04b"

};

const app=
initializeApp(
firebaseConfig
);

const db=
getDatabase(
app
);

const maintenanceRef=
ref(
db,
"maintenance"
);

/* LOAD */

async function load(){

const snap=
await get(
maintenanceRef
);

if(
!snap.exists()
)
return;

const data=
snap.val();

aktif.checked=
data.aktif || false;

judul.value=
data.judul || "";

pesan.value=
data.pesan || "";

gambar.value=
data.gambar || "";

render(
data
);

}

/* PREVIEW */

function render(data){

preview.innerHTML=`

<div class="
status
${data.aktif?'on':'off'}
">

${data.aktif
?
'MAINTENANCE AKTIF'
:
'SISTEM NORMAL'
}

</div>

<h2>

${data.judul||''}

</h2>

<p>

${data.pesan||''}

</p>

<img src="
${data.gambar||''}
">

`;

}

/* SIMPAN */

window.simpan=
async function(){

const data={

aktif:
aktif.checked,

judul:
judul.value,

pesan:
pesan.value,

gambar:
gambar.value,

updatedAt:
Date.now()

};

await set(
maintenanceRef,
data
);

alert(
"Berhasil disimpan"
);

render(
data
);

};

load();

});

</script>

</body>
</html>
