window.hapusHistory = function(id, userId, bulan, hari, nominal){

  const yakin = confirm("Yakin mau hapus?");
  if(!yakin) return;

  // hapus history admin
  remove(ref(db, "cashHistory/" + id));

  const jumlahHari = Math.ceil(nominal / 2000);

  for(let i=0;i<jumlahHari;i++){

    const baseDate = new Date(
      Number(bulan.split("-")[0]),
      Number(bulan.split("-")[1]) - 1,
      Number(hari) + i
    );

    const hariTarget = baseDate.getDate();

    const bulanFix =
      baseDate.getFullYear() + "-" +
      String(baseDate.getMonth()+1).padStart(2,"0");

    const path =
      `users/${userId}/cash/${bulanFix}/${hariTarget}`;

    remove(ref(db, path));
  }

  alert("History & kalender berhasil dihapus");

}

        belumBayar.push(u.namaLengkap);

    });

window.bayar = function(){

  const nominal = Number(document.getElementById("nominal").value);
  const metode = document.getElementById("metode").value;

  if(!selectedUserId){
    alert("Pilih user!");
    return;
  }

  const jumlahHari = Math.ceil(nominal / 2000);

  // ambil semua data cash user
  onValue(ref(db, `users/${selectedUserId}/cash`), (snap)=>{

    const semuaCash = snap.val() || {};

    // mulai dari hari kemarin
    let tanggalTerakhir = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() - 1
    );

    // cari tanggal hijau terakhir
    Object.keys(semuaCash).forEach(bln=>{

      Object.keys(semuaCash[bln] || {}).forEach(h=>{

        const tgl = new Date(
          Number(bln.split("-")[0]),
          Number(bln.split("-")[1]) - 1,
          Number(h)
        );

        if(tgl > tanggalTerakhir){
          tanggalTerakhir = tgl;
        }

      });

    });

    // mulai setelah tanggal terakhir
    const mulaiTanggal = new Date(tanggalTerakhir);
    mulaiTanggal.setDate(mulaiTanggal.getDate() + 1);

    // simpan history admin
    const data = {
      userId: selectedUserId,
      nama: selectedUserName,
      nominal: nominal,
      metode: metode,

      bulan:
        mulaiTanggal.getFullYear() + "-" +
        String(mulaiTanggal.getMonth()+1).padStart(2,"0"),

      mulaiHari: mulaiTanggal.getDate(),

      jumlahHari: jumlahHari,

      waktu: new Date().toLocaleString("id-ID"),

      tanggalISO: now.toISOString()
    };

    push(ref(db,"cashHistory"), data);

    // isi kalender otomatis lanjut
    for(let i=0;i<jumlahHari;i++){

      const baseDate = new Date(mulaiTanggal);

      baseDate.setDate(baseDate.getDate() + i);

      const hariTarget = baseDate.getDate();

      const bulanKeyFix =
        baseDate.getFullYear() + "-" +
        String(baseDate.getMonth()+1).padStart(2,"0");

      set(
        ref(db, `users/${selectedUserId}/cash/${bulanKeyFix}/${hariTarget}`),
        {
          status:"paid",
          nominal:2000,
          metode:metode,
          waktu:new Date().toLocaleString("id-ID")
        }
      );

    }

    alert("Pembayaran berhasil ditambahkan!");

  }, {
    onlyOnce:true
  });

}
